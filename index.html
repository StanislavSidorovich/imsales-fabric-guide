\u003e","ru":"Открылся редактор Power Query. На панели нажмите \u003cb\u003eGet data\u003c/b\u003e. \u003ci\u003eЗачем: нужно указать dataflow, где лежит исходный файл.\u003c/i\u003e"},{"img":"39. select lhs.png","act":"click","box":[15.25,44.47,39.35,3.67],"en":"In \u003cb\u003eOneLake catalog\u003c/b\u003e choose your lakehouse \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e. \u003ci\u003eWhy: the source files are in the lakehouse we filled earlier.\u003c/i\u003e","ru":"В \u003cb\u003eOneLake catalog\u003c/b\u003e выберите свой lakehouse \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e. \u003ci\u003eЗачем: исходные файлы лежат в lakehouse, который мы заполнили раньше.\u003c/i\u003e"},{"img":"40. select shippers csv.png","act":"select","box":[9.9,49.59,22.2,2.76],"en":"Open \u003cb\u003eFiles\u003c/b\u003e, then \u003cb\u003esource data\u003c/b\u003e, and tick \u003cb\u003e2026-2027 IMSALES Shippers.csv\u003c/b\u003e. \u003ci\u003eWhy: we start with one dimension, shippers, as an example.\u003c/i\u003e","ru":"Откройте \u003cb\u003eFiles\u003c/b\u003e, затем \u003cb\u003esource data\u003c/b\u003e и поставьте галочку у \u003cb\u003e2026-2027 IMSALES Shippers.csv\u003c/b\u003e. \u003ci\u003eЗачем: начинаем с одного измерения, shippers, как с примера.\u003c/i\u003e"},{"img":"41. shippers csv create.png","act":"click","box":[90.0,91.42,4.4,3.84],"en":"The preview shows the file. Click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eThis loads the file into Power Query.\u003c/i\u003e","ru":"Справа виден предпросмотр файла. Нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eТак файл загружается в Power Query.\u003c/i\u003e"},{"img":"42. use 1st row as headers.png","act":"click","box":[73.9,18.69,10.4,2.93],"en":"The columns are called Column1 to Column5. In \u003cb\u003eHome\u003c/b\u003e open the drop-down of the table icon and click \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eWhy: the first row holds the column names, not data.\u003c/i\u003e","ru":"Колонки называются Column1 до Column5. На вкладке \u003cb\u003eHome\u003c/b\u003e раскройте меню значка таблицы и нажмите \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eЗачем: в первой строке имена колонок, а не данные.\u003c/i\u003e"},{"img":"43. add data destination.png","act":"click","box":[97.3,90.89,2.3,2.94],"en":"The headers are promoted and types are set. In the right panel, next to \u003cb\u003eData destination\u003c/b\u003e, click the plus \u003cb\u003e+\u003c/b\u003e (\u003ci\u003eAdd data destination\u003c/i\u003e). \u003ci\u003eWhy: tells the dataflow where to write the cleaned data.\u003c/i\u003e","ru":"Заголовки назначены, типы заданы. В правой панели рядом с \u003cb\u003eData destination\u003c/b\u003e нажмите плюс \u003cb\u003e+\u003c/b\u003e (\u003ci\u003eAdd data destination\u003c/i\u003e). \u003ci\u003eЗачем: указываем dataflow, куда записать очищенные данные.\u003c/i\u003e"},{"img":"44. select warehouse.png","act":"click","box":[87.0,80.89,11.1,2.63],"en":"In the menu choose \u003cb\u003eWarehouse\u003c/b\u003e. \u003ci\u003eWhy: the staging area is a warehouse.\u003c/i\u003e","ru":"В меню выберите \u003cb\u003eWarehouse\u003c/b\u003e. \u003ci\u003eЗачем: staging-область это warehouse.\u003c/i\u003e"},{"img":"45. warehouse none.png","act":"select","box":[25.6,37.82,21.4,2.95],"en":"In \u003cb\u003eConnection\u003c/b\u003e choose the existing connection \u003cb\u003eWarehouse ... (none)\u003c/b\u003e. \u003ci\u003eWhy: the dataflow needs a connection to reach the warehouse.\u003c/i\u003e","ru":"В поле \u003cb\u003eConnection\u003c/b\u003e выберите существующее подключение \u003cb\u003eWarehouse ... (none)\u003c/b\u003e. \u003ci\u003eЗачем: dataflow нужно подключение, чтобы добраться до warehouse.\u003c/i\u003e"},{"img":"45. warehouse none.png","act":"click","box":[90.3,89.65,3.8,3.69],"en":"Click \u003cb\u003eNext\u003c/b\u003e.","ru":"Нажмите \u003cb\u003eNext\u003c/b\u003e."},{"img":"46. exist table stg whs shipper.png","act":"select","box":[18.4,25.12,6.8,2.4],"en":"Select \u003cb\u003eExisting table\u003c/b\u003e. \u003ci\u003eWhy: the staging tables were already created by our SQL script.\u003c/i\u003e","ru":"Выберите \u003cb\u003eExisting table\u003c/b\u003e. \u003ci\u003eЗачем: staging-таблицы уже созданы нашим SQL-скриптом.\u003c/i\u003e"},{"img":"46. exist table stg whs shipper.png","act":"select","box":[11.4,44.88,20.1,41.37],"en":"Expand \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e, then \u003cb\u003edbo\u003c/b\u003e, and select the table \u003cb\u003estg_dim_shipper\u003c/b\u003e. \u003ci\u003eWhy: shippers data must land in the matching staging table.\u003c/i\u003e","ru":"Раскройте \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e, затем \u003cb\u003edbo\u003c/b\u003e и выберите таблицу \u003cb\u003estg_dim_shipper\u003c/b\u003e. \u003ci\u003eЗачем: данные shippers должны попасть в соответствующую staging-таблицу.\u003c/i\u003e"},{"img":"47. shipper tbl click next.png","act":"click","box":[90.3,89.55,3.8,3.68],"en":"On the right you see the columns of the empty table. Click \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eCheck: the chosen table is the right one.\u003c/i\u003e","ru":"Справа видны колонки пустой таблицы. Нажмите \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eПроверка: выбрана именно та таблица.\u003c/i\u003e"},{"img":"48. shipper source.png","act":"look","box":[11.2,45.86,38.8,18.34],"en":"Check the update method \u003cb\u003eReplace\u003c/b\u003e and the \u003cb\u003eColumn mapping\u003c/b\u003e: each source column must match its destination column. \u003ci\u003eWhy: Replace clears the table before each load, so rerunning does not duplicate rows.\u003c/i\u003e \u003ci\u003eAppend vs Replace: inside the pipeline both work identically because the SQL scripts clear all stg_* tables beforehand. Use \u003cb\u003eAppend\u003c/b\u003e to keep the table schema untouched (avoid running the dataflow standalone twice without clearing), or \u003cb\u003eReplace\u003c/b\u003e when testing a dataflow manually so it overwrites old rows without duplicates.\u003c/i\u003e","ru":"Проверьте метод обновления \u003cb\u003eReplace\u003c/b\u003e и \u003cb\u003eColumn mapping\u003c/b\u003e: каждая колонка источника должна соответствовать колонке назначения. \u003ci\u003eЗачем: Replace очищает таблицу перед каждой загрузкой, поэтому повторный запуск не плодит дубли.\u003c/i\u003e \u003ci\u003eAppend или Replace: внутри пайплайна оба варианта работают одинаково, так как SQL-скрипты в начале заранее очищают таблицы stg_*. Используйте \u003cb\u003eAppend\u003c/b\u003e, чтобы не трогать структуру таблицы (но не запускайте dataflow вручную дважды без очистки), или \u003cb\u003eReplace\u003c/b\u003e при ручном тестовом запуске dataflow, чтобы старые строки перезаписывались без дублей.\u003c/i\u003e"},{"img":"48. shipper source.png","act":"click","box":[87.5,89.43,6.7,3.76],"en":"Click \u003cb\u003eSave settings\u003c/b\u003e.","ru":"Нажмите \u003cb\u003eSave settings\u003c/b\u003e."},{"img":"49. shipper saved.png","act":"click","box":[5.3,13.91,2.6,2.93],"en":"The panel \u003cb\u003eData destination\u003c/b\u003e now shows \u003cb\u003eWarehouse\u003c/b\u003e. In the top left open the arrow next to the save icon. \u003ci\u003eWhy: the destination is set, now save and run the dataflow.\u003c/i\u003e","ru":"В панели \u003cb\u003eData destination\u003c/b\u003e теперь указан \u003cb\u003eWarehouse\u003c/b\u003e. В левом верхнем углу раскройте стрелку рядом со значком сохранения. \u003ci\u003eЗачем: назначение задано, теперь сохраняем и запускаем dataflow.\u003c/i\u003e"},{"img":"50. save and run.png","act":"click","box":[5.1,25.16,8.3,2.57],"en":"Click \u003cb\u003eSave, run \u0026amp; close\u003c/b\u003e. \u003ci\u003eWhy: this saves the dataflow and loads the shippers into staging at once.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eSave, run \u0026amp; close\u003c/b\u003e. \u003ci\u003eЗачем: так dataflow сохраняется и сразу загружает shippers в staging.\u003c/i\u003e"},{"img":"51. new item.png","act":"click","box":[4.85,10.65,6.65,3.67],"en":"Now build the pipeline that runs everything in order. On the workspace page click \u003cb\u003e+ New item\u003c/b\u003e. At this point your workspace already contains the dataflow from the previous part. \u003ci\u003eWhy: a pipeline orchestrates steps: clean tables, run dataflows, copy data.\u003c/i\u003e","ru":"Теперь собираем pipeline, который запускает всё по порядку. На странице workspace нажмите \u003cb\u003e+ New item\u003c/b\u003e. В вашем workspace уже есть dataflow из предыдущей части. \u003ci\u003eЗачем: pipeline управляет порядком шагов: очистка таблиц, запуск dataflow, копирование данных.\u003c/i\u003e"},{"img":"52. pipeline.png","act":"click","box":[64.45,20.08,7.4,14.09],"en":"In \u003cb\u003eRecents\u003c/b\u003e click the \u003cb\u003ePipeline\u003c/b\u003e card (or search for it). \u003ci\u003eThis starts creating a pipeline.\u003c/i\u003e","ru":"В разделе \u003cb\u003eRecents\u003c/b\u003e нажмите на карточку \u003cb\u003ePipeline\u003c/b\u003e (или найдите её поиском). \u003ci\u003eТак начинается создание pipeline.\u003c/i\u003e"},{"img":"53. name pipeline.png","act":"type","box":[34.6,46.07,31.1,3.5],"en":"Type the name using the group naming style (prefix \u003cb\u003ePL_\u003c/b\u003e), for example \u003cb\u003ePL_IMSALES_LOAD_STG\u003c/b\u003e, and click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eWhy: the name shows that this pipeline loads the staging area.\u003c/i\u003e","ru":"Введите имя по правилам группы (префикс \u003cb\u003ePL_\u003c/b\u003e), например \u003cb\u003ePL_IMSALES_LOAD_STG\u003c/b\u003e, и нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eЗачем: имя показывает, что pipeline загружает staging-область.\u003c/i\u003e"},{"img":"54. etl creation screen.png","act":"look","box":[26.3,46.96,12.0,22.38],"en":"The pipeline editor opens with an empty canvas. We start from a blank canvas, so we add activities from the toolbar. \u003ci\u003eWhy: we control the order of steps ourselves.\u003c/i\u003e","ru":"Открылся редактор pipeline с пустым холстом. Начинаем с пустого холста и добавляем активности с панели. \u003ci\u003eЗачем: порядок шагов задаём сами.\u003c/i\u003e"},{"img":"55. activity.png","act":"click","box":[8.8,5.33,3.6,3.67],"en":"Open the \u003cb\u003eActivities\u003c/b\u003e tab in the top menu. \u003ci\u003eWhy: all activity types are listed here.\u003c/i\u003e","ru":"Откройте вкладку \u003cb\u003eActivities\u003c/b\u003e в верхнем меню. \u003ci\u003eЗачем: здесь собраны все типы активностей.\u003c/i\u003e"},{"img":"56. script select.png","act":"click","box":[38.6,9.23,4.3,3.69],"en":"Click \u003cb\u003eScript\u003c/b\u003e. A \u003cb\u003eScript1\u003c/b\u003e activity appears on the canvas. \u003ci\u003eWhy: a Script activity runs SQL, we use it to clean the staging tables before loading.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eScript\u003c/b\u003e. На холсте появится активность \u003cb\u003eScript1\u003c/b\u003e. \u003ci\u003eЗачем: Script выполняет SQL, мы чистим им staging-таблицы перед загрузкой.\u003c/i\u003e"},{"img":"57. 3 scripts.png","act":"look","box":[9.5,25.44,29.0,22.49],"en":"Add two more \u003cb\u003eScript\u003c/b\u003e activities the same way. You now have three: Script1, Script2, Script3. Click the first one, \u003cb\u003eScript1\u003c/b\u003e. \u003ci\u003eWhy: one script per group of tables: sales, inventory, dimensions.\u003c/i\u003e","ru":"Добавьте ещё две активности \u003cb\u003eScript\u003c/b\u003e тем же способом. Теперь их три: Script1, Script2, Script3. Нажмите на первую, \u003cb\u003eScript1\u003c/b\u003e. \u003ci\u003eЗачем: по одному скрипту на группу таблиц: продажи, склад, измерения.\u003c/i\u003e"},{"img":"58. 1st script name.png","act":"type","box":[17.7,65.24,15.6,2.76],"en":"On the \u003cb\u003eGeneral\u003c/b\u003e tab type a clear name in \u003cb\u003eName\u003c/b\u003e, for example \u003cb\u003eSQL clear sales facts in stg\u003c/b\u003e. \u003ci\u003eWhy: the name tells what the step does without opening it.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eGeneral\u003c/b\u003e введите понятное имя в поле \u003cb\u003eName\u003c/b\u003e, например \u003cb\u003eSQL clear sales facts in stg\u003c/b\u003e. \u003ci\u003eЗачем: имя объясняет, что делает шаг, не открывая его.\u003c/i\u003e"},{"img":"58. 1st script name.png","act":"click","box":[9.4,59.89,3.2,2.76],"en":"Open the \u003cb\u003eSettings\u003c/b\u003e tab. \u003ci\u003eWhy: the connection and the SQL text are set here.\u003c/i\u003e","ru":"Откройте вкладку \u003cb\u003eSettings\u003c/b\u003e. \u003ci\u003eЗачем: здесь задаются подключение и текст SQL.\u003c/i\u003e"},{"img":"59. choose connection.png","act":"click","box":[17.7,82.08,15.4,3.32],"en":"Open the \u003cb\u003eConnection\u003c/b\u003e list and click \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eWhy: the script must run on the staging warehouse, which is not in the short list.\u003c/i\u003e","ru":"Откройте список \u003cb\u003eConnection\u003c/b\u003e и нажмите \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eЗачем: скрипт должен выполняться на staging warehouse, которого нет в коротком списке.\u003c/i\u003e"},{"img":"60. choose stg wrhs.png","act":"select","box":[16.7,57.94,69.3,4.78],"en":"In \u003cb\u003eOneLake catalog\u003c/b\u003e choose the warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e from your workspace. \u003ci\u003eWhy: we clear the staging tables, so the connection must point to staging, not to DW.\u003c/i\u003e","ru":"В \u003cb\u003eOneLake catalog\u003c/b\u003e выберите warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e из вашего workspace. \u003ci\u003eЗачем: мы чистим staging-таблицы, поэтому подключение должно вести в staging, а не в DW.\u003c/i\u003e"},{"img":"61. choose edit.png","act":"click","box":[41.7,77.13,1.6,2.97],"en":"The connection is set. Under \u003cb\u003eScript\u003c/b\u003e keep \u003cb\u003eQuery\u003c/b\u003e and click the pencil \u003cb\u003eEdit in code editor\u003c/b\u003e. \u003ci\u003eWhy: a large editor is more convenient for SQL than a small field.\u003c/i\u003e","ru":"Подключение выбрано. В разделе \u003cb\u003eScript\u003c/b\u003e оставьте \u003cb\u003eQuery\u003c/b\u003e и нажмите на карандаш \u003cb\u003eEdit in code editor\u003c/b\u003e. \u003ci\u003eЗачем: в большом редакторе удобнее писать SQL, чем в маленьком поле.\u003c/i\u003e"},{"img":"62. clean table sales script and click ok.png","act":"type","box":[4.8,12.76,45.2,4.81],"en":"Type the command \u003cb\u003eTRUNCATE TABLE stg_fact_sales;\u003c/b\u003e and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eWhy: TRUNCATE empties the table, so a repeated load does not duplicate rows. Keep only this one line.\u003c/i\u003e","ru":"Введите команду \u003cb\u003eTRUNCATE TABLE stg_fact_sales;\u003c/b\u003e и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eЗачем: TRUNCATE очищает таблицу, чтобы повторная загрузка не дублировала строки. Оставьте только эту строку.\u003c/i\u003e","code":"TRUNCATE TABLE stg_fact_sales;"},{"img":"63. 2nd script name.png","act":"type","box":[17.9,65.57,15.6,2.76],"en":"Select \u003cb\u003eScript2\u003c/b\u003e and on \u003cb\u003eGeneral\u003c/b\u003e name it \u003cb\u003eSQL clear inventory facts in stg\u003c/b\u003e. Then open \u003cb\u003eSettings\u003c/b\u003e. \u003ci\u003eWhy: the second script clears the inventory fact table.\u003c/i\u003e","ru":"Выберите \u003cb\u003eScript2\u003c/b\u003e и на вкладке \u003cb\u003eGeneral\u003c/b\u003e назовите его \u003cb\u003eSQL clear inventory facts in stg\u003c/b\u003e. Затем откройте \u003cb\u003eSettings\u003c/b\u003e. \u003ci\u003eЗачем: второй скрипт чистит таблицу фактов склада.\u003c/i\u003e"},{"img":"64. select browse all.png","act":"click","box":[17.9,82.17,15.4,3.13],"en":"Open the \u003cb\u003eConnection\u003c/b\u003e list and click \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eSame as for the first script: we need the staging warehouse.\u003c/i\u003e","ru":"Откройте список \u003cb\u003eConnection\u003c/b\u003e и нажмите \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eКак и для первого скрипта: нужен staging warehouse.\u003c/i\u003e"},{"img":"65. select stg whspng.png","act":"select","box":[16.6,53.04,69.4,4.64],"en":"Choose the warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e from your workspace. \u003ci\u003eCheck: the location is your workspace, not another one with the same name.\u003c/i\u003e","ru":"Выберите warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e из вашего workspace. \u003ci\u003eПроверка: расположение это ваш workspace, а не другой с таким же именем.\u003c/i\u003e"},{"img":"66. click edit.png","act":"click","box":[41.8,77.31,1.6,2.97],"en":"Click the pencil \u003cb\u003eEdit in code editor\u003c/b\u003e under \u003cb\u003eScript\u003c/b\u003e. \u003ci\u003eWhy: we type the SQL command in the big editor.\u003c/i\u003e","ru":"Нажмите на карандаш \u003cb\u003eEdit in code editor\u003c/b\u003e в разделе \u003cb\u003eScript\u003c/b\u003e. \u003ci\u003eЗачем: SQL-команду вводим в большом редакторе.\u003c/i\u003e"},{"img":"67. clean inventory table and ok.png","act":"type","box":[4.8,12.39,45.2,4.81],"en":"Type \u003cb\u003eTRUNCATE TABLE stg_fact_inventory;\u003c/b\u003e and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eWhy: empties the inventory staging table before each load. Keep only this one line.\u003c/i\u003e","ru":"Введите \u003cb\u003eTRUNCATE TABLE stg_fact_inventory;\u003c/b\u003e и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eЗачем: очищает staging-таблицу склада перед каждой загрузкой. Оставьте только эту строку.\u003c/i\u003e","code":"TRUNCATE TABLE stg_fact_inventory;"},{"img":"68. 3rd script name.png","act":"type","box":[17.8,65.48,15.6,2.78],"en":"Select \u003cb\u003eScript3\u003c/b\u003e and on \u003cb\u003eGeneral\u003c/b\u003e name it \u003cb\u003eSQL clear dimensions facts in stg\u003c/b\u003e. \u003ci\u003eWhy: the third script clears all dimension tables.\u003c/i\u003e","ru":"Выберите \u003cb\u003eScript3\u003c/b\u003e и на вкладке \u003cb\u003eGeneral\u003c/b\u003e назовите его \u003cb\u003eSQL clear dimensions facts in stg\u003c/b\u003e. \u003ci\u003eЗачем: третий скрипт чистит все таблицы измерений.\u003c/i\u003e"},{"img":"69. connect - browse all.png","act":"click","box":[18.0,78.56,15.3,3.33],"en":"Select \u003cb\u003eScript3\u003c/b\u003e, open \u003cb\u003eSettings\u003c/b\u003e, open the \u003cb\u003eConnection\u003c/b\u003e list and click \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eSame as before: the third script also runs on staging.\u003c/i\u003e","ru":"Выберите \u003cb\u003eScript3\u003c/b\u003e, откройте \u003cb\u003eSettings\u003c/b\u003e, раскройте список \u003cb\u003eConnection\u003c/b\u003e и нажмите \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eКак и раньше: третий скрипт тоже выполняется на staging.\u003c/i\u003e"},{"img":"70. choose stg whs.png","act":"select","box":[16.7,52.9,69.4,4.79],"en":"Choose the warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e from your workspace. \u003ci\u003eCheck: the location is your workspace.\u003c/i\u003e","ru":"Выберите warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e из вашего workspace. \u003ci\u003eПроверка: расположение это ваш workspace.\u003c/i\u003e"},{"img":"71. select edit.png","act":"click","box":[41.8,77.32,1.6,2.94],"en":"Click the pencil \u003cb\u003eEdit in code editor\u003c/b\u003e. \u003ci\u003eWhy: the dimension tables are cleared by several commands, the big editor fits them.\u003c/i\u003e","ru":"Нажмите на карандаш \u003cb\u003eEdit in code editor\u003c/b\u003e. \u003ci\u003eЗачем: измерения чистятся несколькими командами, для них нужен большой редактор.\u003c/i\u003e"},{"img":"72. clean dim tables.png","act":"type","box":[4.8,12.02,30.2,10.73],"en":"Type five commands, one per dimension table: \u003cb\u003eDELETE FROM stg_dim_client;\u003c/b\u003e, \u003cb\u003estg_dim_product\u003c/b\u003e, \u003cb\u003estg_dim_date\u003c/b\u003e, \u003cb\u003estg_dim_shipper\u003c/b\u003e, \u003cb\u003estg_dim_staff\u003c/b\u003e. Click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eWhy: the dimension tables are emptied before they are loaded again. Keep only these five lines.\u003c/i\u003e","ru":"Введите пять команд, по одной на таблицу измерений: \u003cb\u003eDELETE FROM stg_dim_client;\u003c/b\u003e, \u003cb\u003estg_dim_product\u003c/b\u003e, \u003cb\u003estg_dim_date\u003c/b\u003e, \u003cb\u003estg_dim_shipper\u003c/b\u003e, \u003cb\u003estg_dim_staff\u003c/b\u003e. Нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eЗачем: таблицы измерений очищаются перед новой загрузкой. Оставьте только эти пять строк.\u003c/i\u003e","code":"DELETE FROM stg_dim_client;\nDELETE FROM stg_dim_product;\nDELETE FROM stg_dim_date;\nDELETE FROM stg_dim_shipper;\nDELETE FROM stg_dim_staff;"},{"img":"73. wait.png","act":"click","box":[84.5,8.8,5.0,3.48],"en":"All three scripts are ready. Open the \u003cb\u003e...\u003c/b\u003e menu in the toolbar and click \u003cb\u003eWait\u003c/b\u003e. \u003ci\u003eWhy: the Wait activity is a meeting point. The next step starts only when all three cleaning scripts have finished.\u003c/i\u003e","ru":"Все три скрипта готовы. Откройте меню \u003cb\u003e...\u003c/b\u003e на панели и нажмите \u003cb\u003eWait\u003c/b\u003e. \u003ci\u003eЗачем: Wait это точка встречи. Следующий шаг стартует, только когда завершатся все три скрипта очистки.\u003c/i\u003e"},{"img":"74. connect on success.png","act":"drag","box":[20.2,29.24,29.8,3.15],"en":"Name it \u003cb\u003eWait for cleaning\u003c/b\u003e on \u003cb\u003eGeneral\u003c/b\u003e. Then drag from the green check mark on the right edge of each Script to the Wait box, all three. \u003ci\u003eWhy: the green check mark means on success. Wait begins only if all three scripts succeeded.\u003c/i\u003e","ru":"Назовите его \u003cb\u003eWait for cleaning\u003c/b\u003e на вкладке \u003cb\u003eGeneral\u003c/b\u003e. Затем потяните от зелёной галочки на правом краю каждого Script к блоку Wait, все три. \u003ci\u003eЗачем: зелёная галочка значит on success. Wait запустится, только если все три скрипта прошли успешно.\u003c/i\u003e"},{"img":"75. copy data activity.png","act":"click","box":[4.8,21.32,11.0,2.57],"en":"In \u003cb\u003eActivities\u003c/b\u003e open the \u003cb\u003eCopy data\u003c/b\u003e menu and click \u003cb\u003eAdd copy data activity\u003c/b\u003e. \u003ci\u003eWhy: a Copy data activity moves a CSV file from the lakehouse into a staging table.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eActivities\u003c/b\u003e раскройте меню \u003cb\u003eCopy data\u003c/b\u003e и нажмите \u003cb\u003eAdd copy data activity\u003c/b\u003e. \u003ci\u003eЗачем: Copy data переносит CSV-файл из lakehouse в staging-таблицу.\u003c/i\u003e"},{"img":"76. name copy data.png","act":"type","box":[17.8,65.47,15.6,2.81],"en":"On \u003cb\u003eGeneral\u003c/b\u003e give the activity a clear name, for example \u003cb\u003eCD Client - load stg dim client\u003c/b\u003e. Then open \u003cb\u003eSource\u003c/b\u003e. \u003ci\u003eWhy: the name says which table it loads. There will be one Copy data per file.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eGeneral\u003c/b\u003e дайте активности понятное имя, например \u003cb\u003eCD Client - load stg dim client\u003c/b\u003e. Затем откройте \u003cb\u003eSource\u003c/b\u003e. \u003ci\u003eЗачем: имя говорит, какую таблицу грузим. На каждый файл будет свой Copy data.\u003c/i\u003e"},{"img":"77. source connect browse.png","act":"click","box":[17.9,78.81,15.4,3.13],"en":"On \u003cb\u003eSource\u003c/b\u003e open the \u003cb\u003eConnection\u003c/b\u003e list and click \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eWhy: the source is the lakehouse with our CSV files.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eSource\u003c/b\u003e раскройте список \u003cb\u003eConnection\u003c/b\u003e и нажмите \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eЗачем: источник это lakehouse с нашими CSV-файлами.\u003c/i\u003e"},{"img":"78. LH connect.png","act":"select","box":[16.8,68.09,69.1,4.44],"en":"Choose the lakehouse \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e from your workspace. \u003ci\u003eCheck: the location is your workspace.\u003c/i\u003e","ru":"Выберите lakehouse \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e из вашего workspace. \u003ci\u003eПроверка: расположение это ваш workspace.\u003c/i\u003e"},{"img":"79. choose files, click browse.png","act":"click","box":[50.5,78.06,4.5,2.75],"en":"Set \u003cb\u003eRoot folder\u003c/b\u003e to \u003cb\u003eFiles\u003c/b\u003e and click \u003cb\u003eBrowse\u003c/b\u003e next to \u003cb\u003eFile path\u003c/b\u003e. \u003ci\u003eWhy: our CSV files are stored as files, not as tables.\u003c/i\u003e","ru":"В \u003cb\u003eRoot folder\u003c/b\u003e выберите \u003cb\u003eFiles\u003c/b\u003e и нажмите \u003cb\u003eBrowse\u003c/b\u003e рядом с \u003cb\u003eFile path\u003c/b\u003e. \u003ci\u003eЗачем: наши CSV хранятся как файлы, а не как таблицы.\u003c/i\u003e"},{"img":"80. dbl click src data.png","act":"click","box":[64.8,20.37,5.8,2.75],"en":"In the \u003cb\u003eBrowse\u003c/b\u003e panel double click the folder \u003cb\u003esource data\u003c/b\u003e. \u003ci\u003eWhy: this is the folder we uploaded in the beginning.\u003c/i\u003e","ru":"В панели \u003cb\u003eBrowse\u003c/b\u003e дважды нажмите на папку \u003cb\u003esource data\u003c/b\u003e. \u003ci\u003eЗачем: это папка, которую мы загрузили в самом начале.\u003c/i\u003e"},{"img":"81. choose client csv.png","act":"select","box":[64.6,20.41,34.4,2.94],"en":"Select the file \u003cb\u003e2026-2027 IMSALES Clients.csv\u003c/b\u003e and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eWhy: this file feeds the client dimension. The list shows all 14 uploaded files.\u003c/i\u003e","ru":"Выберите файл \u003cb\u003e2026-2027 IMSALES Clients.csv\u003c/b\u003e и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eЗачем: этот файл наполняет измерение клиентов. В списке все 14 загруженных файлов.\u003c/i\u003e"},{"img":"82. delimited text.png","act":"select","box":[17.7,86.77,15.6,2.79],"en":"The folder and file name are filled in. Open the \u003cb\u003eFile format\u003c/b\u003e list and choose \u003cb\u003eDelimitedText\u003c/b\u003e. \u003ci\u003eWhy: a CSV is a delimited text file. Binary would copy the file without reading columns.\u003c/i\u003e","ru":"Папка и имя файла заполнены. Откройте список \u003cb\u003eFile format\u003c/b\u003e и выберите \u003cb\u003eDelimitedText\u003c/b\u003e. \u003ci\u003eЗачем: CSV это текст с разделителями. Binary скопировал бы файл, не читая колонки.\u003c/i\u003e"},{"img":"83. format settings comma header.png","act":"click","box":[34.2,86.07,4.5,2.78],"en":"Click \u003cb\u003eSettings\u003c/b\u003e next to \u003cb\u003eFile format\u003c/b\u003e. Check \u003cb\u003eColumn delimiter\u003c/b\u003e is \u003cb\u003eComma\u003c/b\u003e and \u003cb\u003eFirst row as header\u003c/b\u003e is ticked. Click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eWhy: the first row of our CSV holds the column names, not data.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eSettings\u003c/b\u003e рядом с \u003cb\u003eFile format\u003c/b\u003e. Проверьте, что \u003cb\u003eColumn delimiter\u003c/b\u003e это \u003cb\u003eComma\u003c/b\u003e и стоит галочка \u003cb\u003eFirst row as header\u003c/b\u003e. Нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eЗачем: в первой строке нашего CSV имена колонок, а не данные.\u003c/i\u003e"},{"img":"84. destination connection browse.png","act":"click","box":[17.9,79.37,15.3,2.97],"en":"Open the \u003cb\u003eDestination\u003c/b\u003e tab, open the \u003cb\u003eConnection\u003c/b\u003e list and click \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eWhy: the destination is the staging warehouse.\u003c/i\u003e","ru":"Откройте вкладку \u003cb\u003eDestination\u003c/b\u003e, раскройте список \u003cb\u003eConnection\u003c/b\u003e и нажмите \u003cb\u003eBrowse all\u003c/b\u003e. \u003ci\u003eЗачем: назначение это staging warehouse.\u003c/i\u003e"},{"img":"85. choose stg whs.png","act":"select","box":[16.8,64.8,69.3,4.64],"en":"Choose the warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e from your workspace. \u003ci\u003eCheck: the location is your workspace.\u003c/i\u003e","ru":"Выберите warehouse \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e из вашего workspace. \u003ci\u003eПроверка: расположение это ваш workspace.\u003c/i\u003e"},{"img":"86. table dim client.png","act":"select","box":[17.9,80.51,15.1,2.94],"en":"Keep \u003cb\u003eUse existing\u003c/b\u003e, open the \u003cb\u003eTable\u003c/b\u003e list and choose \u003cb\u003edbo.stg_dim_client\u003c/b\u003e. \u003ci\u003eWhy: the staging table was already created by our SQL script.\u003c/i\u003e","ru":"Оставьте \u003cb\u003eUse existing\u003c/b\u003e, раскройте список \u003cb\u003eTable\u003c/b\u003e и выберите \u003cb\u003edbo.stg_dim_client\u003c/b\u003e. \u003ci\u003eЗачем: staging-таблица уже создана нашим SQL-скриптом.\u003c/i\u003e"},{"img":"87. connect wait with copy data.png","act":"drag","box":[60.2,31.48,8.3,2.58],"en":"Drag from the green check mark of \u003cb\u003eWait for cleaning\u003c/b\u003e to the Copy data box. \u003ci\u003eWhy: the copy starts only after all tables have been cleaned.\u003c/i\u003e","ru":"Потяните от зелёной галочки \u003cb\u003eWait for cleaning\u003c/b\u003e к блоку Copy data. \u003ci\u003eЗачем: копирование начинается только после очистки всех таблиц.\u003c/i\u003e"},{"img":"88. add dataflow.png","act":"click","box":[12.2,9.27,5.3,2.96],"en":"Next add the dataflow to the pipeline. On the \u003cb\u003eActivities\u003c/b\u003e tab click \u003cb\u003eDataflow\u003c/b\u003e. \u003ci\u003eWhy: the pipeline will run the dataflow we built earlier, so everything loads in one run.\u003c/i\u003e","ru":"Теперь добавим dataflow в pipeline. На вкладке \u003cb\u003eActivities\u003c/b\u003e нажмите \u003cb\u003eDataflow\u003c/b\u003e. \u003ci\u003eЗачем: pipeline запустит ранее созданный dataflow, и всё загрузится одним запуском.\u003c/i\u003e"},{"img":"89. dataflow name.png","act":"type","box":[17.8,65.55,15.6,2.78],"en":"On \u003cb\u003eGeneral\u003c/b\u003e give the activity a clear name, for example \u003cb\u003eDF Load DIM Shipper\u003c/b\u003e. Then open \u003cb\u003eSettings\u003c/b\u003e. \u003ci\u003eWhy: the name says what the activity loads.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eGeneral\u003c/b\u003e дайте активности понятное имя, например \u003cb\u003eDF Load DIM Shipper\u003c/b\u003e. Затем откройте \u003cb\u003eSettings\u003c/b\u003e. \u003ci\u003eЗачем: имя говорит, что грузит активность.\u003c/i\u003e"},{"img":"90. settings shipper stg.png","act":"select","box":[17.9,69.79,15.5,2.78],"en":"In \u003cb\u003eSettings\u003c/b\u003e keep your \u003cb\u003eWorkspace\u003c/b\u003e, open the \u003cb\u003eDataflow\u003c/b\u003e list and choose the dataflow you created (\u003cb\u003eDF LOAD DIM SHIPPER STG\u003c/b\u003e). \u003ci\u003eWhy: this links the activity to the real dataflow. If the list is empty press \u003cb\u003eRefresh\u003c/b\u003e.\u003c/i\u003e","ru":"В \u003cb\u003eSettings\u003c/b\u003e оставьте свой \u003cb\u003eWorkspace\u003c/b\u003e, раскройте список \u003cb\u003eDataflow\u003c/b\u003e и выберите созданный dataflow (\u003cb\u003eDF LOAD DIM SHIPPER STG\u003c/b\u003e). \u003ci\u003eЗачем: так активность связывается с настоящим dataflow. Если список пуст, нажмите \u003cb\u003eRefresh\u003c/b\u003e.\u003c/i\u003e"},{"img":"91. connect wait to df.png","act":"drag","box":[60.1,31.73,8.7,19.56],"en":"Drag from the green check mark of \u003cb\u003eWait for cleaning\u003c/b\u003e to the Dataflow box, so both Copy data and Dataflow start after cleaning. \u003ci\u003eWhy: the two loads run in parallel after the tables are cleaned.\u003c/i\u003e","ru":"Потяните от зелёной галочки \u003cb\u003eWait for cleaning\u003c/b\u003e к блоку Dataflow, чтобы и Copy data, и Dataflow стартовали после очистки. \u003ci\u003eЗачем: две загрузки идут параллельно после очистки таблиц.\u003c/i\u003e"},{"img":"92. save ppl.png","act":"click","box":[4.9,9.55,1.6,3.12],"en":"Click \u003cb\u003eSave\u003c/b\u003e in the top left corner. \u003ci\u003eWhy: unsaved changes are lost when you close the pipeline.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eSave\u003c/b\u003e в левом верхнем углу. \u003ci\u003eЗачем: несохранённые изменения теряются при закрытии pipeline.\u003c/i\u003e"},{"img":"93. new folder sources.png","act":"type","box":[34.5,47.95,31.1,3.14],"en":"Back on the workspace page click \u003cb\u003eNew folder\u003c/b\u003e, type \u003cb\u003e01 Sources\u003c/b\u003e and click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eWhy: folders keep the workspace tidy. Numbers show the order of the layers.\u003c/i\u003e","ru":"На странице workspace нажмите \u003cb\u003eNew folder\u003c/b\u003e, введите \u003cb\u003e01 Sources\u003c/b\u003e и нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eЗачем: папки наводят порядок в workspace. Номера показывают порядок слоёв.\u003c/i\u003e"},{"img":"94. move to.png","act":"click","box":[27.3,47.75,11.7,3.86],"en":"Hover over the lakehouse row, click the three dots \u003cb\u003e...\u003c/b\u003e and choose \u003cb\u003eMove to\u003c/b\u003e. \u003ci\u003eWhy: we sort the items into folders by layer.\u003c/i\u003e","ru":"Наведите курсор на строку lakehouse, нажмите три точки \u003cb\u003e...\u003c/b\u003e и выберите \u003cb\u003eMove to\u003c/b\u003e. \u003ci\u003eЗачем: раскладываем объекты по папкам по слоям.\u003c/i\u003e"},{"img":"95. sources.png","act":"click","box":[28.2,36.74,4.5,2.39],"en":"In the \u003cb\u003eMove 2 items\u003c/b\u003e dialog (the lakehouse and its SQL endpoint) open the folder \u003cb\u003e01 Sources\u003c/b\u003e and click \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eWhy: the lakehouse is the source layer.\u003c/i\u003e","ru":"В окне \u003cb\u003eMove 2 items\u003c/b\u003e (lakehouse и его SQL endpoint) откройте папку \u003cb\u003e01 Sources\u003c/b\u003e и нажмите \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eЗачем: lakehouse это слой источников.\u003c/i\u003e"},{"img":"96. new folder stg.png","act":"type","box":[34.4,47.81,31.1,3.13],"en":"Create the second folder: click \u003cb\u003eNew folder\u003c/b\u003e, type \u003cb\u003e02 Staging Area\u003c/b\u003e and click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eWhy: this folder will hold everything that belongs to staging.\u003c/i\u003e","ru":"Создайте вторую папку: нажмите \u003cb\u003eNew folder\u003c/b\u003e, введите \u003cb\u003e02 Staging Area\u003c/b\u003e и нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eЗачем: в этой папке будет всё, что относится к staging.\u003c/i\u003e"},{"img":"97. move to.png","act":"click","box":[27.2,54.29,12.9,2.76],"en":"Tick the staging items (the dataflow, the pipeline and the \u003cb\u003eSTG\u003c/b\u003e warehouse), click the three dots \u003cb\u003e...\u003c/b\u003e on one of them and choose \u003cb\u003eMove to\u003c/b\u003e. \u003ci\u003eWhy: all three items work together to load the staging area.\u003c/i\u003e","ru":"Отметьте staging-объекты (dataflow, pipeline и warehouse \u003cb\u003eSTG\u003c/b\u003e), нажмите три точки \u003cb\u003e...\u003c/b\u003e на одном из них и выберите \u003cb\u003eMove to\u003c/b\u003e. \u003ci\u003eЗачем: все три объекта работают вместе и загружают staging-область.\u003c/i\u003e"},{"img":"98. to staging.png","act":"click","box":[28.0,41.55,6.2,2.56],"en":"In the dialog click the folder \u003cb\u003e02 Staging Area\u003c/b\u003e. \u003ci\u003eThis opens the target folder.\u003c/i\u003e","ru":"В окне нажмите на папку \u003cb\u003e02 Staging Area\u003c/b\u003e. \u003ci\u003eТак открывается папка назначения.\u003c/i\u003e"},{"img":"99. move here.png","act":"click","box":[64.3,75.26,5.5,3.53],"en":"The folder is empty. Click \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eThis moves the selected items into the folder.\u003c/i\u003e","ru":"Папка пуста. Нажмите \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eТак выбранные объекты переносятся в папку.\u003c/i\u003e"},{"img":"100. move selected.png","act":"click","box":[11.9,10.32,5.4,3.69],"en":"Tick the dataflow and the pipeline, then click \u003cb\u003eMove\u003c/b\u003e in the toolbar. \u003ci\u003eWhy: they belong to the staging layer, the same as the STG warehouse.\u003c/i\u003e","ru":"Отметьте dataflow и pipeline, затем нажмите \u003cb\u003eMove\u003c/b\u003e на панели. \u003ci\u003eЗачем: они относятся к staging-слою, как и warehouse STG.\u003c/i\u003e"},{"img":"101. to stg.png","act":"click","box":[28.2,41.58,6.1,2.4],"en":"In the dialog click the folder \u003cb\u003e02 Staging Area\u003c/b\u003e. \u003ci\u003eThis opens the target folder.\u003c/i\u003e","ru":"В окне нажмите на папку \u003cb\u003e02 Staging Area\u003c/b\u003e. \u003ci\u003eТак открывается папка назначения.\u003c/i\u003e"},{"img":"102. move here.png","act":"click","box":[64.2,74.84,5.4,3.49],"en":"The folder already holds the STG warehouse. Click \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eNow all staging items are in one folder.\u003c/i\u003e","ru":"В папке уже лежит warehouse STG. Нажмите \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eТеперь все staging-объекты в одной папке.\u003c/i\u003e"},{"img":"103. new folder dw.png","act":"type","box":[34.5,48.31,31.1,3.31],"en":"Create the third folder: click \u003cb\u003eNew folder\u003c/b\u003e, type \u003cb\u003e03 Data Warehouse\u003c/b\u003e and click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eWhy: the final warehouse is the third layer.\u003c/i\u003e","ru":"Создайте третью папку: нажмите \u003cb\u003eNew folder\u003c/b\u003e, введите \u003cb\u003e03 Data Warehouse\u003c/b\u003e и нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eЗачем: итоговое хранилище это третий слой.\u003c/i\u003e"},{"img":"104. move to.png","act":"click","box":[11.8,10.7,5.3,3.32],"en":"Tick the \u003cb\u003eDW\u003c/b\u003e warehouse and click \u003cb\u003eMove\u003c/b\u003e in the toolbar. \u003ci\u003eWhy: the DW warehouse is the last item left outside the folders.\u003c/i\u003e","ru":"Отметьте warehouse \u003cb\u003eDW\u003c/b\u003e и нажмите \u003cb\u003eMove\u003c/b\u003e на панели. \u003ci\u003eЗачем: warehouse DW последний объект вне папок.\u003c/i\u003e"},{"img":"105. to dw.png","act":"click","box":[28.4,46.27,7.4,2.79],"en":"In the dialog click the folder \u003cb\u003e03 Data Warehouse\u003c/b\u003e, then click \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eResult: three folders, one per layer. The workspace is organised.\u003c/i\u003e","ru":"В окне нажмите на папку \u003cb\u003e03 Data Warehouse\u003c/b\u003e, затем нажмите \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eИтог: три папки, по одной на слой. Workspace приведён в порядок.\u003c/i\u003e"},{"img":"110. new item.png","act":"click","box":[4.9,10.6,6.7,3.7],"en":"Next we build the Product dimension dataflow. On the workspace page click \u003cb\u003e+ New item\u003c/b\u003e. \u003ci\u003eWhy: a Dataflow Gen2 will combine the three product-related CSVs into one staging table.\u003c/i\u003e","ru":"Дальше собираем dataflow для измерения Product. На странице workspace нажмите \u003cb\u003e+ New item\u003c/b\u003e. \u003ci\u003eЗачем: Dataflow Gen2 объединит три CSV по товарам в одну staging-таблицу.\u003c/i\u003e"},{"img":"111. dataflowgen2.png","act":"click","box":[46.1,20.9,7.7,13.9],"en":"Click the \u003cb\u003eDataflow Gen2\u003c/b\u003e card. \u003ci\u003eWhy: Dataflow Gen2 gives us Power Query to merge tables and load them into the staging warehouse.\u003c/i\u003e","ru":"Нажмите на карточку \u003cb\u003eDataflow Gen2\u003c/b\u003e. \u003ci\u003eЗачем: Dataflow Gen2 даёт редактор Power Query для объединения таблиц и записи в staging warehouse.\u003c/i\u003e"},{"img":"112. name dataflow.png","act":"type","box":[39.3,48.3,21.4,4.1],"en":"Type the name \u003cb\u003eDF LOAD DIM PRODUCT STG\u003c/b\u003e and click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eWhy: the name follows the group convention and clearly states which staging table it loads.\u003c/i\u003e","ru":"Введите имя \u003cb\u003eDF LOAD DIM PRODUCT STG\u003c/b\u003e и нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eЗачем: имя следует правилам группы и сразу показывает, какую staging-таблицу грузит dataflow.\u003c/i\u003e"},{"img":"113. get data.png","act":"click","box":[44.6,66.2,15.3,3],"en":"In Power Query click \u003cb\u003eGet data from another source\u003c/b\u003e. \u003ci\u003eWhy: our source CSVs live in the lakehouse, not in a local file.\u003c/i\u003e","ru":"В Power Query нажмите \u003cb\u003eGet data from another source\u003c/b\u003e. \u003ci\u003eЗачем: наши исходные CSV лежат в lakehouse, а не в локальном файле.\u003c/i\u003e"},{"img":"114. lh sources.png","act":"click","box":[15.2,63,39.5,4],"en":"In \u003cb\u003eOneLake catalog\u003c/b\u003e select your lakehouse \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e. \u003ci\u003eCheck: make sure the Location column shows your workspace.\u003c/i\u003e","ru":"В \u003cb\u003eOneLake catalog\u003c/b\u003e выберите ваш lakehouse \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e. \u003ci\u003eПроверка: в столбце Location должен быть указан ваш workspace.\u003c/i\u003e"},{"img":"115. select tables.png","act":"select","box":[12.2,41.8,19,21],"en":"Expand \u003cb\u003eFiles \u0026rarr; source data\u003c/b\u003e and tick all three product files: \u003cb\u003e2026-2027 IMSALES Products.csv\u003c/b\u003e, \u003cb\u003eProductTypes.csv\u003c/b\u003e, and \u003cb\u003eSuppliers.csv\u003c/b\u003e. \u003ci\u003eWhy: the product dimension combines product details, type names, and supplier info.\u003c/i\u003e","ru":"Раскройте \u003cb\u003eFiles \u0026rarr; source data\u003c/b\u003e и отметьте три файла: \u003cb\u003e2026-2027 IMSALES Products.csv\u003c/b\u003e, \u003cb\u003eProductTypes.csv\u003c/b\u003e и \u003cb\u003eSuppliers.csv\u003c/b\u003e. \u003ci\u003eЗачем: измерение товаров объединяет сами товары, их категории и поставщиков.\u003c/i\u003e"},{"img":"115. select tables.png","act":"click","box":[89.6,91.3,4.6,3.9],"en":"Click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eThis loads all three CSVs as separate queries into Power Query.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eТак все три CSV загрузятся в Power Query как отдельные запросы.\u003c/i\u003e"},{"img":"116. transform product types.png","act":"click","box":[11.2,13.7,12.3,4.2],"en":"Select the \u003cb\u003eProductTypes\u003c/b\u003e query on the left. On the \u003cb\u003eTransform\u003c/b\u003e tab click \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eWhy: the first row holds column names (ProductTypeID, ProductTypeName), not data.\u003c/i\u003e","ru":"Выберите запрос \u003cb\u003eProductTypes\u003c/b\u003e слева. На вкладке \u003cb\u003eTransform\u003c/b\u003e нажмите \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eЗачем: в первой строке лежат названия колонок (ProductTypeID, ProductTypeName), а не данные.\u003c/i\u003e"},{"img":"117. transform products (header).png","act":"click","box":[11.4,18.2,11.1,3],"en":"Switch to \u003cb\u003e2026-2027 IMSALES Products csv\u003c/b\u003e and click \u003cb\u003eUse first row as headers\u003c/b\u003e as well. \u003ci\u003eWhy: every CSV needs proper column headers before we can merge them by ID.\u003c/i\u003e","ru":"Переключитесь на \u003cb\u003e2026-2027 IMSALES Products csv\u003c/b\u003e и тоже нажмите \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eЗачем: каждому CSV нужны корректные заголовки, чтобы потом объединить их по ID.\u003c/i\u003e"},{"img":"118. transform sales (header).png","act":"click","box":[11.4,18.2,11.1,3],"en":"Switch to \u003cb\u003e2026-2027 IMSALES Suppliers csv\u003c/b\u003e and click \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eWhy: now all three tables have clean headers and auto-detected types.\u003c/i\u003e","ru":"Переключитесь на \u003cb\u003e2026-2027 IMSALES Suppliers csv\u003c/b\u003e и нажмите \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eЗачем: теперь у всех трёх таблиц правильные заголовки и типы данных.\u003c/i\u003e"},{"img":"119. combine (merge queries).png","act":"click","box":[44.5,23,12,4.8],"en":"Select \u003cb\u003e2026-2027 IMSALES Products csv\u003c/b\u003e (our main table). Find and click \u003cb\u003eMerge queries\u003c/b\u003e (Home \u0026rarr; Combine or via Search). \u003ci\u003eWhy: we will enrich Products with columns from ProductTypes and Suppliers.\u003c/i\u003e","ru":"Выберите \u003cb\u003e2026-2027 IMSALES Products csv\u003c/b\u003e (основную таблицу). Найдите и нажмите \u003cb\u003eMerge queries\u003c/b\u003e (Home \u0026rarr; Combine или через поиск). \u003ci\u003eЗачем: мы добавим к товарам названия типов и поставщиков.\u003c/i\u003e"},{"img":"120. product type product.png","act":"select","box":[34,49.5,18,3.5],"en":"In the \u003cb\u003eMerge\u003c/b\u003e dialog click the \u003cb\u003eProductTypeID\u003c/b\u003e column in the top table, then select \u003cb\u003e2026-2027 IMSALES ProductTypes csv\u003c/b\u003e as the right table. \u003ci\u003eWhy: ProductTypeID is the matching key between products and product types.\u003c/i\u003e","ru":"В окне \u003cb\u003eMerge\u003c/b\u003e выделите столбец \u003cb\u003eProductTypeID\u003c/b\u003e в верхней таблице, затем выберите \u003cb\u003e2026-2027 IMSALES ProductTypes csv\u003c/b\u003e в списке правой таблицы. \u003ci\u003eЗачем: ProductTypeID это ключ связи между товарами и типами товаров.\u003c/i\u003e"},{"img":"121. prod type id outer.png","act":"click","box":[61.5,86,3.5,3.8],"en":"Select \u003cb\u003eProductTypeID\u003c/b\u003e in the bottom table, keep Join kind as \u003cb\u003eLeft outer\u003c/b\u003e (all 77 rows match), and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eWhy: Left outer keeps every product even if a category were missing.\u003c/i\u003e","ru":"Выделите \u003cb\u003eProductTypeID\u003c/b\u003e в нижней таблице, оставьте тип соединения \u003cb\u003eLeft outer\u003c/b\u003e (совпадают все 77 строк) и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eЗачем: Left outer гарантирует, что ни один товар не потеряется.\u003c/i\u003e"},{"img":"122. double arrow column.png","act":"click","box":[80.5,23,1.8,3],"en":"A new column with \u003ci\u003e[Table]\u003c/i\u003e values appears on the right. Click the \u003cb\u003eexpand (double-arrow)\u003c/b\u003e icon in its header. \u003ci\u003eWhy: we need to pick which columns from ProductTypes to bring into Products.\u003c/i\u003e","ru":"Справа появился новый столбец со значениями \u003ci\u003e[Table]\u003c/i\u003e. Нажмите на иконку \u003cb\u003eразворота (двойная стрелка)\u003c/b\u003e в его заголовке. \u003ci\u003eЗачем: нужно выбрать, какие именно колонки из ProductTypes перенести в таблицу товаров.\u003c/i\u003e"},{"img":"123. select product name.png","act":"click","box":[63.2,37,12.8,22.5],"en":"Tick only \u003cb\u003eProductTypeName\u003c/b\u003e, uncheck \u003ci\u003eUse original column name as prefix\u003c/i\u003e, and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eWhy: we only need the readable category name, not the duplicate ID or description.\u003c/i\u003e","ru":"Отметьте только \u003cb\u003eProductTypeName\u003c/b\u003e, снимите галочку \u003ci\u003eUse original column name as prefix\u003c/i\u003e и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eЗачем: нам нужно только название категории, без дубля ID и описания.\u003c/i\u003e"},{"img":"124. merge queries (suppliers).png","act":"click","box":[84.8,13.8,2.7,3.4],"en":"Now merge the suppliers table: in the \u003cb\u003eHome\u003c/b\u003e toolbar click \u003cb\u003eMerge queries\u003c/b\u003e again. \u003ci\u003eWhy: we also need supplier details (name and country) for each product.\u003c/i\u003e","ru":"Теперь присоединим таблицу поставщиков: на панели \u003cb\u003eHome\u003c/b\u003e снова нажмите \u003cb\u003eMerge queries\u003c/b\u003e. \u003ci\u003eЗачем: для каждого товара нужны также данные о поставщике.\u003c/i\u003e"},{"img":"125. suppliers id merge.png","act":"select","box":[34,52,18,3.5],"en":"Click the \u003cb\u003eSupplierID\u003c/b\u003e column in the top table, then choose \u003cb\u003e2026-2027 IMSALES Suppliers csv\u003c/b\u003e as the right table. \u003ci\u003eWhy: SupplierID links each product to its supplier.\u003c/i\u003e","ru":"Выделите столбец \u003cb\u003eSupplierID\u003c/b\u003e в верхней таблице и выберите \u003cb\u003e2026-2027 IMSALES Suppliers csv\u003c/b\u003e в списке правой таблицы. \u003ci\u003eЗачем: SupplierID связывает каждый товар с его поставщиком.\u003c/i\u003e"},{"img":"126. supplier id outer left ok.png","act":"click","box":[61.7,85.8,3.5,3.8],"en":"Select \u003cb\u003eSupplierID\u003c/b\u003e in the bottom table, keep \u003cb\u003eLeft outer\u003c/b\u003e (77 of 77 rows match), and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eThis joins the supplier records to the products table.\u003c/i\u003e","ru":"Выделите \u003cb\u003eSupplierID\u003c/b\u003e в нижней таблице, оставьте \u003cb\u003eLeft outer\u003c/b\u003e (совпадают все 77 строк) и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eТак данные поставщиков присоединяются к таблице товаров.\u003c/i\u003e"},{"img":"127. double arrow column company name.png","act":"click","box":[63.5,36.2,12.5,22.8],"en":"Click the \u003cb\u003eexpand\u003c/b\u003e icon on the Suppliers column. Tick \u003cb\u003eCompanyName\u003c/b\u003e (and also \u003cb\u003eCountry\u003c/b\u003e further down if you want to populate \u003ci\u003esupplier_country\u003c/i\u003e), uncheck the prefix box, and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eNote: in this screenshot only CompanyName was ticked \u0026mdash; add Country when retaking screenshots.\u003c/i\u003e","ru":"Нажмите иконку \u003cb\u003eразворота\u003c/b\u003e у столбца Suppliers. Отметьте \u003cb\u003eCompanyName\u003c/b\u003e (и \u003cb\u003eCountry\u003c/b\u003e ниже по списку, чтобы заполнить \u003ci\u003esupplier_country\u003c/i\u003e), снимите галочку префикса и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eПримечание: на этом скриншоте отмечен только CompanyName \u0026mdash; позже можно доснять кадр с Country.\u003c/i\u003e"},{"img":"128. rename to supplier name.png","act":"type","box":[70,23,6.5,2.8],"en":"Double-click the \u003cb\u003eCompanyName\u003c/b\u003e header and rename it to \u003cb\u003eSupplierName\u003c/b\u003e (and \u003cb\u003eCountry\u003c/b\u003e to \u003cb\u003eSupplierCountry\u003c/b\u003e if included). \u003ci\u003eWhy: clear names make column mapping to the staging table effortless.\u003c/i\u003e","ru":"Дважды кликните по заголовку \u003cb\u003eCompanyName\u003c/b\u003e и переименуйте его в \u003cb\u003eSupplierName\u003c/b\u003e (и \u003cb\u003eCountry\u003c/b\u003e в \u003cb\u003eSupplierCountry\u003c/b\u003e, если добавили). \u003ci\u003eЗачем: понятные имена упрощают сопоставление колонок со staging-таблицей.\u003c/i\u003e"},{"img":"GUIDE\\135. change type.png","act":"click","box":[45.6,37.5,10.8,2.5],"en":"Click the data type icon on the \u003cb\u003eDiscontinued\u003c/b\u003e header and choose \u003cb\u003eWhole number\u003c/b\u003e. \u003ci\u003eWhy: in stg_dim_product, product_discontinued is an integer (0/1), not True/False.\u003c/i\u003e","ru":"Нажмите на иконку типа данных в заголовке \u003cb\u003eDiscontinued\u003c/b\u003e и выберите \u003cb\u003eWhole number\u003c/b\u003e. \u003ci\u003eЗачем: в stg_dim_product поле product_discontinued имеет тип целого числа (0/1), а не True/False.\u003c/i\u003e"},{"img":"GUIDE\\135.1 change type 123.png","act":"look","box":[54.8,29.5,7,65.5],"en":"Check the result: \u003cb\u003eDiscontinued\u003c/b\u003e now shows \u003cb\u003e123\u003c/b\u003e (Whole number) with values 0 and 1. \u003ci\u003eWhy: this prevents type mismatch errors when loading into the warehouse.\u003c/i\u003e","ru":"Проверьте результат: у \u003cb\u003eDiscontinued\u003c/b\u003e теперь тип \u003cb\u003e123\u003c/b\u003e (Whole number) и значения 0 / 1. \u003ci\u003eЗачем: это исключает ошибку типов при записи в warehouse.\u003c/i\u003e"},{"img":"130. destination.png","act":"click","box":[97.2,90.8,2,2.8],"en":"Now set where the data goes. In the bottom-right panel next to \u003cb\u003eData destination\u003c/b\u003e click \u003cb\u003e+\u003c/b\u003e (\u003ci\u003eAdd data destination\u003c/i\u003e). \u003ci\u003eWhy: the dataflow must write the transformed products into our staging warehouse.\u003c/i\u003e","ru":"Теперь укажем, куда записывать данные. В правом нижнем углу рядом с \u003cb\u003eData destination\u003c/b\u003e нажмите \u003cb\u003e+\u003c/b\u003e (\u003ci\u003eAdd data destination\u003c/i\u003e). \u003ci\u003eЗачем: dataflow должен сохранить объединённые товары в staging warehouse.\u003c/i\u003e"},{"img":"131. destination warehouse.png","act":"click","box":[87.2,78.5,10.3,3],"en":"Choose \u003cb\u003eWarehouse\u003c/b\u003e. \u003ci\u003eWhy: STG_IMSALES_2026_2027 is a Fabric Warehouse.\u003c/i\u003e","ru":"Выберите \u003cb\u003eWarehouse\u003c/b\u003e. \u003ci\u003eЗачем: STG_IMSALES_2026_2027 это Fabric Warehouse.\u003c/i\u003e"},{"img":"132. select warehouse.png","act":"click","box":[90.3,89.5,3.9,3.7],"en":"Keep the existing warehouse connection and click \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eWhy: this authenticates the dataflow to your workspace warehouses.\u003c/i\u003e","ru":"Оставьте существующее подключение к warehouse и нажмите \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eЗачем: это даёт dataflow доступ к хранилищам вашего workspace.\u003c/i\u003e"},{"img":"133. existing stg dim product.png","act":"select","box":[11.4,83.5,20.1,2.8],"en":"Select \u003cb\u003eExisting table\u003c/b\u003e, expand \u003cb\u003eSTG_IMSALES_2026_2027 \u0026rarr; dbo\u003c/b\u003e, pick \u003cb\u003estg_dim_product\u003c/b\u003e, and click \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eWhy: the staging table was already created by the SQL script.\u003c/i\u003e","ru":"Выберите \u003cb\u003eExisting table\u003c/b\u003e, раскройте \u003cb\u003eSTG_IMSALES_2026_2027 \u0026rarr; dbo\u003c/b\u003e, отметьте \u003cb\u003estg_dim_product\u003c/b\u003e и нажмите \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eЗачем: staging-таблица уже создана ранее SQL-скриптом.\u003c/i\u003e"},{"img":"134. destination settings.png","act":"click","box":[33.6,25,5.7,8.6],"en":"Under \u003cb\u003eUpdate method\u003c/b\u003e keep \u003cb\u003eReplace\u003c/b\u003e selected. \u003ci\u003eWhy: Replace clears old rows before each load so reruns never create duplicates.\u003c/i\u003e \u003ci\u003eAppend vs Replace: inside the pipeline both work identically because the SQL scripts clear all stg_* tables beforehand. Use \u003cb\u003eAppend\u003c/b\u003e to keep the table schema untouched (avoid running the dataflow standalone twice without clearing), or \u003cb\u003eReplace\u003c/b\u003e when testing a dataflow manually so it overwrites old rows without duplicates.\u003c/i\u003e","ru":"В разделе \u003cb\u003eUpdate method\u003c/b\u003e выберите \u003cb\u003eReplace\u003c/b\u003e. \u003ci\u003eЗачем: Replace очищает таблицу перед каждой загрузкой, чтобы повторный запуск не плодил дубли.\u003c/i\u003e \u003ci\u003eAppend или Replace: внутри пайплайна оба варианта работают одинаково, так как SQL-скрипты в начале заранее очищают таблицы stg_*. Используйте \u003cb\u003eAppend\u003c/b\u003e, чтобы не трогать структуру таблицы (но не запускайте dataflow вручную дважды без очистки), или \u003cb\u003eReplace\u003c/b\u003e при ручном тестовом запуске dataflow, чтобы старые строки перезаписывались без дублей.\u003c/i\u003e"},{"img":"135. update keys.png","act":"select","box":[11.2,45.5,36.8,37.5],"en":"Map each source column to its destination column (ProductID \u0026rarr; bk_product, ProductName \u0026rarr; product_name, QuantityPerUnit \u0026rarr; product_ship_quantity, UnitPrice \u0026rarr; product_unitprice, Discontinued \u0026rarr; product_discontinued, ProductTypeName \u0026rarr; producttype_name, SupplierName \u0026rarr; supplier_name; and SupplierCountry \u0026rarr; supplier_country if added), then click \u003cb\u003eSave settings\u003c/b\u003e. \u003ci\u003eWhy: ensures every column lands in the right field with a matching data type.\u003c/i\u003e","ru":"Сопоставьте колонки источника и назначения (ProductID \u0026rarr; bk_product, ProductName \u0026rarr; product_name, QuantityPerUnit \u0026rarr; product_ship_quantity, UnitPrice \u0026rarr; product_unitprice, Discontinued \u0026rarr; product_discontinued, ProductTypeName \u0026rarr; producttype_name, SupplierName \u0026rarr; supplier_name; и SupplierCountry \u0026rarr; supplier_country, если добавили), затем нажмите \u003cb\u003eSave settings\u003c/b\u003e. \u003ci\u003eЗачем: каждая колонка попадёт в нужное поле с подходящим типом данных.\u003c/i\u003e"},{"img":"GUIDE\\141. сопоставить.png","act":"click","box":[87.5,89.3,6.7,3.5],"en":"Verify the final \u003cb\u003eColumn mapping\u003c/b\u003e (leave \u003ci\u003eproduct_size\u003c/i\u003e and \u003ci\u003esupplier_country\u003c/i\u003e as (none) since they are not in the source CSVs) and click \u003cb\u003eSave settings\u003c/b\u003e. \u003ci\u003eWhy: completes the destination configuration for stg_dim_product.\u003c/i\u003e","ru":"Проверьте итоговый \u003cb\u003eColumn mapping\u003c/b\u003e (\u003ci\u003eproduct_size\u003c/i\u003e и \u003ci\u003esupplier_country\u003c/i\u003e остаются (none), так как их нет в исходных CSV) и нажмите \u003cb\u003eSave settings\u003c/b\u003e. \u003ci\u003eЗачем: завершает настройку приёмника для stg_dim_product.\u003c/i\u003e"},{"img":"136. save close.png","act":"click","box":[5,25.2,8.5,2.6],"en":"Open the Save drop-down at the top left and click \u003cb\u003eSave, run \u0026amp; close\u003c/b\u003e. \u003ci\u003eWhy: saves the dataflow and immediately tests loading stg_dim_product.\u003c/i\u003e","ru":"Раскройте меню сохранения в левом верхнем углу и нажмите \u003cb\u003eSave, run \u0026amp; close\u003c/b\u003e. \u003ci\u003eЗачем: сохраняет dataflow и сразу запускает тестовую загрузку stg_dim_product.\u003c/i\u003e"},{"img":"137. move to folder.png","act":"click","box":[12.1,10.6,5.2,3.2],"en":"Back in the workspace, tick \u003cb\u003eDF LOAD DIM PRODUCT STG\u003c/b\u003e and click \u003cb\u003eMove\u003c/b\u003e in the toolbar. \u003ci\u003eWhy: all staging dataflows belong in the 02 Staging Area folder.\u003c/i\u003e","ru":"Вернувшись в workspace, отметьте галочкой \u003cb\u003eDF LOAD DIM PRODUCT STG\u003c/b\u003e и нажмите \u003cb\u003eMove\u003c/b\u003e на панели. \u003ci\u003eЗачем: все staging-потоки должны лежать в папке 02 Staging Area.\u003c/i\u003e"},{"img":"138. staging folder.png","act":"click","box":[25.5,40.5,12.5,4],"en":"In the \u003cb\u003eMove 1 item\u003c/b\u003e dialog click \u003cb\u003e02 Staging Area\u003c/b\u003e. \u003ci\u003eThis opens the staging folder.\u003c/i\u003e","ru":"В окне \u003cb\u003eMove 1 item\u003c/b\u003e нажмите на папку \u003cb\u003e02 Staging Area\u003c/b\u003e. \u003ci\u003eЭто откроет папку staging-слоя.\u003c/i\u003e"},{"img":"139. here move.png","act":"click","box":[63.8,74.8,5.8,3.8],"en":"Click \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eNow the product dataflow is organized together with the shipper dataflow and pipeline.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eТеперь dataflow для товаров лежит в одной папке с потоком для перевозчиков и пайплайном.\u003c/i\u003e"},{"img":"140. pipeline.png","act":"click","box":[0.2,55,3.6,7],"en":"Open the pipeline \u003cb\u003ePL_IMSALES_LOAD_STG\u003c/b\u003e from the left sidebar (or from \u003cb\u003e02 Staging Area\u003c/b\u003e). \u003ci\u003eWhy: we need to add the new product dataflow to our ETL orchestration.\u003c/i\u003e","ru":"Откройте пайплайн \u003cb\u003ePL_IMSALES_LOAD_STG\u003c/b\u003e через левую панель (или из папки \u003cb\u003e02 Staging Area\u003c/b\u003e). \u003ci\u003eЗачем: нужно добавить новый dataflow товаров в общий ETL-пайплайн.\u003c/i\u003e"},{"img":"141. activities dataflow.png","act":"click","box":[11.8,8.6,5.8,3.6],"en":"On the \u003cb\u003eActivities\u003c/b\u003e tab click \u003cb\u003eDataflow\u003c/b\u003e to add a new Dataflow activity to the canvas. \u003ci\u003eWhy: this block will trigger DF LOAD DIM PRODUCT STG.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eActivities\u003c/b\u003e нажмите \u003cb\u003eDataflow\u003c/b\u003e, чтобы добавить новую активность на холст. \u003ci\u003eЗачем: этот блок будет запускать DF LOAD DIM PRODUCT STG.\u003c/i\u003e"},{"img":"142. name dataflow.png","act":"type","box":[17.6,76,15.8,3.2],"en":"Select the new Dataflow activity and on the \u003cb\u003eGeneral\u003c/b\u003e tab set \u003cb\u003eName\u003c/b\u003e to \u003cb\u003eDF Load DIM Product\u003c/b\u003e. \u003ci\u003eWhy: clear activity names keep the pipeline diagram readable.\u003c/i\u003e","ru":"Выделите новую активность Dataflow и на вкладке \u003cb\u003eGeneral\u003c/b\u003e задайте \u003cb\u003eName\u003c/b\u003e: \u003cb\u003eDF Load DIM Product\u003c/b\u003e. \u003ci\u003eЗачем: понятные имена делают схему пайплайна читаемой.\u003c/i\u003e"},{"img":"143. dataflow settings product stg.png","act":"select","box":[17.8,86.2,15.6,3.3],"en":"Open the \u003cb\u003eSettings\u003c/b\u003e tab, keep your \u003cb\u003eWorkspace\u003c/b\u003e, open the \u003cb\u003eDataflow\u003c/b\u003e list and choose \u003cb\u003eDF LOAD DIM PRODUCT STG\u003c/b\u003e. \u003ci\u003eWhy: links this pipeline step to the product dataflow you just built.\u003c/i\u003e","ru":"Откройте вкладку \u003cb\u003eSettings\u003c/b\u003e, оставьте свой \u003cb\u003eWorkspace\u003c/b\u003e, раскройте список \u003cb\u003eDataflow\u003c/b\u003e и выберите \u003cb\u003eDF LOAD DIM PRODUCT STG\u003c/b\u003e. \u003ci\u003eЗачем: связывает шаг пайплайна с только что созданным dataflow товаров.\u003c/i\u003e"},{"img":"144. relationship wait dataflow prod.png","act":"drag","box":[36.2,30.8,18,16.7],"en":"Drag from the green check mark of \u003cb\u003eWait for cleaning\u003c/b\u003e to \u003cb\u003eDF Load DIM Product\u003c/b\u003e. \u003ci\u003eWhy: ensures product loading starts only after all staging tables have been cleared.\u003c/i\u003e","ru":"Потяните от зелёной галочки \u003cb\u003eWait for cleaning\u003c/b\u003e к блоку \u003cb\u003eDF Load DIM Product\u003c/b\u003e. \u003ci\u003eЗачем: загрузка товаров должна начинаться только после очистки staging-таблиц.\u003c/i\u003e"},{"img":"145. save.png","act":"click","box":[4.5,9.2,2.3,3.3],"en":"Click \u003cb\u003eSave\u003c/b\u003e in the top-left corner to save the updated pipeline. \u003ci\u003eDone: the Product dimension load is now part of your staging pipeline.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eSave\u003c/b\u003e в левом верхнем углу, чтобы сохранить обновлённый пайплайн. \u003ci\u003eГотово: загрузка измерения Product теперь встроена в ваш staging-пайплайн.\u003c/i\u003e"},{"img":"Practicals 4-5\\1. new item.png","act":"click","box":[4.9,10.6,6.7,3.7],"en":"Next is the \u003cb\u003eStaff\u003c/b\u003e dimension. In your workspace (renamed here to \u003ci\u003eGuide for Fabric\u003c/i\u003e \u0026mdash; use your own workspace) click \u003cb\u003e+ New item\u003c/b\u003e. \u003ci\u003eWhy: we will create a Dataflow Gen2 to load staff and calculate Age and Seniority.\u003c/i\u003e","ru":"Дальше делаем измерение \u003cb\u003eStaff\u003c/b\u003e. В вашем workspace (здесь он переименован в \u003ci\u003eGuide for Fabric\u003c/i\u003e \u0026mdash; используйте свой) нажмите \u003cb\u003e+ New item\u003c/b\u003e. \u003ci\u003eЗачем: создадим Dataflow Gen2 для загрузки сотрудников и расчёта возраста и стажа.\u003c/i\u003e"},{"img":"Practicals 4-5\\2. df gen2.png","act":"click","box":[46.1,20.9,7.7,13.9],"en":"Click the \u003cb\u003eDataflow Gen2\u003c/b\u003e card. \u003ci\u003eThis csv\u003c/b\u003e и нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eТак таблица сотрудников загрузится в Power Query.\u003c/i\u003e"},{"img":"Practicals 4-5\\7. use 1st row.png","act":"click","box":[11.2,13.7,12.3,4.2],"en":"On the \u003cb\u003eTransform\u003c/b\u003e tab click \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eWhy: promotes StaffID, LastName, FirstName, BirthDate, HireDate, etc. to column headers.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eTransform\u003c/b\u003e нажмите \u003cb\u003eUse first row as headers\u003c/b\u003e. \u003ci\u003eЗачем: перенесёт StaffID, LastName, FirstName, BirthDate, HireDate и др. в заголовки колонок.\u003c/i\u003e"},{"img":"Practicals 4-5\\8. age.png","act":"click","box":[65,18.5,9,3],"en":"Select the \u003cb\u003eBirthDate\u003c/b\u003e column, open \u003cb\u003eAdd column \u0026rarr; Date \u0026rarr; Age\u003c/b\u003e. \u003ci\u003eWhy: calculates the duration from each employee\u0027s birth date to today.\u003c/i\u003e","ru":"Выделите столбец \u003cb\u003eBirthDate\u003c/b\u003e, откройте \u003cb\u003eAdd column \u0026rarr; Date \u0026rarr; Age\u003c/b\u003e. \u003ci\u003eЗачем: посчитает длительность от даты рождения до сегодняшнего дня.\u003c/i\u003e"},{"img":"Practicals 4-5\\9. total years.png","act":"click","box":[75,35,7,3],"en":"With the new \u003cb\u003eAge\u003c/b\u003e column selected, open \u003cb\u003eTransform \u0026rarr; Duration \u0026rarr; Total years\u003c/b\u003e. \u003ci\u003eWhy: converts the duration into years.\u003c/i\u003e","ru":"Не снимая выделения с новой колонки \u003cb\u003eAge\u003c/b\u003e, откройте \u003cb\u003eTransform \u0026rarr; Duration \u0026rarr; Total years\u003c/b\u003e. \u003ci\u003eЗачем: переведёт длительность в годы.\u003c/i\u003e"},{"img":"Practicals 4-5\\10. round down.png","act":"click","box":[68.5,22.8,6.2,2.8],"en":"Open \u003cb\u003eTransform \u0026rarr; Rounding \u0026rarr; Round down\u003c/b\u003e. \u003ci\u003eWhy: keeps full completed years as a whole number.\u003c/i\u003e","ru":"Откройте \u003cb\u003eTransform \u0026rarr; Rounding \u0026rarr; Round down\u003c/b\u003e. \u003ci\u003eЗачем: оставит целое число полных лет.\u003c/i\u003e"},{"img":"Practicals 4-5\\11. hire date age.png","act":"click","box":[65,18.5,9,3],"en":"Now select \u003cb\u003eHireDate\u003c/b\u003e and click \u003cb\u003eAdd column \u0026rarr; Date \u0026rarr; Age\u003c/b\u003e again. \u003ci\u003eWhy: calculates how long each employee has worked at the company.\u003c/i\u003e","ru":"Теперь выделите \u003cb\u003eHireDate\u003c/b\u003e и снова нажмите \u003cb\u003eAdd column \u0026rarr; Date \u0026rarr; Age\u003c/b\u003e. \u003ci\u003eЗачем: посчитает длительность работы сотрудника в компании.\u003c/i\u003e"},{"img":"Practicals 4-5\\12. hire date total years.png","act":"click","box":[75,35,7,3],"en":"On the new duration column click \u003cb\u003eTransform \u0026rarr; Duration \u0026rarr; Total years\u003c/b\u003e. \u003ci\u003eConverts tenure into years.\u003c/i\u003e","ru":"Для новой колонки нажмите \u003cb\u003eTransform \u0026rarr; Duration \u0026rarr; Total years\u003c/b\u003e. \u003ci\u003eПереводит стаж в годы.\u003c/i\u003e"},{"img":"Practicals 4-5\\13. hire date round down.png","act":"click","box":[68.5,22.8,6.2,2.8],"en":"Click \u003cb\u003eTransform \u0026rarr; Rounding \u0026rarr; Round down\u003c/b\u003e. \u003ci\u003eKeeps completed years of seniority.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eTransform \u0026rarr; Rounding \u0026rarr; Round down\u003c/b\u003e. \u003ci\u003eОставляет целое число полных лет стажа.\u003c/i\u003e"},{"img":"Practicals 4-5\\14. rename seniority.png","act":"type","box":[80,35,8,3],"en":"Double-click the new column header and rename it to \u003cb\u003eSeniority\u003c/b\u003e. \u003ci\u003eWhy: distinguishes seniority from Age when mapping columns.\u003c/i\u003e","ru":"Дважды кликните по заголовку новой колонки и переименуйте её в \u003cb\u003eSeniority\u003c/b\u003e. \u003ci\u003eЗачем: чтобы отличать стаж от возраста при маппинге.\u003c/i\u003e"},{"img":"Practicals 4-5\\14.1 merge names.png","act":"click","box":[34,13.5,7.5,3],"en":"Select \u003cb\u003eFirstName\u003c/b\u003e, hold \u003cb\u003eCtrl\u003c/b\u003e and select \u003cb\u003eLastName\u003c/b\u003e, then click \u003cb\u003eAdd column \u0026rarr; Merge columns\u003c/b\u003e. \u003ci\u003eWhy: stg_dim_staff expects a single staff_full_name column.\u003c/i\u003e","ru":"Выделите \u003cb\u003eFirstName\u003c/b\u003e, зажмите \u003cb\u003eCtrl\u003c/b\u003e и выделите \u003cb\u003eLastName\u003c/b\u003e, затем нажмите \u003cb\u003eAdd column \u0026rarr; Merge columns\u003c/b\u003e. \u003ci\u003eЗачем: в таблице stg_dim_staff есть поле staff_full_name.\u003c/i\u003e"},{"img":"Practicals 4-5\\14.2 name column.png","act":"type","box":[41,49,18,14],"en":"Choose \u003cb\u003eSpace\u003c/b\u003e as Separator, type \u003cb\u003eFullName\u003c/b\u003e as New column name, and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eCreates FirstName + LastName in one column.\u003c/i\u003e","ru":"Выберите разделитель \u003cb\u003eSpace\u003c/b\u003e, введите имя \u003cb\u003eFullName\u003c/b\u003e и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eОбъединит имя и фамилию через пробел.\u003c/i\u003e"},{"img":"Practicals 4-5\\15. add desitnation.png","act":"click","box":[97.2,90.8,2,2.8],"en":"Click \u003cb\u003e+\u003c/b\u003e next to \u003cb\u003eData destination\u003c/b\u003e in the bottom-right panel. \u003ci\u003eWhy: sets where the cleaned staff data will be saved.\u003c/i\u003e","ru":"Нажмите \u003cb\u003e+\u003c/b\u003e рядом с \u003cb\u003eData destination\u003c/b\u003e в правом нижнем углу. \u003ci\u003eЗачем: указываем, куда сохранить данные о сотрудниках.\u003c/i\u003e"},{"img":"Practicals 4-5\\16. warehouse.png","act":"click","box":[87.2,78.5,10.3,3],"en":"Choose \u003cb\u003eWarehouse\u003c/b\u003e and click \u003cb\u003eNext\u003c/b\u003e on the connection screen. \u003ci\u003eSTG_IMSALES_2026_2027 is a Fabric Warehouse.\u003c/i\u003e","ru":"Выберите \u003cb\u003eWarehouse\u003c/b\u003e и нажмите \u003cb\u003eNext\u003c/b\u003e на экране подключения. \u003ci\u003eSTG_IMSALES_2026_2027 это Fabric Warehouse.\u003c/i\u003e"},{"img":"Practicals 4-5\\17. staff existing table.png","act":"select","box":[11.4,83.5,20.1,2.8],"en":"Select \u003cb\u003eExisting table\u003c/b\u003e, expand \u003cb\u003eSTG_IMSALES_2026_2027 \u0026rarr; dbo\u003c/b\u003e, pick \u003cb\u003estg_dim_staff\u003c/b\u003e, and click \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eTargets the staging staff table.\u003c/i\u003e","ru":"Выберите \u003cb\u003eExisting table\u003c/b\u003e, раскройте \u003cb\u003eSTG_IMSALES_2026_2027 \u0026rarr; dbo\u003c/b\u003e, отметьте \u003cb\u003estg_dim_staff\u003c/b\u003e и нажмите \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eУказываем целевую таблицу сотрудников.\u003c/i\u003e"},{"img":"Practicals 4-5\\18.column mapping.png","act":"select","box":[11.2,49,37,34],"en":"Map \u003cb\u003eStaffID \u0026rarr; bk_staff\u003c/b\u003e, \u003cb\u003eLastName \u0026rarr; staff_surname\u003c/b\u003e, \u003cb\u003eFullName \u0026rarr; staff_full_name\u003c/b\u003e, \u003cb\u003eAge \u0026rarr; staff_age\u003c/b\u003e, \u003cb\u003eSeniority \u0026rarr; staff_seniority\u003c/b\u003e, \u003cb\u003estaff_photo \u0026rarr; staff_photo_url\u003c/b\u003e (leave territory/region/country as (none)) and click \u003cb\u003eSave settings\u003c/b\u003e. \u003ci\u003eMatches every available column 1-to-1.\u003c/i\u003e \u003ci\u003eAppend vs Replace: inside the pipeline both work identically because the SQL scripts clear all stg_* tables beforehand. Use \u003cb\u003eAppend\u003c/b\u003e to keep the table schema untouched (avoid running the dataflow standalone twice without clearing), or \u003cb\u003eReplace\u003c/b\u003e when testing a dataflow manually so it overwrites old rows without duplicates.\u003c/i\u003e","ru":"Сопоставьте \u003cb\u003eStaffID \u0026rarr; bk_staff\u003c/b\u003e, \u003cb\u003eLastName \u0026rarr; staff_surname\u003c/b\u003e, \u003cb\u003eFullName \u0026rarr; staff_full_name\u003c/b\u003e, \u003cb\u003eAge \u0026rarr; staff_age\u003c/b\u003e, \u003cb\u003eSeniority \u0026rarr; staff_seniority\u003c/b\u003e, \u003cb\u003estaff_photo \u0026rarr; staff_photo_url\u003c/b\u003e (territory/region/country оставьте (none)) и нажмите \u003cb\u003eSave settings\u003c/b\u003e. \u003ci\u003eТочное сопоставление доступных полей.\u003c/i\u003e \u003ci\u003eAppend или Replace: внутри пайплайна оба варианта работают одинаково, так как SQL-скрипты в начале заранее очищают таблицы stg_*. Используйте \u003cb\u003eAppend\u003c/b\u003e, чтобы не трогать структуру таблицы (но не запускайте dataflow вручную дважды без очистки), или \u003cb\u003eReplace\u003c/b\u003e при ручном тестовом запуске dataflow, чтобы старые строки перезаписывались без дублей.\u003c/i\u003e"},{"img":"Practicals 4-5\\19. save and clos.png","act":"click","box":[5,25.2,8.5,2.6],"en":"Open the Save drop-down and click \u003cb\u003eSave, run \u0026amp; close\u003c/b\u003e. \u003ci\u003eSaves and runs DF LOAD DIM STAFF STG.\u003c/i\u003e","ru":"Раскройте меню сохранения и нажмите \u003cb\u003eSave, run \u0026amp; close\u003c/b\u003e. \u003ci\u003eСохраняет и сразу запускает DF LOAD DIM STAFF STG.\u003c/i\u003e"},{"img":"Practicals 4-5\\20. df staff.png","act":"type","box":[17.6,65,15.8,3.2],"en":"Open \u003cb\u003ePL_IMSALES_LOAD_STG\u003c/b\u003e, add a \u003cb\u003eDataflow\u003c/b\u003e activity, and set \u003cb\u003eName\u003c/b\u003e to \u003cb\u003eDF Load DIM Staff\u003c/b\u003e. \u003ci\u003eAdds staff loading to the pipeline.\u003c/i\u003e","ru":"Откройте \u003cb\u003ePL_IMSALES_LOAD_STG\u003c/b\u003e, добавьте активность \u003cb\u003eDataflow\u003c/b\u003e и задайте \u003cb\u003eName\u003c/b\u003e: \u003cb\u003eDF Load DIM Staff\u003c/b\u003e. \u003ci\u003eДобавляет загрузку сотрудников в пайплайн.\u003c/i\u003e"},{"img":"Practicals 4-5\\21. settings df.png","act":"select","box":[17.8,83,15.6,3.3],"en":"On \u003cb\u003eSettings\u003c/b\u003e select your Workspace and choose \u003cb\u003eDF LOAD DIM STAFF STG\u003c/b\u003e. \u003ci\u003eLinks the activity to the staff dataflow.\u003c/i\u003e","ru":"На вкладке \u003cb\u003eSettings\u003c/b\u003e выберите свой Workspace и \u003cb\u003eDF LOAD DIM STAFF STG\u003c/b\u003e. \u003ci\u003eПривязывает активность к dataflow сотрудников.\u003c/i\u003e"},{"img":"Practicals 4-5\\22. connect staff df and name wait.png","act":"drag","box":[39,35,21,5],"en":"Connect the green check mark of \u003cb\u003eWait for cleaning\u003c/b\u003e to \u003cb\u003eDF Load DIM Staff\u003c/b\u003e. \u003ci\u003eEnsures staff loads only after cleaning finishes.\u003c/i\u003e","ru":"Протяните зелёную стрелку от \u003cb\u003eWait for cleaning\u003c/b\u003e к \u003cb\u003eDF Load DIM Staff\u003c/b\u003e. \u003ci\u003eЗагрузка начнётся только после очистки таблиц.\u003c/i\u003e"},{"img":"Practicals 4-5\\23. save pl.png","act":"click","box":[4.5,9.2,2.3,3.3],"en":"Click \u003cb\u003eSave\u003c/b\u003e in the pipeline toolbar. \u003ci\u003eSaves the updated pipeline.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eSave\u003c/b\u003e на верхней панели пайплайна. \u003ci\u003eСохраняет обновлённый пайплайн.\u003c/i\u003e"},{"img":"Practicals 4-5\\24. move to.png","act":"click","box":[12.1,10.6,5.2,3.2],"en":"Back in the workspace, tick \u003cb\u003eDF LOAD DIM STAFF STG\u003c/b\u003e and click \u003cb\u003eMove\u003c/b\u003e. \u003ci\u003eKeeps the workspace organized.\u003c/i\u003e","ru":"В workspace отметьте \u003cb\u003eDF LOAD DIM STAFF STG\u003c/b\u003e и нажмите \u003cb\u003eMove\u003c/b\u003e. \u003ci\u003eЧтобы поддерживать порядок в папках.\u003c/i\u003e"},{"img":"Practicals 4-5\\25. staging.png","act":"click","box":[25.5,40.5,12.5,4],"en":"Select \u003cb\u003e02 Staging Area\u003c/b\u003e and click \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eMoves the staff dataflow into the staging folder.\u003c/i\u003e","ru":"Выберите \u003cb\u003e02 Staging Area\u003c/b\u003e и нажмите \u003cb\u003eMove here\u003c/b\u003e. \u003ci\u003eПереносит dataflow сотрудников в папку staging.\u003c/i\u003e"},{"img":"Practicals 4-5\\26. new df.png","act":"click","box":[46.1,20.9,7.7,13.9],"en":"Now create the \u003cb\u003eDate\u003c/b\u003e dimension. Click \u003cb\u003e+ New item \u0026rarr; Dataflow Gen2\u003c/b\u003e. \u003ci\u003eWhy: we will generate a full calendar table from scratch (2024\u0026ndash;2026).\u003c/i\u003e","ru":"Теперь создадим измерение \u003cb\u003eDate\u003c/b\u003e. Нажмите \u003cb\u003e+ New item \u0026rarr; Dataflow Gen2\u003c/b\u003e. \u003ci\u003eЗачем: сгенерируем календарь с нуля за 2024\u0026ndash;2026 годы.\u003c/i\u003e"},{"img":"Practicals 4-5\\27. name df.png","act":"type","box":[39.3,48.3,21.4,4.1],"en":"Type \u003cb\u003eDF LOAD DIM DATE STG\u003c/b\u003e and click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eCreates the date dataflow.\u003c/i\u003e","ru":"Введите имя \u003cb\u003eDF LOAD DIM DATE STG\u003c/b\u003e и нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eСоздаёт dataflow для дат.\u003c/i\u003e"},{"img":"Practicals 4-5\\28. get data blank query.png","act":"click","box":[18,40.5,8.5,3],"en":"In the toolbar open \u003cb\u003eGet data \u0026rarr; Blank query\u003c/b\u003e. \u003ci\u003eWhy: dates are generated by a Power Query formula, not read from a CSV.\u003c/i\u003e","ru":"На панели инструментов откройте \u003cb\u003eGet data \u0026rarr; Blank query\u003c/b\u003e. \u003ci\u003eЗачем: даты генерируются формулой Power Query, а не из CSV.\u003c/i\u003e"},{"img":"Practicals 4-5\\29. code from helper file.png","act":"select","box":[4,31.5,52,3],"en":"Copy the \u003cb\u003eList.Dates(...)\u003c/b\u003e formula from \u003ci\u003eUseful HELPER file for Labs 4-5-6.sql\u003c/i\u003e (or click Copy below). \u003ci\u003eGenerates one row per day from 2024-01-01 to 2026-12-31.\u003c/i\u003e","ru":"Скопируйте формулу \u003cb\u003eList.Dates(...)\u003c/b\u003e из файла \u003ci\u003eUseful HELPER file for Labs 4-5-6.sql\u003c/i\u003e (или нажмите Копировать ниже). \u003ci\u003eСоздаёт по строке на каждый день с 2024-01-01 по 2026-12-31.\u003c/i\u003e","code":"List.Dates(#date(2024,1,1), Number.From(#date(2027,1,1)) - Number.From(#date(2024,1,1)), #duration(1,0,0,0))"},{"img":"Practicals 4-5\\30. run query.png","act":"click","box":[90.5,91,4,3.5],"en":"Paste the formula into the \u003cb\u003eBlank query\u003c/b\u003e editor and click \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eRuns the date list generator.\u003c/i\u003e","ru":"Вставьте формулу в редактор \u003cb\u003eBlank query\u003c/b\u003e и нажмите \u003cb\u003eNext\u003c/b\u003e. \u003ci\u003eЗапускает генератор списка дат.\u003c/i\u003e","code":"List.Dates(#date(2024,1,1), Number.From(#date(2027,1,1)) - Number.From(#date(2024,1,1)), #duration(1,0,0,0))"},{"img":"Practicals 4-5\\31. to table.png","act":"click","box":[4.8,13.8,2.8,6],"en":"Open the \u003cb\u003eList tools\u003c/b\u003e tab and click \u003cb\u003eTo table\u003c/b\u003e. \u003ci\u003eWhy: converts the list into a table so we can add columns.\u003c/i\u003e","ru":"Откройте вкладку \u003cb\u003eList tools\u003c/b\u003e и нажмите \u003cb\u003eTo table\u003c/b\u003e. \u003ci\u003eЗачем: преобразует список в таблицу, чтобы добавлять колонки.\u003c/i\u003e"},{"img":"Practicals 4-5\\32. to table ok.png","act":"click","box":[54.5,59.5,3.5,3.5],"en":"Keep default settings and click \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eCreates Column1 with all dates.\u003c/i\u003e","ru":"Оставьте настройки по умолчанию и нажмите \u003cb\u003eOK\u003c/b\u003e. \u003ci\u003eСоздаёт таблицу с одной колонкой Column1.\u003c/i\u003e"},{"img":"Practicals 4-5\\33. proper date.png","act":"type","box":[20,35.5,7.5,2.8],"en":"Double-click \u003cb\u003eColumn1\u003c/b\u003e and rename it to \u003cb\u003eproper_date\u003c/b\u003e. \u003ci\u003eMatches the destination column name in stg_dim_date.\u003c/i\u003e","ru":"Дважды клик const $ = id => document.getElementById(id);

function render(){
  const t = I18N[lang], s = STEPS[i], last = i === STEPS.length - 1;
  document.documentElement.lang = lang;
  $("title").innerHTML = t.title + "<small>" + t.sub + "</small>";
  $("img").src = IMAGES[s.img] || "";

  $("hint").textContent = t.hint;
    const cb = $("codebox"), cp = $("codepre"), cbtn = $("copybtn");

function fit(){
  const sh = $("shot"), im = $("img");

  const ar = im.naturalWidth / im.naturalHeight, box = $("shotbox");

function toggleFS(){
  const on = document.body.classList.toggle("fs");

};
$("lsave").onclick = () => {
  const a = Math.max(1, Math.min(STEPS.length, +$("lf").value || 1)), b = Math.max(a, Math.min(STEPS.length, +$("lt").value || STEPS.length));

  doc.querySelector("#app").textContent = code;
  doc.querySelector("title").textContent = document.title + " (steps " + a + "-" + b + ")";
  const html = "<!doctype html>" + NL + doc.outerHTML;

  link.href = url; link.download = "lesson-steps-" + a + "-" + b + ".html";

};

};

document.addEventListener("keydown", e => {
