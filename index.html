<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabric Step Guide</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470; --line:#dde1e6;
  --accent:#0f7b6c; --accent-ink:#ffffff; --hl:#e5322d; --chip:#eef1f4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--ink:#eceff2;--muted:#9aa4af;--line:#2c3238;--accent:#2bb5a0;--accent-ink:#06201b;--hl:#ff5a54;--chip:#272d33}
}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--ink:#eceff2;--muted:#9aa4af;--line:#2c3238;--accent:#2bb5a0;--accent-ink:#06201b;--hl:#ff5a54;--chip:#272d33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shot{position:relative;line-height:0;overflow:hidden}
.shot img{width:100%;height:auto;display:block}
.hl{position:absolute;border:3px solid var(--hl);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.16);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid rgba(229,50,45,.5)}50%{outline:8px solid rgba(229,50,45,0)}}
.cursor{position:absolute;width:34px;height:34px;pointer-events:none;transform:translate(-4px,-4px);animation:tap 1.4s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@keyframes tap{0%,100%{translate:0 0}50%{translate:-5px -5px}}
.panel{position:relative;z-index:2;background:var(--card);padding:16px 18px 18px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.txt{flex:1;min-width:0}
.chip{display:inline-block;background:var(--chip);color:var(--muted);font-size:12px;padding:2px 9px;border-radius:99px;margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.txt p{margin:0;font-size:17px}
.txt b{background:var(--chip);padding:0 5px;border-radius:4px}
nav{display:flex;align-items:center;gap:12px;margin-top:12px}
nav button.nav{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 22px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;min-width:110px}
nav button.nav.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav button.nav:disabled{opacity:.4;cursor:default}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--accent);transform:scale(1.25)}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.fsbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.fsbtn:hover{color:var(--ink)}
#fsx{display:none}
.lesson{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.lesson.open{display:flex}
.lesson input{width:64px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.lesson button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:6px 14px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.lesson .lnote{color:var(--muted);font-size:12px}
body.fs .lesson{display:none}
.shotbox{display:block}
/* full-page mode: the screenshot gets all the space, caption and buttons in one slim bar */
body.fs{overflow:hidden;background:#0b0d0f}
body.fs .wrap{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column}
body.fs header,body.fs .hint,body.fs .dots{display:none}
body.fs .stage{flex:1;min-height:0;display:flex;flex-direction:column;border:0;border-radius:0;background:#0b0d0f}
body.fs .shotbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
body.fs .shot{flex:none}
body.fs .panel{padding:8px 14px;gap:12px;align-items:center;border-top:1px solid var(--line);background:var(--card)}
body.fs .num{width:30px;height:30px;font-size:14px}
body.fs .txt p{font-size:15px;line-height:1.35}
body.fs .chip{margin:0 8px 0 0;font-size:11px}
body.fs .panel nav{margin:0;gap:8px;flex:none}
body.fs nav button.nav{padding:7px 16px;min-width:0}
body.fs #fsx{display:block;position:fixed;top:8px;right:8px;z-index:5;opacity:.55;background:var(--card)}
body.fs #fsx:hover{opacity:1}
@media (max-width:600px){
  .wrap{padding:12px 16px}
  nav button.nav{padding:12px 14px;min-width:84px}
  .txt p{font-size:16px}
  .panel{padding:14px}
}
.sections{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sections button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:5px 11px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.sections button:hover{color:var(--ink);border-color:var(--accent)}
.sections button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.codebox{display:none;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;align-items:flex-start;gap:10px}
.codebox.show{display:flex}
.codebox pre{margin:0;flex:1;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.codebox button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.codebox button:hover{border-color:var(--accent);color:var(--accent)}
body.fs .sections{display:flex;margin:0;padding:6px 140px 6px 12px;background:var(--card);border-bottom:1px solid var(--line);gap:6px;flex:none;z-index:4}
body.fs .sections button{padding:4px 10px;font-size:12px}
body.fs .codebox{margin-top:4px;padding:5px 8px}
body.fs .codebox pre{font-size:12px;max-height:54px;overflow:auto}
</style>
</head>
<body>
<button class="fsbtn" id="fsx"></button>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="tools">
      <button class="fsbtn" id="lsb"></button>
      <button class="fsbtn" id="fsb" title="F"></button>
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
  </header>

  <div class="lesson" id="lesson">
    <span id="lfrom"></span> <input type="number" id="lf" min="1" value="1">
    <span id="lto"></span> <input type="number" id="lt" min="1" value="1">
    <button id="lsave"></button>
    <span class="lnote" id="lnote"></span>
  </div>

  <div class="sections" id="sections"></div>
  <div class="stage">
    <div class="shotbox" id="shotbox">
    <div class="shot" id="shot">
      <img id="img" alt="">
      <div class="hl" id="hl"></div>
      <svg class="cursor" id="cur" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2l15 9.5-6.5 1.6 3.7 6.9-3 1.6-3.7-6.9L4.5 19z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    </div>
    <div class="panel">
      <div class="num" id="num"></div>
      <div class="txt"><span class="chip" id="chip"></span><p id="text"></p><div class="codebox" id="codebox"><pre id="codepre"></pre><button id="copybtn" type="button"></button></div></div>
    </div>
  </div>

  <nav>
    <button class="nav" id="prev"></button>
    <div class="dots" id="dots"></div>
    <button class="nav primary" id="next"></button>
  </nav>
  <div class="hint" id="hint"></div>
</div>

<script id="app">
const STEPS = [{"img":"1. Workspace.png","act":"type","box":[66.9,14.36,31.7,3.64],"en":"In the \u003cb\u003eCreate a workspace\u003c/b\u003e panel type the workspace name in \u003cb\u003eName\u003c/b\u003e. \u003ci\u003eWhy: the workspace holds all items of the lab in one place.\u003c/i\u003e","ru":"В панели \u003cb\u003eCreate a workspace\u003c/b\u003e введите имя workspace в поле \u003cb\u003eName\u003c/b\u003e. \u003ci\u003eЗачем: workspace хранит все объекты лабы в одном месте.\u003c/i\u003e"},{"img":"2. Fabric selection.png","act":"select","box":[67.0,50.63,32.5,11.74],"en":"Scroll down and select the workspace type \u003cb\u003eFabric\u003c/b\u003e. \u003ci\u003eWhy: only the Fabric type gives you lakehouses, warehouses and pipelines.\u003c/i\u003e","ru":"Прокрутите вниз и выберите тип workspace \u003cb\u003eFabric\u003c/b\u003e. \u003ci\u003eЗачем: только тип Fabric даёт lakehouse, warehouse и pipeline.\u003c/i\u003e"},{"img":"2. Fabric selection.png","act":"click","box":[67.0,95.21,3.9,4.04],"en":"Click \u003cb\u003eApply\u003c/b\u003e. \u003ci\u003eThis creates the workspace.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eApply\u003c/b\u003e. \u003ci\u003eТак создаётся workspace.\u003c/i\u003e"},{"img":"3. Workspace crated.png","act":"click","box":[4.6,7.03,6.6,3.8],"en":"The workspace is created and empty. Click \u003cb\u003e+ New item\u003c/b\u003e. \u003ci\u003eWhy: every object of the project is created from this button.\u003c/i\u003e","ru":"Workspace создан и пока пуст. Нажмите \u003cb\u003e+ New item\u003c/b\u003e. \u003ci\u003eЗачем: все объекты проекта создаются с этой кнопки.\u003c/i\u003e"},{"img":"4. Create lakehouse.png","act":"click","box":[63.9,17.37,16.5,15.72],"en":"In the search box type \u003cb\u003elake\u003c/b\u003e and click the \u003cb\u003eLakehouse\u003c/b\u003e card. \u003ci\u003eWhy: the lakehouse will store the raw source files.\u003c/i\u003e","ru":"В поиске введите \u003cb\u003elake\u003c/b\u003e и нажмите на карточку \u003cb\u003eLakehouse\u003c/b\u003e. \u003ci\u003eЗачем: lakehouse будет хранить исходные файлы как есть.\u003c/i\u003e"},{"img":"5. Name lakehouse.png","act":"type","box":[34.5,42.84,31.3,3.68],"en":"Type the lakehouse name using the group naming style, for example \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e. Keep \u003cb\u003eLakehouse schemas\u003c/b\u003e ticked. \u003ci\u003eWhy: a prefix like LH_ shows the item type at a glance.\u003c/i\u003e","ru":"Введите имя lakehouse по правилам группы, например \u003cb\u003eLH_IMSALES_SOURCES\u003c/b\u003e. Галочку \u003cb\u003eLakehouse schemas\u003c/b\u003e оставьте. \u003ci\u003eЗачем: префикс LH_ сразу показывает тип объекта.\u003c/i\u003e"},{"img":"5. Name lakehouse.png","act":"click","box":[57.3,60.58,4.0,3.77],"en":"Click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eThis creates the lakehouse.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eТак создаётся lakehouse.\u003c/i\u003e"},{"img":"6. Lakehouse created.png","act":"click","box":[30.25,55.84,11.0,20.64],"en":"The lakehouse is ready. Click the card \u003cb\u003eUpload files\u003c/b\u003e. \u003ci\u003eWhy: the source CSV files must get into the lakehouse first.\u003c/i\u003e","ru":"Lakehouse создан. Нажмите на карточку \u003cb\u003eUpload files\u003c/b\u003e. \u003ci\u003eЗачем: сначала исходные CSV надо загрузить в lakehouse.\u003c/i\u003e"},{"img":"7. Upload files.png","act":"click","box":[17.2,61.14,10.3,3.66],"en":"In the Explorer hover over the \u003cb\u003eFiles\u003c/b\u003e folder, click the three dots \u003cb\u003e...\u003c/b\u003e and choose \u003cb\u003eUpload\u003c/b\u003e. \u003ci\u003eWhy: one upload moves the whole folder with all source files.\u003c/i\u003e","ru":"В Explorer наведите курсор на папку \u003cb\u003eFiles\u003c/b\u003e, нажмите три точки \u003cb\u003e...\u003c/b\u003e и выберите \u003cb\u003eUpload\u003c/b\u003e. \u003ci\u003eЗачем: одной загрузкой переносится вся папка с исходными файлами.\u003c/i\u003e"},{"img":"7. Upload files.png","act":"click","box":[27.75,65.35,7.75,3.66],"en":"In the submenu choose \u003cb\u003eUpload folder\u003c/b\u003e. \u003ci\u003eUpload folder keeps all files together in one folder.\u003c/i\u003e","ru":"В подменю выберите \u003cb\u003eUpload folder\u003c/b\u003e. \u003ci\u003eUpload folder оставляет все файлы вместе в одной папке.\u003c/i\u003e"},{"img":"8. choose folder.png","act":"select","box":[24.6,17.94,39.8,3.11],"en":"In the file dialog of your computer select the folder with the source CSV files and confirm. \u003ci\u003eWhy: this folder contains the CSV files and the SQL scripts.\u003c/i\u003e","ru":"В окне выбора папки на вашем компьютере выберите папку с исходными CSV-файлами и подтвердите. \u003ci\u003eЗачем: в этой папке лежат CSV и SQL-скрипты.\u003c/i\u003e"},{"img":"9. push upload.png","act":"click","box":[66.8,24.76,5.4,3.85],"en":"The folder name appears in the field. Click \u003cb\u003eUpload\u003c/b\u003e. \u003ci\u003eThis starts the upload.\u003c/i\u003e","ru":"Имя папки появилось в поле. Нажмите \u003cb\u003eUpload\u003c/b\u003e. \u003ci\u003eТак запускается загрузка.\u003c/i\u003e"},{"img":"10. files uploaded.png","act":"look","box":[66.8,39.04,32.1,52.54],"en":"Wait until every file in \u003cb\u003eCurrent uploads\u003c/b\u003e has a green check mark. There should be 14 files. \u003ci\u003eWhy: make sure no file failed before you move on.\u003c/i\u003e","ru":"Дождитесь, пока у каждого файла в \u003cb\u003eCurrent uploads\u003c/b\u003e появится зелёная галочка. Всего должно быть 14 файлов. \u003ci\u003eЗачем: убедиться, что ни один файл не упал, прежде чем идти дальше.\u003c/i\u003e"},{"img":"11. files available.png","act":"look","box":[20.9,34.15,77.2,61.81],"en":"Close the panel and open the uploaded folder \u003cb\u003esource data\u003c/b\u003e. The status bar says \u003ci\u003eShowing 14 items\u003c/i\u003e, so all files are in the lakehouse. \u003ci\u003eCheck: the files are in the lakehouse and ready to be read.\u003c/i\u003e","ru":"Закройте панель и откройте загруженную папку \u003cb\u003esource data\u003c/b\u003e. Внизу написано \u003ci\u003eShowing 14 items\u003c/i\u003e, значит все файлы на месте в lakehouse. \u003ci\u003eПроверка: файлы в lakehouse и готовы к чтению.\u003c/i\u003e"},{"img":"12. go back to workspace.png","act":"click","box":[0.0,11.38,3.9,5.03],"en":"Go back to the workspace: click \u003cb\u003eWorkspaces\u003c/b\u003e in the left bar and open your workspace. \u003ci\u003eWhy: the next step is to create the warehouse.\u003c/i\u003e","ru":"Вернитесь в workspace: нажмите \u003cb\u003eWorkspaces\u003c/b\u003e в левой панели и откройте свой workspace. \u003ci\u003eЗачем: дальше создаём warehouse.\u003c/i\u003e"},{"img":"13. choose workspace.png","act":"click","box":[5.1,33.38,16.2,3.67],"en":"In the \u003cb\u003eWorkspaces\u003c/b\u003e list click your workspace. \u003ci\u003eWhy: new items are created from the workspace page.\u003c/i\u003e","ru":"В списке \u003cb\u003eWorkspaces\u003c/b\u003e нажмите на свой workspace. \u003ci\u003eЗачем: новые объекты создаются со страницы workspace.\u003c/i\u003e"},{"img":"14. new item.png","act":"click","box":[4.85,10.79,6.65,3.66],"en":"Back on the workspace page click \u003cb\u003e+ New item\u003c/b\u003e. The lakehouse is already in the list. \u003ci\u003eWhy: you need to create the next item, the warehouse.\u003c/i\u003e","ru":"Вы снова на странице workspace. Нажмите \u003cb\u003e+ New item\u003c/b\u003e. Lakehouse уже есть в списке. \u003ci\u003eЗачем: нужно создать следующий объект, warehouse.\u003c/i\u003e"},{"img":"15. select warehouse.png","act":"click","box":[80.75,17.1,16.45,15.9],"en":"In the search box type \u003cb\u003ewareh\u003c/b\u003e and click the \u003cb\u003eWarehouse\u003c/b\u003e card (not \u003ci\u003eSample warehouse\u003c/i\u003e). \u003ci\u003eWhy: the final data warehouse (DW) will hold the dimension and fact tables.\u003c/i\u003e","ru":"В поиске введите \u003cb\u003ewareh\u003c/b\u003e и нажмите на карточку \u003cb\u003eWarehouse\u003c/b\u003e (не \u003ci\u003eSample warehouse\u003c/i\u003e). \u003ci\u003eЗачем: итоговое хранилище (DW) будет содержать таблицы измерений и фактов.\u003c/i\u003e"},{"img":"16. give name.png","act":"type","box":[34.5,45.77,31.2,3.68],"en":"Type the warehouse name using the group naming style, for example \u003cb\u003eDW_IMSALES_2026_2027\u003c/b\u003e. \u003ci\u003ePrefix DW_ marks the final warehouse.\u003c/i\u003e","ru":"Введите имя warehouse по правилам группы, например \u003cb\u003eDW_IMSALES_2026_2027\u003c/b\u003e. \u003ci\u003eПрефикс DW_ отмечает итоговое хранилище.\u003c/i\u003e"},{"img":"16. give name.png","act":"click","box":[57.25,58.27,4.05,3.86],"en":"Click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eThis creates the warehouse.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eТак создаётся warehouse.\u003c/i\u003e"},{"img":"17. warehouse created.png","act":"look","box":[4.4,13.86,14.8,31.41],"en":"The empty warehouse is created. The Explorer on the left shows \u003cb\u003eSchemas\u003c/b\u003e, \u003cb\u003eSecurity\u003c/b\u003e and \u003cb\u003eQueries\u003c/b\u003e. \u003ci\u003eWhy: the empty warehouse needs its tables.\u003c/i\u003e","ru":"Пустой warehouse создан. В Explorer слева видны \u003cb\u003eSchemas\u003c/b\u003e, \u003cb\u003eSecurity\u003c/b\u003e и \u003cb\u003eQueries\u003c/b\u003e. \u003ci\u003eЗачем: пустому хранилищу нужны таблицы.\u003c/i\u003e"},{"img":"18. new sql query.png","act":"click","box":[14.1,9.07,2.7,3.52],"en":"In the top toolbar click \u003cb\u003eNew SQL query\u003c/b\u003e. \u003ci\u003eWhy: the tables are created by a ready SQL script.\u003c/i\u003e","ru":"На верхней панели нажмите \u003cb\u003eNew SQL query\u003c/b\u003e. \u003ci\u003eЗачем: таблицы создаются готовым SQL-скриптом.\u003c/i\u003e"},{"img":"19. copy sql test (imsales_dw_2026).png","act":"select","box":[0.4,7.37,40.1,19.42],"en":"Open the script file \u003cb\u003eIMSALES_DW_2026.sql\u003c/b\u003e in any text editor, select all text (\u003cb\u003eCtrl+A\u003c/b\u003e) and copy it (\u003cb\u003eCtrl+C\u003c/b\u003e). \u003ci\u003eWhy: the script file contains all CREATE TABLE commands for the DW.\u003c/i\u003e","ru":"Откройте файл скрипта \u003cb\u003eIMSALES_DW_2026.sql\u003c/b\u003e в любом текстовом редакторе, выделите весь текст (\u003cb\u003eCtrl+A\u003c/b\u003e) и скопируйте (\u003cb\u003eCtrl+C\u003c/b\u003e). \u003ci\u003eЗачем: в файле скрипта лежат все команды CREATE TABLE для DW.\u003c/i\u003e"},{"img":"20. paste sql query (imsales_dw_2026).png","act":"type","box":[19.3,26.96,79.6,68.13],"en":"Go back to Fabric. Click into the empty SQL query editor and paste the script (\u003cb\u003eCtrl+V\u003c/b\u003e). \u003ci\u003eWhy: the script must be inside Fabric to run against this warehouse.\u003c/i\u003e","ru":"Вернитесь в Fabric. Нажмите в пустое поле SQL query и вставьте скрипт (\u003cb\u003eCtrl+V\u003c/b\u003e). \u003ci\u003eЗачем: скрипт должен оказаться в Fabric, чтобы выполниться на этом warehouse.\u003c/i\u003e"},{"img":"21. push run.png","act":"click","box":[19.8,19.18,3.9,3.69],"en":"Click \u003cb\u003eRun\u003c/b\u003e. \u003ci\u003eRun executes all commands of the script.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eRun\u003c/b\u003e. \u003ci\u003eRun выполняет все команды скрипта.\u003c/i\u003e"},{"img":"22. tables created.png","act":"look","box":[19.4,63.27,80.2,28.43],"en":"Wait for the \u003cb\u003eMessages\u003c/b\u003e panel. The status bar must say \u003ci\u003eSucceeded\u003c/i\u003e. This means the tables were created. \u003ci\u003eWhy: confirms that all commands finished without errors.\u003c/i\u003e","ru":"Дождитесь панели \u003cb\u003eMessages\u003c/b\u003e. Внизу должно быть \u003ci\u003eSucceeded\u003c/i\u003e. Это значит, что таблицы созданы. \u003ci\u003eЗачем: подтверждает, что все команды выполнились без ошибок.\u003c/i\u003e"},{"img":"23. tables visible.png","act":"look","box":[5.0,23.62,18.6,40.46],"en":"In другая роль.\u003c/i\u003e"},{"img":"27. name stg warehouse.png","act":"type","box":[34.5,45.37,31.2,3.87],"en":"Type the staging warehouse name using the group naming style, for example \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e. \u003ci\u003ePrefix STG_ marks the staging area.\u003c/i\u003e","ru":"Введите имя staging warehouse по правилам группы, например \u003cb\u003eSTG_IMSALES_2026_2027\u003c/b\u003e. \u003ci\u003eПрефикс STG_ отмечает staging-область.\u003c/i\u003e"},{"img":"27. name stg warehouse.png","act":"click","box":[57.25,57.91,4.05,3.87],"en":"Click \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eThis creates the staging warehouse.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eCreate\u003c/b\u003e. \u003ci\u003eТак создаётся staging warehouse.\u003c/i\u003e"},{"img":"28. new sql query.png","act":"click","box":[14.2,9.08,2.8,3.52],"en":"In the top toolbar click \u003cb\u003eNew SQL query\u003c/b\u003e. \u003ci\u003eWhy: staging tables are created by a SQL script too.\u003c/i\u003e","ru":"На верхней панели нажмите \u003cb\u003eNew SQL query\u003c/b\u003e. \u003ci\u003eЗачем: staging-таблицы тоже создаются SQL-скриптом.\u003c/i\u003e"},{"img":"29. copy stg_imsales_2026_2027 query.png","act":"select","box":[0.5,8.22,41.6,20.03],"en":"Open the staging script \u003cb\u003eSTG_IMSALES_2026_2027.sql\u003c/b\u003e, select all text (\u003cb\u003eCtrl+A\u003c/b\u003e) and copy it (\u003cb\u003eCtrl+C\u003c/b\u003e). \u003ci\u003eWhy: the script has CREATE TABLE commands for the staging tables.\u003c/i\u003e","ru":"Откройте staging-скрипт \u003cb\u003eSTG_IMSALES_2026_2027.sql\u003c/b\u003e, выделите весь текст (\u003cb\u003eCtrl+A\u003c/b\u003e) и скопируйте (\u003cb\u003eCtrl+C\u003c/b\u003e). \u003ci\u003eЗачем: в скрипте команды CREATE TABLE для staging-таблиц.\u003c/i\u003e"},{"img":"30. paste stg sql query.png","act":"type","box":[19.3,26.94,79.6,68.08],"en":"In Fabric click into the empty editor and paste the script (\u003cb\u003eCtrl+V\u003c/b\u003e). \u003ci\u003eWhy: the script must be inside Fabric to run.\u003c/i\u003e","ru":"В Fabric нажмите в пустое поле редактора и вставьте скрипт (\u003cb\u003eCtrl+V\u003c/b\u003e). \u003ci\u003eЗачем: скрипт должен быть в Fabric, чтобы выполниться.\u003c/i\u003e"},{"img":"31. run stg sql query.png","act":"click","box":[19.7,19.0,3.9,4.06],"en":"Click \u003cb\u003eRun\u003c/b\u003e. \u003ci\u003eWhy: this creates all staging tables.\u003c/i\u003e","ru":"Нажмите \u003cb\u003eRun\u003c/b\u003e. \u003ci\u003eЗачем: так создаются все staging-таблицы.\u003c/i\u003e"},{"img":"32. tables created.png","act":"look","box":[19.4,62.87,80.2,29.05],"en":"Wait for \u003cb\u003eMessages\u003c/b\u003e. The status bar must say \u003ci\u003eSucceeded\u003c/i\u003e. \u003ci\u003eWhy: confirms the script ran without errors.\u003c/i\u003e","ru":"Дождитесь \u003cb\u003eMessages\u003c/b\u003e. Внизу должно быть \u003ci\u003eSucceeded\u003c/i\u003e. \u003ci\u003eЗачем: подтверждает, что скрипт выполнился без ошибок.\u003c/i\u003e"},{"img":"33. tables visible.png","act":"look","box":[5.0,21.94,18.1,32.35],"en":"Expand \u003cb\u003eSchemas\u003c/b\u003e, \u003cb\u003edbo\u003c/b\u003e, \u003cb\u003eTables\u003c/b\u003e. You see the staging tables stg_dim_client, stg_dim_date, stg_dim_product, stg_dim_shipper, stg_dim_staff, stg_fact_inventory, stg_fact_sales. \u003ci\u003eCheck: the staging tables exist, now empty.\u003c/i\u003e","ru":"Раскройте \u003cb\u003eSchemas\u003c/b\u003e, \u003cb\u003edbo\u003c/b\u003e, \u003cb\u003eTables\u003c/b\u003e. Вы увидите staging-таблицы stg_dim_client, stg_dim_date, stg_dim_product, stg_dim_shipper, stg_dim_staff, stg_fact_inventory, stg_fact_sales. \u003ci\u003eПроверка: staging-таблицы созданы, пока пустые.\u003c/i\u003e"},{"img":"34. back to workspace.png","act":"click","box":[5.3,33.59,16.2,3.69],"en":"Go back to the workspace: click \u003cb\u003eWorkspaces\u003c/b\u003e on the left and select your workspace. \u003ci\u003eWhy: next we build the loading logic
