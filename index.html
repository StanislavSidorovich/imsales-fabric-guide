<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabric Step Guide</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470; --line:#dde1e6;
  --accent:#0f7b6c; --accent-ink:#ffffff; --hl:#e5322d; --chip:#eef1f4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--ink:#eceff2;--muted:#9aa4af;--line:#2c3238;--accent:#2bb5a0;--accent-ink:#06201b;--hl:#ff5a54;--chip:#272d33}
}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--ink:#eceff2;--muted:#9aa4af;--line:#2c3238;--accent:#2bb5a0;--accent-ink:#06201b;--hl:#ff5a54;--chip:#272d33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shot{position:relative;line-height:0;overflow:hidden}
.shot img{width:100%;height:auto;display:block}
.hl{position:absolute;border:3px solid var(--hl);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.16);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid rgba(229,50,45,.5)}50%{outline:8px solid rgba(229,50,45,0)}}
.cursor{position:absolute;width:34px;height:34px;pointer-events:none;transform:translate(-4px,-4px);animation:tap 1.4s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@keyframes tap{0%,100%{translate:0 0}50%{translate:-5px -5px}}
.panel{position:relative;z-index:2;background:var(--card);padding:16px 18px 18px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.txt{flex:1;min-width:0}
.chip{display:inline-block;background:var(--chip);color:var(--muted);font-size:12px;padding:2px 9px;border-radius:99px;margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.txt p{margin:0;font-size:17px}
.txt b{background:var(--chip);padding:0 5px;border-radius:4px}
nav{display:flex;align-items:center;gap:12px;margin-top:12px}
nav button.nav{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 22px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;min-width:110px}
nav button.nav.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav button.nav:disabled{opacity:.4;cursor:default}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--accent);transform:scale(1.25)}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.fsbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.fsbtn:hover{color:var(--ink)}
#fsx{display:none}
.lesson{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.lesson.open{display:flex}
.lesson input{width:64px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.lesson button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:6px 14px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.lesson .lnote{color:var(--muted);font-size:12px}
body.fs .lesson{display:none}
.shotbox{display:block}
/* full-page mode: the screenshot gets all the space, caption and buttons in one slim bar */
body.fs{overflow:hidden;background:#0b0d0f}
body.fs .wrap{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column}
body.fs header,body.fs .hint,body.fs .dots{display:none}
body.fs .stage{flex:1;min-height:0;display:flex;flex-direction:column;border:0;border-radius:0;background:#0b0d0f}
body.fs .shotbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
body.fs .shot{flex:none}
body.fs .panel{padding:8px 14px;gap:12px;align-items:center;border-top:1px solid var(--line);background:var(--card)}
body.fs .num{width:30px;height:30px;font-size:14px}
body.fs .txt p{font-size:15px;line-height:1.35}
body.fs .chip{margin:0 8px 0 0;font-size:11px}
body.fs .panel nav{margin:0;gap:8px;flex:none}
body.fs nav button.nav{padding:7px 16px;min-width:0}
body.fs #fsx{display:block;position:fixed;top:8px;right:8px;z-index:5;opacity:.55;background:var(--card)}
body.fs #fsx:hover{opacity:1}
@media (max-width:600px){
  .wrap{padding:12px 16px}
  nav button.nav{padding:12px 14px;min-width:84px}
  .txt p{font-size:16px}
  .panel{padding:14px}
}
.sections{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sections button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:5px 11px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.sections button:hover{color:var(--ink);border-color:var(--accent)}
.sections button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.codebox{display:none;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;align-items:flex-start;gap:10px}
.codebox.show{display:flex}
.codebox pre{margin:0;flex:1;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.codebox button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.codebox button:hover{border-color:var(--accent);color:var(--accent)}
body.fs .sections{display:flex;margin:0;padding:6px 140px 6px 12px;background:var(--card);border-bottom:1px solid var(--line);gap:6px;flex:none;z-index:4}
body.fs .sections button{padding:4px 10px;font-size:12px}
body.fs .codebox{margin-top:4px;padding:5px 8px}
body.fs .codebox pre{font-size:12px;max-height:54px;overflow:auto}

/* BOX_EDITOR_CSS */
.bl{position:absolute;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);background:rgba(240,242,245,0.28);border-radius:4px;pointer-events:none;z-index:1}
body.edit-mode .hl{pointer-events:auto;cursor:move;animation:none;outline:2px dashed #fff;z-index:3}
body.edit-mode .bl{pointer-events:auto;cursor:move;outline:1.5px dashed #0ea5e9;z-index:2}
.eh{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--hl);border-radius:2px;box-sizing:border-box;z-index:5}
.bl .eh{border-color:#0ea5e9}
.bdel{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:#0ea5e9;color:#fff;border:0;font:700 12px/18px sans-serif;text-align:center;cursor:pointer;z-index:6;padding:0}
.eh[data-d="nw"]{top:-6px;left:-6px;cursor:nwse-resize}
.eh[data-d="ne"]{top:-6px;right:-6px;cursor:nesw-resize}
.eh[data-d="se"]{bottom:-6px;right:-6px;cursor:nwse-resize}
.eh[data-d="sw"]{bottom:-6px;left:-6px;cursor:nesw-resize}
.eh[data-d="n"]{top:-6px;left:50%;transform:translateX(-50%);cursor:ns-resize}
.eh[data-d="s"]{bottom:-6px;left:50%;transform:translateX(-50%);cursor:ns-resize}
.eh[data-d="w"]{left:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize}
.eh[data-d="e"]{right:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize}
.ebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;padding:8px 12px;border:1px solid var(--hl);border-radius:10px;background:var(--card);font-size:13px}
.ebar code{background:var(--chip);padding:2px 6px;border-radius:4px;font-size:12px}
.ebar button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 10px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.ebar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<button class="fsbtn" id="fsx"></button>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="tools">
      <button class="fsbtn" id="lsb"></button>
      <button class="fsbtn" id="fsb" title="F"></button>
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
  </header>

  <div class="lesson" id="lesson">
    <span id="lfrom"></span> <input type="number" id="lf" min="1" value="1">
    <span id="lto"></span> <input type="number" id="lt" min="1" value="1">
    <button id="lsave"></button>
    <span class="lnote" id="lnote"></span>
  </div>

  <div class="sections" id="sections"></div>
  <div class="stage">
    <div class="shotbox" id="shotbox">
    <div class="shot" id="shot">
      <img id="img" alt="">
      <div class="hl" id="hl"></div>
      <svg class="cursor" id="cur" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2l15 9.5-6.5 1.6 3.7 6.9-3 1.6-3.7-6.9L4.5 19z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    </div>
    <div class="panel">
      <div class="num" id="num"></div>
      <div class="txt"><span class="chip" id="chip"></span><p id="text"></p><div class="codebox" id="codebox"><pre id="codepre"></pre><button id="copybtn" type="button"></button></div></div>
    </div>
  </div>

  <nav>
    <button class="nav" id="prev"></button>
    <div class="dots" id="dots"></div>
    <button class="nav primary" id="next"></button>
  </nav>
  <div class="hint" id="hint"></div>
</div>

<script id="app">
const STEPS = [{"img":"1. Workspace.png","act":"type","box":[66.9,14.36,31.7,3.64],"en":"In the <b>Create a workspace</b> panel type the workspace name in <b>Name</b>. <i>Why: the workspace holds all items of the lab in one place.</i>","ru":"В панели <b>Create a workspace</b> введите имя workspace в поле <b>Name</b>. <i>Зачем: workspace хранит все объекты лабы в одном месте.</i>"},{"img":"2. Fabric selection.png","act":"select","box":[67,50.63,32.5,11.74],"en":"Scroll down and select the workspace type <b>Fabric</b>. <i>Why: only the Fabric type gives you lakehouses, warehouses and pipelines.</i>","ru":"Прокрутите вниз и выберите тип workspace <b>Fabric</b>. <i>Зачем: только тип Fabric даёт lakehouse, warehouse и pipeline.</i>"},{"img":"2. Fabric selection.png","act":"click","box":[67,95.21,3.9,4.04],"en":"Click <b>Apply</b>. <i>This creates the workspace.</i>","ru":"Нажмите <b>Apply</b>. <i>Так создаётся workspace.</i>"},{"img":"3. Workspace crated.png","act":"click","box":[4.6,7.03,6.6,3.8],"en":"The workspace is created and empty. Click <b>+ New item</b>. <i>Why: every object of the project is created from this button.</i>","ru":"Workspace создан и пока пуст. Нажмите <b>+ New item</b>. <i>Зачем: все объекты проекта создаются с этой кнопки.</i>"},{"img":"4. Create lakehouse.png","act":"click","box":[63.9,17.37,16.5,15.72],"en":"In the search box type <b>lake</b> and click the <b>Lakehouse</b> card. <i>Why: the lakehouse will store the raw source files.</i>","ru":"В поиске введите <b>lake</b> и нажмите на карточку <b>Lakehouse</b>. <i>Зачем: lakehouse будет хранить исходные файлы как есть.</i>"},{"img":"5. Name lakehouse.png","act":"type","box":[34.5,42.84,31.3,3.68],"en":"Type the lakehouse name using the group naming style, for example <b>LH_IMSALES_SOURCES</b>. Keep <b>Lakehouse schemas</b> ticked. <i>Why: a prefix like LH_ shows the item type at a glance.</i>","ru":"Введите имя lakehouse по правилам группы, например <b>LH_IMSALES_SOURCES</b>. Галочку <b>Lakehouse schemas</b> оставьте. <i>Зачем: префикс LH_ сразу показывает тип объекта.</i>"},{"img":"5. Name lakehouse.png","act":"click","box":[57.3,60.58,4,3.77],"en":"Click <b>Create</b>. <i>This creates the lakehouse.</i>","ru":"Нажмите <b>Create</b>. <i>Так создаётся lakehouse.</i>"},{"img":"6. Lakehouse created.png","act":"click","box":[30.25,55.84,11,20.64],"en":"The lakehouse is ready. Click the card <b>Upload files</b>. <i>Why: the source CSV files must get into the lakehouse first.</i>","ru":"Lakehouse создан. Нажмите на карточку <b>Upload files</b>. <i>Зачем: сначала исходные CSV надо загрузить в lakehouse.</i>"},{"img":"7. Upload files.png","act":"click","box":[17.2,61.14,10.3,3.66],"en":"In the Explorer hover over the <b>Files</b> folder, click the three dots <b>...</b> and choose <b>Upload</b>. <i>Why: one upload moves the whole folder with all source files.</i>","ru":"В Explorer наведите курсор на папку <b>Files</b>, нажмите три точки <b>...</b> и выберите <b>Upload</b>. <i>Зачем: одной загрузкой переносится вся папка с исходными файлами.</i>"},{"img":"7. Upload files.png","act":"click","box":[27.75,65.35,7.75,3.66],"en":"In the submenu choose <b>Upload folder</b>. <i>Upload folder keeps all files together in one folder.</i>","ru":"В подменю выберите <b>Upload folder</b>. <i>Upload folder оставляет все файлы вместе в одной папке.</i>"},{"img":"8. choose folder.png","act":"select","box":[24.6,17.94,39.8,3.11],"en":"In the file dialog of your computer select the folder with the source CSV files and confirm. <i>Why: this folder contains the CSV files and the SQL scripts.</i>","ru":"В окне выбора папки на вашем компьютере выберите папку с исходными CSV-файлами и подтвердите. <i>Зачем: в этой папке лежат CSV и SQL-скрипты.</i>"},{"img":"9. push upload.png","act":"click","box":[66.8,24.76,5.4,3.85],"en":"The folder name appears in the field. Click <b>Upload</b>. <i>This starts the upload.</i>","ru":"Имя папки появилось в поле. Нажмите <b>Upload</b>. <i>Так запускается загрузка.</i>"},{"img":"10. files uploaded.png","act":"look","box":[66.8,39.04,32.1,52.54],"en":"Wait until every file in <b>Current uploads</b> has a green check mark. There should be 14 files. <i>Why: make sure no file failed before you move on.</i>","ru":"Дождитесь, пока у каждого файла в <b>Current uploads</b> появится зелёная галочка. Всего должно быть 14 файлов. <i>Зачем: убедиться, что ни один файл не упал, прежде чем идти дальше.</i>"},{"img":"11. files available.png","act":"look","box":[20.9,34.15,77.2,61.81],"en":"Close the panel and open the uploaded folder <b>source data</b>. The status bar says <i>Showing 14 items</i>, so all files are in the lakehouse. <i>Check: the files are in the lakehouse and ready to be read.</i>","ru":"Закройте панель и откройте загруженную папку <b>source data</b>. Внизу написано <i>Showing 14 items</i>, значит все файлы на месте в lakehouse. <i>Проверка: файлы в lakehouse и готовы к чтению.</i>"},{"img":"12. go back to workspace.png","act":"click","box":[0,11.38,3.9,5.03],"en":"Go back to the workspace: click <b>Workspaces</b> in the left bar and open your workspace. <i>Why: the next step is to create the warehouse.</i>","ru":"Вернитесь в workspace: нажмите <b>Workspaces</b> в левой панели и откройте свой workspace. <i>Зачем: дальше создаём warehouse.</i>"},{"img":"13. choose workspace.png","act":"click","box":[5.1,33.38,16.2,3.67],"en":"In the <b>Workspaces</b> list click your workspace. <i>Why: new items are created from the workspace page.</i>","ru":"В списке <b>Workspaces</b> нажмите на свой workspace. <i>Зачем: новые объекты создаются со страницы workspace.</i>"},{"img":"14. new item.png","act":"click","box":[4.85,10.79,6.65,3.66],"en":"Back on the workspace page click <b>+ New item</b>. The lakehouse is already in the list. <i>Why: you need to create the next item, the warehouse.</i>","ru":"Вы снова на странице workspace. Нажмите <b>+ New item</b>. Lakehouse уже есть в списке. <i>Зачем: нужно создать следующий объект, warehouse.</i>"},{"img":"15. select warehouse.png","act":"click","box":[80.75,17.1,16.45,15.9],"en":"In the search box type <b>wareh</b> and click the <b>Warehouse</b> card (not <i>Sample warehouse</i>). <i>Why: the final data warehouse (DW) will hold the dimension and fact tables.</i>","ru":"В поиске введите <b>wareh</b> и нажмите на карточку <b>Warehouse</b> (не <i>Sample warehouse</i>). <i>Зачем: итоговое хранилище (DW) будет содержать таблицы измерений и фактов.</i>"},{"img":"16. give name.png","act":"type","box":[34.5,45.77,31.2,3.68],"en":"Type the warehouse name using the group naming style, for example <b>DW_IMSALES_2026_2027</b>. <i>Prefix DW_ marks the final warehouse.</i>","ru":"Введите имя warehouse по правилам группы, например <b>DW_IMSALES_2026_2027</b>. <i>Префикс DW_ отмечает итоговое хранилище.</i>"},{"img":"16. give name.png","act":"click","box":[57.25,58.27,4.05,3.86],"en":"Click <b>Create</b>. <i>This creates the warehouse.</i>","ru":"Нажмите <b>Create</b>. <i>Так создаётся warehouse.</i>"},{"img":"17. warehouse created.png","act":"look","box":[4.4,13.86,14.8,31.41],"en":"The empty warehouse is created. The Explorer on the left shows <b>Schemas</b>, <b>Security</b> and <b>Queries</b>. <i>Why: the empty warehouse needs its tables.</i>","ru":"Пустой warehouse создан. В Explorer слева видны <b>Schemas</b>, <b>Security</b> и <b>Queries</b>. <i>Зачем: пустому хранилищу нужны таблицы.</i>"},{"img":"18. new sql query.png","act":"click","box":[14.1,9.07,2.7,3.52],"en":"In the top toolbar click <b>New SQL query</b>. <i>Why: the tables are created by a ready SQL script.</i>","ru":"На верхней панели нажмите <b>New SQL query</b>. <i>Зачем: таблицы создаются готовым SQL-скриптом.</i>"},{"img":"19. copy sql test (imsales_dw_2026).png","act":"select","box":[0.4,7.37,40.1,19.42],"en":"Open the script file <b>IMSALES_DW_2026.sql</b> in any text editor, select all text (<b>Ctrl+A</b>) and copy it (<b>Ctrl+C</b>). <i>Why: the script file contains all CREATE TABLE commands for the DW.</i>","ru":"Откройте файл скрипта <b>IMSALES_DW_2026.sql</b> в любом текстовом редакторе, выделите весь текст (<b>Ctrl+A</b>) и скопируйте (<b>Ctrl+C</b>). <i>Зачем: в файле скрипта лежат все команды CREATE TABLE для DW.</i>"},{"img":"20. paste sql query (imsales_dw_2026).png","act":"type","box":[19.3,26.96,79.6,68.13],"en":"Go back to Fabric. Click into the empty SQL query editor and paste the script (<b>Ctrl+V</b>). <i>Why: the script must be inside Fabric to run against this warehouse.</i>","ru":"Вернитесь в Fabric. Нажмите в пустое поле SQL query и вставьте скрипт (<b>Ctrl+V</b>). <i>Зачем: скрипт должен оказаться в Fabric, чтобы выполниться на этом warehouse.</i>"},{"img":"21. push run.png","act":"click","box":[19.8,19.18,3.9,3.69],"en":"Click <b>Run</b>. <i>Run executes all commands of the script.</i>","ru":"Нажмите <b>Run</b>. <i>Run выполняет все команды скрипта.</i>"},{"img":"22. tables created.png","act":"look","box":[19.4,63.27,80.2,28.43],"en":"Wait for the <b>Messages</b> panel. The status bar must say <i>Succeeded</i>. This means the tables were created. <i>Why: confirms that all commands finished without errors.</i>","ru":"Дождитесь панели <b>Messages</b>. Внизу должно быть <i>Succeeded</i>. Это значит, что таблицы созданы. <i>Зачем: подтверждает, что все команды выполнились без ошибок.</i>"},{"img":"23. tables visible.png","act":"look","box":[5,23.62,18.6,40.46],"en":"In the Explorer expand <b>Schemas</b>, <b>dbo</b>, <b>Tables</b>. You see the new tables: dim_client, dim_date, dim_product, dim_shipper, dim_staff, fact_inventory, fact_sales. <i>Check: the DW tables exist, now empty.</i>","ru":"В Explorer раскройте <b>Schemas</b>, <b>dbo</b>, <b>Tables</b>. Вы увидите новые таблицы: dim_client, dim_date, dim_product, dim_shipper, dim_staff, fact_inventory, fact_sales. <i>Проверка: таблицы DW созданы, пока пустые.</i>"},{"img":"24. back to workspace.png","act":"click","box":[5.3,34.15,16.2,3.65],"en":"Go back to the workspace: click <b>Workspaces</b> on the left and select your workspace. <i>Why: next is the second warehouse, the staging area.</i>","ru":"Вернитесь в workspace: нажмите <b>Workspaces</b> слева и выберите свой workspace. <i>Зачем: дальше второй warehouse, staging-область.</i>"},{"img":"25. new item.png","act":"click","box":[4.85,10.64,6.75,3.67],"en":"Now create the staging warehouse. On the workspace page click <b>+ New item</b>. <i>Why: staging is a separate warehouse for raw loaded data.</i>","ru":"Теперь создаём staging warehouse. На странице workspace нажмите <b>+ New item</b>. <i>Зачем: staging это отдельный warehouse для сырых загруженных данных.</i>"},{"img":"26. warehouse (staging).png","act":"click","box":[80.85,17.17,16.5,15.8],"en":"Type <b>wareh</b> in the search box and click the <b>Warehouse</b> card again. <i>Why: same item type as before, only another purpose.</i>","ru":"В поиске снова введите <b>wareh</b> и нажмите на карточку <b>Warehouse</b>. <i>Зачем: тот же тип объекта, только другая роль.</i>"},{"img":"27. name stg warehouse.png","act":"type","box":[34.5,45.37,31.2,3.87],"en":"Type the staging warehouse name using the group naming style, for example <b>STG_IMSALES_2026_2027</b>. <i>Prefix STG_ marks the staging area.</i>","ru":"Введите имя staging warehouse по правилам группы, например <b>STG_IMSALES_2026_2027</b>. <i>Префикс STG_ отмечает staging-область.</i>"},{"img":"27. name stg warehouse.png","act":"click","box":[57.25,57.91,4.05,3.87],"en":"Click <b>Create</b>. <i>This creates the staging warehouse.</i>","ru":"Нажмите <b>Create</b>. <i>Так создаётся staging warehouse.</i>"},{"img":"28. new sql query.png","act":"click","box":[14.2,9.08,2.8,3.52],"en":"In the top toolbar click <b>New SQL query</b>. <i>Why: staging tables are created by a SQL script too.</i>","ru":"На верхней панели нажмите <b>New SQL query</b>. <i>Зачем: staging-таблицы тоже создаются SQL-скриптом.</i>"},{"img":"29. copy stg_imsales_2026_2027 query.png","act":"select","box":[0.5,8.22,41.6,20.03],"en":"Open the staging script <b>STG_IMSALES_2026_2027.sql</b>, select all text (<b>Ctrl+A</b>) and copy it (<b>Ctrl+C</b>). <i>Why: the script has CREATE TABLE commands for the staging tables.</i>","ru":"Откройте staging-скрипт <b>STG_IMSALES_2026_2027.sql</b>, выделите весь текст (<b>Ctrl+A</b>) и скопируйте (<b>Ctrl+C</b>). <i>Зачем: в скрипте команды CREATE TABLE для staging-таблиц.</i>"},{"img":"30. paste stg sql query.png","act":"type","box":[19.3,26.94,79.6,68.08],"en":"In Fabric click into the empty editor and paste the script (<b>Ctrl+V</b>). <i>Why: the script must be inside Fabric to run.</i>","ru":"В Fabric нажмите в пустое поле редактора и вставьте скрипт (<b>Ctrl+V</b>). <i>Зачем: скрипт должен быть в Fabric, чтобы выполниться.</i>"},{"img":"31. run stg sql query.png","act":"click","box":[19.7,19,3.9,4.06],"en":"Click <b>Run</b>. <i>Why: this creates all staging tables.</i>","ru":"Нажмите <b>Run</b>. <i>Зачем: так создаются все staging-таблицы.</i>"},{"img":"32. tables created.png","act":"look","box":[19.4,62.87,80.2,29.05],"en":"Wait for <b>Messages</b>. The status bar must say <i>Succeeded</i>. <i>Why: confirms the script ran without errors.</i>","ru":"Дождитесь <b>Messages</b>. Внизу должно быть <i>Succeeded</i>. <i>Зачем: подтверждает, что скрипт выполнился без ошибок.</i>"},{"img":"33. tables visible.png","act":"look","box":[5,21.94,18.1,32.35],"en":"Expand <b>Schemas</b>, <b>dbo</b>, <b>Tables</b>. You see the staging tables stg_dim_client, stg_dim_date, stg_dim_product, stg_dim_shipper, stg_dim_staff, stg_fact_inventory, stg_fact_sales. <i>Check: the staging tables exist, now empty.</i>","ru":"Раскройте <b>Schemas</b>, <b>dbo</b>, <b>Tables</b>. Вы увидите staging-таблицы stg_dim_client, stg_dim_date, stg_dim_product, stg_dim_shipper, stg_dim_staff, stg_fact_inventory, stg_fact_sales. <i>Проверка: staging-таблицы созданы, пока пустые.</i>"},{"img":"34. back to workspace.png","act":"click","box":[5.3,33.59,16.2,3.69],"en":"Go back to the workspace: click <b>Workspaces</b> on the left and select your workspace. <i>Why: next we build the loading logic from the lakehouse into staging.</i>","ru":"Вернитесь в workspace: нажмите <b>Workspaces</b> слева и выберите свой workspace. <i>Зачем: дальше строим загрузку из lakehouse в staging.</i>"},{"img":"35. new item in workspace.png","act":"click","box":[4.85,10.83,6.65,3.85],"en":"On the workspace page click <b>+ New item</b>. <i>Why: the data will be loaded by a <b>Dataflow Gen2</b>, a low-code tool.</i>","ru":"На странице workspace нажмите <b>+ New item</b>. <i>Зачем: данные загрузит <b>Dataflow Gen2</b>, low-code инструмент.</i>"},{"img":"36. dataflow gen2.png","act":"click","box":[46.3,17.63,16.4,15.7],"en":"In the search box type <b>dataf</b> and click the <b>Dataflow Gen2</b> card (not Gen1). <i>Why: Gen2 is the current version; Gen1 is marked Legacy.</i>","ru":"В поиске введите <b>dataf</b> и нажмите на карточку <b>Dataflow Gen2</b> (не Gen1). <i>Зачем: Gen2 актуальная версия, Gen1 помечен как Legacy.</i>"},{"img":"37. name dataflow.png","act":"type","box":[39.6,48.5,21.3,3.67],"en":"Type a name for the dataflow using the group naming style (prefix <b>DF_</b>) and click <b>Create</b>. <i>Why: the dataflow will read the CSV, clean it and write it into staging.</i>","ru":"Введите имя dataflow по правилам группы (префикс <b>DF_</b>) и нажмите <b>Create</b>. <i>Зачем: dataflow прочитает CSV, почистит его и запишет в staging.</i>"},{"img":"38. get data.png","act":"click","box":[15.7,12.93,2.9,4.8],"en":"The Power Query editor opens. In the toolbar click <b>Get data</b>. <i>Why: you must tell the dataflow where the source file is.</i>","ru":"Открылся редактор Power Query. На панели нажмите <b>Get data</b>. <i>Зачем: нужно указать dataflow, где лежит исходный файл.</i>"},{"img":"39. select lhs.png","act":"click","box":[15.25,44.47,39.35,3.67],"en":"In <b>OneLake catalog</b> choose your lakehouse <b>LH_IMSALES_SOURCES</b>. <i>Why: the source files are in the lakehouse we filled earlier.</i>","ru":"В <b>OneLake catalog</b> выберите свой lakehouse <b>LH_IMSALES_SOURCES</b>. <i>Зачем: исходные файлы лежат в lakehouse, который мы заполнили раньше.</i>"},{"img":"40. select shippers csv.png","act":"select","box":[9.9,49.59,22.2,2.76],"en":"Open <b>Files</b>, then <b>source data</b>, and tick <b>2026-2027 IMSALES Shippers.csv</b>. <i>Why: we start with one dimension, shippers, as an example.</i>","ru":"Откройте <b>Files</b>, затем <b>source data</b> и поставьте галочку у <b>2026-2027 IMSALES Shippers.csv</b>. <i>Зачем: начинаем с одного измерения, shippers, как с примера.</i>"},{"img":"41. shippers csv create.png","act":"click","box":[90,91.42,4.4,3.84],"en":"The preview shows the file. Click <b>Create</b>. <i>This loads the file into Power Query.</i>","ru":"Справа виден предпросмотр файла. Нажмите <b>Create</b>. <i>Так файл загружается в Power Query.</i>"},{"img":"42. use 1st row as headers.png","act":"click","box":[73.9,18.69,10.4,2.93],"en":"The columns are called Column1 to Column5. In <b>Home</b> open the drop-down of the table icon and click <b>Use first row as headers</b>. <i>Why: the first row holds the column names, not data.</i>","ru":"Колонки называются Column1 до Column5. На вкладке <b>Home</b> раскройте меню значка таблицы и нажмите <b>Use first row as headers</b>. <i>Зачем: в первой строке имена колонок, а не данные.</i>"},{"img":"43. add data destination.png","act":"click","box":[97.3,90.89,2.3,2.94],"en":"The headers are promoted and types are set. In the right panel, next to <b>Data destination</b>, click the plus <b>+</b> (<i>Add data destination</i>). <i>Why: tells the dataflow where to write the cleaned data.</i>","ru":"Заголовки назначены, типы заданы. В правой панели рядом с <b>Data destination</b> нажмите плюс <b>+</b> (<i>Add data destination</i>). <i>Зачем: указываем dataflow, куда записать очищенные данные.</i>"},{"img":"44. select warehouse.png","act":"click","box":[87,80.89,11.1,2.63],"en":"In the menu choose <b>Warehouse</b>. <i>Why: the staging area is a warehouse.</i>","ru":"В меню выберите <b>Warehouse</b>. <i>Зачем: staging-область это warehouse.</i>"},{"img":"45. warehouse none.png","act":"select","box":[25.6,37.82,21.4,2.95],"en":"In <b>Connection</b> choose the existing connection <b>Warehouse ... (none)</b>. <i>Why: the dataflow needs a connection to reach the warehouse.</i>","ru":"В поле <b>Connection</b> выберите существующее подключение <b>Warehouse ... (none)</b>. <i>Зачем: dataflow нужно подключение, чтобы добраться до warehouse.</i>"},{"img":"45. warehouse none.png","act":"click","box":[90.3,89.65,3.8,3.69],"en":"Click <b>Next</b>.","ru":"Нажмите <b>Next</b>."},{"img":"46. exist table stg whs shipper.png","act":"select","box":[18.4,25.12,6.8,2.4],"en":"Select <b>Existing table</b>. <i>Why: the staging tables were already created by our SQL script.</i>","ru":"Выберите <b>Existing table</b>. <i>Зачем: staging-таблицы уже созданы нашим SQL-скриптом.</i>"},{"img":"46. exist table stg whs shipper.png","act":"select","box":[11.4,44.88,20.1,41.37],"en":"Expand <b>STG_IMSALES_2026_2027</b>, then <b>dbo</b>, and select the table <b>stg_dim_shipper</b>. <i>Why: shippers data must land in the matching staging table.</i>","ru":"Раскройте <b>STG_IMSALES_2026_2027</b>, затем <b>dbo</b> и выберите таблицу <b>stg_dim_shipper</b>. <i>Зачем: данные shippers должны попасть в соответствующую staging-таблицу.</i>"},{"img":"47. shipper tbl click next.png","act":"click","box":[90.3,89.55,3.8,3.68],"en":"On the right you see the columns of the empty table. Click <b>Next</b>. <i>Check: the chosen table is the right one.</i>","ru":"Справа видны колонки пустой таблицы. Нажмите <b>Next</b>. <i>Проверка: выбрана именно та таблица.</i>"},{"img":"48. shipper source.png","act":"look","box":[11.2,45.86,38.8,18.34],"en":"Check the update method <b>Replace</b> and the <b>Column mapping</b>: each source column must match its destination column. <i>Why: Replace clears the table before each load, so rerunning does not duplicate rows.</i> <i>Append vs Replace: inside the pipeline both work identically because the SQL scripts clear all stg_* tables beforehand. Use <b>Append</b> to keep the table schema untouched (avoid running the dataflow standalone twice without clearing), or <b>Replace</b> when testing a dataflow manually so it overwrites old rows without duplicates.</i>","ru":"Проверьте метод обновления <b>Replace</b> и <b>Column mapping</b>: каждая колонка источника должна соответствовать колонке назначения. <i>Зачем: Replace очищает таблицу перед каждой загрузкой, поэтому повторный запуск не плодит дубли.</i> <i>Append или Replace: внутри пайплайна оба варианта работают одинаково, так как SQL-скрипты в начале заранее очищают таблицы stg_*. Используйте <b>Append</b>, чтобы не трогать структуру таблицы (но не запускайте dataflow вручную дважды без очистки), или <b>Replace</b> при ручном тестовом запуске dataflow, чтобы старые строки перезаписывались без дублей.</i>"},{"img":"48. shipper source.png","act":"click","box":[87.5,89.43,6.7,3.76],"en":"Click <b>Save settings</b>.","ru":"Нажмите <b>Save settings</b>."},{"img":"49. shipper saved.png","act":"click","box":[5.3,13.91,2.6,2.93],"en":"The panel <b>Data destination</b> now shows <b>Warehouse</b>. In the top left open the arrow next to the save icon. <i>Why: the destination is set, now save and run the dataflow.</i>","ru":"В панели <b>Data destination</b> теперь указан <b>Warehouse</b>. В левом верхнем углу раскройте стрелку рядом со значком сохранения. <i>Зачем: назначение задано, теперь сохраняем и запускаем dataflow.</i>"},{"img":"50. save and run.png","act":"click","box":[5.1,25.16,8.3,2.57],"en":"Click <b>Save, run &amp; close</b>. <i>Why: this saves the dataflow and loads the shippers into staging at once.</i>","ru":"Нажмите <b>Save, run &amp; close</b>. <i>Зачем: так dataflow сохраняется и сразу загружает shippers в staging.</i>"},{"img":"51. new item.png","act":"click","box":[4.85,10.65,6.65,3.67],"en":"Now build the pipeline that runs everything in order. On the workspace page click <b>+ New item</b>. At this point your workspace already contains the dataflow from the previous part. <i>Why: a pipeline orchestrates steps: clean tables, run dataflows, copy data.</i>","ru":"Теперь собираем pipeline, который запускает всё по порядку. На странице workspace нажмите <b>+ New item</b>. В вашем workspace уже есть dataflow из предыдущей части. <i>Зачем: pipeline управляет порядком шагов: очистка таблиц, запуск dataflow, копирование данных.</i>"},{"img":"52. pipeline.png","act":"click","box":[64.45,20.08,7.4,14.09],"en":"In <b>Recents</b> click the <b>Pipeline</b> card (or search for it). <i>This starts creating a pipeline.</i>","ru":"В разделе <b>Recents</b> нажмите на карточку <b>Pipeline</b> (или найдите её поиском). <i>Так начинается создание pipeline.</i>"},{"img":"53. name pipeline.png","act":"type","box":[34.6,46.07,31.1,3.5],"en":"Type the name using the group naming style (prefix <b>PL_</b>), for example <b>PL_IMSALES_LOAD_STG</b>, and click <b>Create</b>. <i>Why: the name shows that this pipeline loads the staging area.</i>","ru":"Введите имя по правилам группы (префикс <b>PL_</b>), например <b>PL_IMSALES_LOAD_STG</b>, и нажмите <b>Create</b>. <i>Зачем: имя показывает, что pipeline загружает staging-область.</i>"},{"img":"54. etl creation screen.png","act":"look","box":[26.3,46.96,12,22.38],"en":"The pipeline editor opens with an empty canvas. We start from a blank canvas, so we add activities from the toolbar. <i>Why: we control the order of steps ourselves.</i>","ru":"Открылся редактор pipeline с пустым холстом. Начинаем с пустого холста и добавляем активности с панели. <i>Зачем: порядок шагов задаём сами.</i>"},{"img":"55. activity.png","act":"click","box":[8.8,5.33,3.6,3.67],"en":"Open the <b>Activities</b> tab in the top menu. <i>Why: all activity types are listed here.</i>","ru":"Откройте вкладку <b>Activities</b> в верхнем меню. <i>Зачем: здесь собраны все типы активностей.</i>"},{"img":"56. script select.png","act":"click","box":[38.6,9.23,4.3,3.69],"en":"Click <b>Script</b>. A <b>Script1</b> activity appears on the canvas. <i>Why: a Script activity runs SQL, we use it to clean the staging tables before loading.</i>","ru":"Нажмите <b>Script</b>. На холсте появится активность <b>Script1</b>. <i>Зачем: Script выполняет SQL, мы чистим им staging-таблицы перед загрузкой.</i>"},{"img":"57. 3 scripts.png","act":"look","box":[9.5,25.44,29,22.49],"en":"Add two more <b>Script</b> activities the same way. You now have three: Script1, Script2, Script3. Click the first one, <b>Script1</b>. <i>Why: one script per group of tables: sales, inventory, dimensions.</i>","ru":"Добавьте ещё две активности <b>Script</b> тем же способом. Теперь их три: Script1, Script2, Script3. Нажмите на первую, <b>Script1</b>. <i>Зачем: по одному скрипту на группу таблиц: продажи, склад, измерения.</i>"},{"img":"58. 1st script name.png","act":"type","box":[17.7,65.24,15.6,2.76],"en":"On the <b>General</b> tab type a clear name in <b>Name</b>, for example <b>SQL clear sales facts in stg</b>. <i>Why: the name tells what the step does without opening it.</i>","ru":"На вкладке <b>General</b> введите понятное имя в поле <b>Name</b>, например <b>SQL clear sales facts in stg</b>. <i>Зачем: имя объясняет, что делает шаг, не открывая его.</i>"},{"img":"58. 1st script name.png","act":"click","box":[9.4,59.89,3.2,2.76],"en":"Open the <b>Settings</b> tab. <i>Why: the connection and the SQL text are set here.</i>","ru":"Откройте вкладку <b>Settings</b>. <i>Зачем: здесь задаются подключение и текст SQL.</i>"},{"img":"59. choose connection.png","act":"click","box":[17.7,82.08,15.4,3.32],"en":"Open the <b>Connection</b> list and click <b>Browse all</b>. <i>Why: the script must run on the staging warehouse, which is not in the short list.</i>","ru":"Откройте список <b>Connection</b> и нажмите <b>Browse all</b>. <i>Зачем: скрипт должен выполняться на staging warehouse, которого нет в коротком списке.</i>"},{"img":"60. choose stg wrhs.png","act":"select","box":[16.7,57.94,69.3,4.78],"en":"In <b>OneLake catalog</b> choose the warehouse <b>STG_IMSALES_2026_2027</b> from your workspace. <i>Why: we clear the staging tables, so the connection must point to staging, not to DW.</i>","ru":"В <b>OneLake catalog</b> выберите warehouse <b>STG_IMSALES_2026_2027</b> из вашего workspace. <i>Зачем: мы чистим staging-таблицы, поэтому подключение должно вести в staging, а не в DW.</i>"},{"img":"61. choose edit.png","act":"click","box":[41.7,77.13,1.6,2.97],"en":"The connection is set. Under <b>Script</b> keep <b>Query</b> and click the pencil <b>Edit in code editor</b>. <i>Why: a large editor is more convenient for SQL than a small field.</i>","ru":"Подключение выбрано. В разделе <b>Script</b> оставьте <b>Query</b> и нажмите на карандаш <b>Edit in code editor</b>. <i>Зачем: в большом редакторе удобнее писать SQL, чем в маленьком поле.</i>"},{"img":"62. clean table sales script and click ok.png","act":"type","box":[4.8,12.76,45.2,4.81],"en":"Type the command <b>TRUNCATE TABLE stg_fact_sales;</b> and click <b>OK</b>. <i>Why: TRUNCATE empties the table, so a repeated load does not duplicate rows. Keep only this one line.</i>","ru":"Введите команду <b>TRUNCATE TABLE stg_fact_sales;</b> и нажмите <b>OK</b>. <i>Зачем: TRUNCATE очищает таблицу, чтобы повторная загрузка не дублировала строки. Оставьте только эту строку.</i>","code":"TRUNCATE TABLE stg_fact_sales;"},{"img":"63. 2nd script name.png","act":"type","box":[17.9,65.57,15.6,2.76],"en":"Select <b>Script2</b> and on <b>General</b> name it <b>SQL clear inventory facts in stg</b>. Then open <b>Settings</b>. <i>Why: the second script clears the inventory fact table.</i>","ru":"Выберите <b>Script2</b> и на вкладке <b>General</b> назовите его <b>SQL clear inventory facts in stg</b>. Затем откройте <b>Settings</b>. <i>Зачем: второй скрипт чистит таблицу фактов склада.</i>"},{"img":"64. select browse all.png","act":"click","box":[17.9,82.17,15.4,3.13],"en":"Open the <b>Connection</b> list and click <b>Browse all</b>. <i>Same as for the first script: we need the staging warehouse.</i>","ru":"Откройте список <b>Connection</b> и нажмите <b>Browse all</b>. <i>Как и для первого скрипта: нужен staging warehouse.</i>"},{"img":"65. select stg whspng.png","act":"select","box":[16.6,53.04,69.4,4.64],"en":"Choose the warehouse <b>STG_IMSALES_2026_2027</b> from your workspace. <i>Check: the location is your workspace, not another one with the same name.</i>","ru":"Выберите warehouse <b>STG_IMSALES_2026_2027</b> из вашего workspace. <i>Проверка: расположение это ваш workspace, а не другой с таким же именем.</i>"},{"img":"66. click edit.png","act":"click","box":[41.8,77.31,1.6,2.97],"en":"Click the pencil <b>Edit in code editor</b> under <b>Script</b>. <i>Why: we type the SQL command in the big editor.</i>","ru":"Нажмите на карандаш <b>Edit in code editor</b> в разделе <b>Script</b>. <i>Зачем: SQL-команду вводим в большом редакторе.</i>"},{"img":"67. clean inventory table and ok.png","act":"type","box":[4.8,12.39,45.2,4.81],"en":"Type <b>TRUNCATE TABLE stg_fact_inventory;</b> and click <b>OK</b>. <i>Why: empties the inventory staging table before each load. Keep only this one line.</i>","ru":"Введите <b>TRUNCATE TABLE stg_fact_inventory;</b> и нажмите <b>OK</b>. <i>Зачем: очищает staging-таблицу склада перед каждой загрузкой. Оставьте только эту строку.</i>","code":"TRUNCATE TABLE stg_fact_inventory;"},{"img":"68. 3rd script name.png","act":"type","box":[17.8,65.48,15.6,2.78],"en":"Select <b>Script3</b> and on <b>General</b> name it <b>SQL clear dimensions facts in stg</b>. <i>Why: the third script clears all dimension tables.</i>","ru":"Выберите <b>Script3</b> и на вкладке <b>General</b> назовите его <b>SQL clear dimensions facts in stg</b>. <i>Зачем: третий скрипт чистит все таблицы измерений.</i>"},{"img":"69. connect - browse all.png","act":"click","box":[18,78.56,15.3,3.33],"en":"Select <b>Script3</b>, open <b>Settings</b>, open the <b>Connection</b> list and click <b>Browse all</b>. <i>Same as before: the third script also runs on staging.</i>","ru":"Выберите <b>Script3</b>, откройте <b>Settings</b>, раскройте список <b>Connection</b> и нажмите <b>Browse all</b>. <i>Как и раньше: третий скрипт тоже выполняется на staging.</i>"},{"img":"70. choose stg whs.png","act":"select","box":[16.7,52.9,69.4,4.79],"en":"Choose the warehouse <b>STG_IMSALES_2026_2027</b> from your workspace. <i>Check: the location is your workspace.</i>","ru":"Выберите warehouse <b>STG_IMSALES_2026_2027</b> из вашего workspace. <i>Проверка: расположение это ваш workspace.</i>"},{"img":"71. select edit.png","act":"click","box":[41.8,77.32,1.6,2.94],"en":"Click the pencil <b>Edit in code editor</b>. <i>Why: the dimension tables are cleared by several commands, the big editor fits them.</i>","ru":"Нажмите на карандаш <b>Edit in code editor</b>. <i>Зачем: измерения чистятся несколькими командами, для них нужен большой редактор.</i>"},{"img":"72. clean dim tables.png","act":"type","box":[4.8,12.02,30.2,10.73],"en":"Type five commands, one per dimension table: <b>DELETE FROM stg_dim_client;</b>, <b>stg_dim_product</b>, <b>stg_dim_date</b>, <b>stg_dim_shipper</b>, <b>stg_dim_staff</b>. Click <b>OK</b>. <i>Why: the dimension tables are emptied before they are loaded again. Keep only these five lines.</i>","ru":"Введите пять команд, по одной на таблицу измерений: <b>DELETE FROM stg_dim_client;</b>, <b>stg_dim_product</b>, <b>stg_dim_date</b>, <b>stg_dim_shipper</b>, <b>stg_dim_staff</b>. Нажмите <b>OK</b>. <i>Зачем: таблицы измерений очищаются перед новой загрузкой. Оставьте только эти пять строк.</i>","code":"DELETE FROM stg_dim_client;\nDELETE FROM stg_dim_product;\nDELETE FROM stg_dim_date;\nDELETE FROM stg_dim_shipper;\nDELETE FROM stg_dim_staff;"},{"img":"73. wait.png","act":"click","box":[84.5,8.8,5,3.48],"en":"All three scripts are ready. Open the <b>...</b> menu in the toolbar and click <b>Wait</b>. <i>Why: the Wait activity is a meeting point. The next step starts only when all three cleaning scripts have finished.</i>","ru":"Все три скрипта готовы. Откройте меню <b>...</b> на панели и нажмите <b>Wait</b>. <i>Зачем: Wait это точка встречи. Следующий шаг стартует, только когда завершатся все три скрипта очистки.</i>"},{"img":"74. connect on success.png","act":"drag","box":[20.2,29.24,29.8,3.15],"en":"Name it <b>Wait for cleaning</b> on <b>General</b>. Then drag from the green check mark on the right edge of each Script to the Wait box, all three. <i>Why: the green check mark means on success. Wait begins only if all three scripts succeeded.</i>","ru":"Назовите его <b>Wait for cleaning</b> на вкладке <b>General</b>. Затем потяните от зелёной галочки на правом краю каждого Script к блоку Wait, все три. <i>Зачем: зелёная галочка значит on success. Wait запустится, только если все три скрипта прошли успешно.</i>"},{"img":"75. copy data activity.png","act":"click","box":[4.8,21.32,11,2.57],"en":"In <b>Activities</b> open the <b>Copy data</b> menu and click <b>Add copy data activity</b>. <i>Why: a Copy data activity moves a CSV file from the lakehouse into a staging table.</i>","ru":"На вкладке <b>Activities</b> раскройте меню <b>Copy data</b> и нажмите <b>Add copy data activity</b>. <i>Зачем: Copy data переносит CSV-файл из lakehouse в staging-таблицу.</i>"},{"img":"76. name copy data.png","act":"type","box":[17.8,65.47,15.6,2.81],"en":"On <b>General</b> give the activity a clear name, for example <b>CD Client - load stg dim client</b>. Then open <b>Source</b>. <i>Why: the name says which table it loads. There will be one Copy data per file.</i>","ru":"На вкладке <b>General</b> дайте активности понятное имя, например <b>CD Client - load stg dim client</b>. Затем откройте <b>Source</b>. <i>Зачем: имя говорит, какую таблицу грузим. На каждый файл будет свой Copy data.</i>"},{"img":"77. source connect browse.png","act":"click","box":[17.9,78.81,15.4,3.13],"en":"On <b>Source</b> open the <b>Connection</b> list and click <b>Browse all</b>. <i>Why: the source is the lakehouse with our CSV files.</i>","ru":"На вкладке <b>Source</b> раскройте список <b>Connection</b> и нажмите <b>Browse all</b>. <i>Зачем: источник это lakehouse с нашими CSV-файлами.</i>"},{"img":"78. LH connect.png","act":"select","box":[16.8,68.09,69.1,4.44],"en":"Choose the lakehouse <b>LH_IMSALES_SOURCES</b> from your workspace. <i>Check: the location is your workspace.</i>","ru":"Выберите lakehouse <b>LH_IMSALES_SOURCES</b> из вашего workspace. <i>Проверка: расположение это ваш workspace.</i>"},{"img":"79. choose files, click browse.png","act":"click","box":[50.5,78.06,4.5,2.75],"en":"Set <b>Root folder</b> to <b>Files</b> and click <b>Browse</b> next to <b>File path</b>. <i>Why: our CSV files are stored as files, not as tables.</i>","ru":"В <b>Root folder</b> выберите <b>Files</b> и нажмите <b>Browse</b> рядом с <b>File path</b>. <i>Зачем: наши CSV хранятся как файлы, а не как таблицы.</i>"},{"img":"80. dbl click src data.png","act":"click","box":[64.8,20.37,5.8,2.75],"en":"In the <b>Browse</b> panel double click the folder <b>source data</b>. <i>Why: this is the folder we uploaded in the beginning.</i>","ru":"В панели <b>Browse</b> дважды нажмите на папку <b>source data</b>. <i>Зачем: это папка, которую мы загрузили в самом начале.</i>"},{"img":"81. choose client csv.png","act":"select","box":[64.6,20.41,34.4,2.94],"en":"Select the file <b>2026-2027 IMSALES Clients.csv</b> and click <b>OK</b>. <i>Why: this file feeds the client dimension. The list shows all 14 uploaded files.</i>","ru":"Выберите файл <b>2026-2027 IMSALES Clients.csv</b> и нажмите <b>OK</b>. <i>Зачем: этот файл наполняет измерение клиентов. В списке все 14 загруженных файлов.</i>"},{"img":"82. delimited text.png","act":"select","box":[17.7,86.77,15.6,2.79],"en":"The folder and file name are filled in. Open the <b>File format</b> list and choose <b>DelimitedText</b>. <i>Why: a CSV is a delimited text file. Binary would copy the file without reading columns.</i>","ru":"Папка и имя файла заполнены. Откройте список <b>File format</b> и выберите <b>DelimitedText</b>. <i>Зачем: CSV это текст с разделителями. Binary скопировал бы файл, не читая колонки.</i>"},{"img":"83. format settings comma header.png","act":"click","box":[34.2,86.07,4.5,2.78],"en":"Click <b>Settings</b> next to <b>File format</b>. Check <b>Column delimiter</b> is <b>Comma</b> and <b>First row as header</b> is ticked. Click <b>OK</b>. <i>Why: the first row of our CSV holds the column names, not data.</i>","ru":"Нажмите <b>Settings</b> рядом с <b>File format</b>. Проверьте, что <b>Column delimiter</b> это <b>Comma</b> и стоит галочка <b>First row as header</b>. Нажмите <b>OK</b>. <i>Зачем: в первой строке нашего CSV имена колонок, а не данные.</i>"},{"img":"84. destination connection browse.png","act":"click","box":[17.9,79.37,15.3,2.97],"en":"Open the <b>Destination</b> tab, open the <b>Connection</b> list and click <b>Browse all</b>. <i>Why: the destination is the staging warehouse.</i>","ru":"Откройте вкладку <b>Destination</b>, раскройте список <b>Connection</b> и нажмите <b>Browse all</b>. <i>Зачем: назначение это staging warehouse.</i>"},{"img":"85. choose stg whs.png","act":"select","box":[16.8,64.8,69.3,4.64],"en":"Choose the warehouse <b>STG_IMSALES_2026_2027</b> from your workspace. <i>Check: the location is your workspace.</i>","ru":"Выберите warehouse <b>STG_IMSALES_2026_2027</b> из вашего workspace. <i>Проверка: расположение это ваш workspace.</i>"},{"img":"86. table dim client.png","act":"select","box":[17.9,80.51,15.1,2.94],"en":"Keep <b>Use existing</b>, open the <b>Table</b> list and choose <b>dbo.stg_dim_client</b>. <i>Why: the staging table was already created by our SQL script.</i>","ru":"Оставьте <b>Use existing</b>, раскройте список <b>Table</b> и выберите <b>dbo.stg_dim_client</b>. <i>Зачем: staging-таблица уже создана нашим SQL-скриптом.</i>"},{"img":"87. connect wait with copy data.png","act":"drag","box":[60.2,31.48,8.3,2.58],"en":"Drag from the green check mark of <b>Wait for cleaning</b> to the Copy data box. <i>Why: the copy starts only after all tables have been cleaned.</i>","ru":"Потяните от зелёной галочки <b>Wait for cleaning</b> к блоку Copy data. <i>Зачем: копирование начинается только после очистки всех таблиц.</i>"},{"img":"88. add dataflow.png","act":"click","box":[12.2,9.27,5.3,2.96],"en":"Next add the dataflow to the pipeline. On the <b>Activities</b> tab click <b>Dataflow</b>. <i>Why: the pipeline will run the dataflow we built earlier, so everything loads in one run.</i>","ru":"Теперь добавим dataflow в pipeline. На вкладке <b>Activities</b> нажмите <b>Dataflow</b>. <i>Зачем: pipeline запустит ранее созданный dataflow, и всё загрузится одним запуском.</i>"},{"img":"89. dataflow name.png","act":"type","box":[17.8,65.55,15.6,2.78],"en":"On <b>General</b> give the activity a clear name, for example <b>DF Load DIM Shipper</b>. Then open <b>Settings</b>. <i>Why: the name says what the activity loads.</i>","ru":"На вкладке <b>General</b> дайте активности понятное имя, например <b>DF Load DIM Shipper</b>. Затем откройте <b>Settings</b>. <i>Зачем: имя говорит, что грузит активность.</i>"},{"img":"90. settings shipper stg.png","act":"select","box":[17.9,69.79,15.5,2.78],"en":"In <b>Settings</b> keep your <b>Workspace</b>, open the <b>Dataflow</b> list and choose the dataflow you created (<b>DF LOAD DIM SHIPPER STG</b>). <i>Why: this links the activity to the real dataflow. If the list is empty press <b>Refresh</b>.</i>","ru":"В <b>Settings</b> оставьте свой <b>Workspace</b>, раскройте список <b>Dataflow</b> и выберите созданный dataflow (<b>DF LOAD DIM SHIPPER STG</b>). <i>Зачем: так активность связывается с настоящим dataflow. Если список пуст, нажмите <b>Refresh</b>.</i>"},{"img":"91. connect wait to df.png","act":"drag","box":[60.1,31.73,8.7,19.56],"en":"Drag from the green check mark of <b>Wait for cleaning</b> to the Dataflow box, so both Copy data and Dataflow start after cleaning. <i>Why: the two loads run in parallel after the tables are cleaned.</i>","ru":"Потяните от зелёной галочки <b>Wait for cleaning</b> к блоку Dataflow, чтобы и Copy data, и Dataflow стартовали после очистки. <i>Зачем: две загрузки идут параллельно после очистки таблиц.</i>"},{"img":"92. save ppl.png","act":"click","box":[4.9,9.55,1.6,3.12],"en":"Click <b>Save</b> in the top left corner. <i>Why: unsaved changes are lost when you close the pipeline.</i>","ru":"Нажмите <b>Save</b> в левом верхнем углу. <i>Зачем: несохранённые изменения теряются при закрытии pipeline.</i>"},{"img":"93. new folder sources.png","act":"type","box":[34.5,47.95,31.1,3.14],"en":"Back on the workspace page click <b>New folder</b>, type <b>01 Sources</b> and click <b>Create</b>. <i>Why: folders keep the workspace tidy. Numbers show the order of the layers.</i>","ru":"На странице workspace нажмите <b>New folder</b>, введите <b>01 Sources</b> и нажмите <b>Create</b>. <i>Зачем: папки наводят порядок в workspace. Номера показывают порядок слоёв.</i>"},{"img":"94. move to.png","act":"click","box":[27.3,47.75,11.7,3.86],"en":"Hover over the lakehouse row, click the three dots <b>...</b> and choose <b>Move to</b>. <i>Why: we sort the items into folders by layer.</i>","ru":"Наведите курсор на строку lakehouse, нажмите три точки <b>...</b> и выберите <b>Move to</b>. <i>Зачем: раскладываем объекты по папкам по слоям.</i>"},{"img":"95. sources.png","act":"click","box":[28.2,36.74,4.5,2.39],"en":"In the <b>Move 2 items</b> dialog (the lakehouse and its SQL endpoint) open the folder <b>01 Sources</b> and click <b>Move here</b>. <i>Why: the lakehouse is the source layer.</i>","ru":"В окне <b>Move 2 items</b> (lakehouse и его SQL endpoint) откройте папку <b>01 Sources</b> и нажмите <b>Move here</b>. <i>Зачем: lakehouse это слой источников.</i>"},{"img":"96. new folder stg.png","act":"type","box":[34.4,47.81,31.1,3.13],"en":"Create the second folder: click <b>New folder</b>, type <b>02 Staging Area</b> and click <b>Create</b>. <i>Why: this folder will hold everything that belongs to staging.</i>","ru":"Создайте вторую папку: нажмите <b>New folder</b>, введите <b>02 Staging Area</b> и нажмите <b>Create</b>. <i>Зачем: в этой папке будет всё, что относится к staging.</i>"},{"img":"97. move to.png","act":"click","box":[27.2,54.29,12.9,2.76],"en":"Tick the staging items (the dataflow, the pipeline and the <b>STG</b> warehouse), click the three dots <b>...</b> on one of them and choose <b>Move to</b>. <i>Why: all three items work together to load the staging area.</i>","ru":"Отметьте staging-объекты (dataflow, pipeline и warehouse <b>STG</b>), нажмите три точки <b>...</b> на одном из них и выберите <b>Move to</b>. <i>Зачем: все три объекта работают вместе и загружают staging-область.</i>"},{"img":"98. to staging.png","act":"click","box":[28,41.55,6.2,2.56],"en":"In the dialog click the folder <b>02 Staging Area</b>. <i>This opens the target folder.</i>","ru":"В окне нажмите на папку <b>02 Staging Area</b>. <i>Так открывается папка назначения.</i>"},{"img":"99. move here.png","act":"click","box":[64.3,75.26,5.5,3.53],"en":"The folder is empty. Click <b>Move here</b>. <i>This moves the selected items into the folder.</i>","ru":"Папка пуста. Нажмите <b>Move here</b>. <i>Так выбранные объекты переносятся в папку.</i>"},{"img":"100. move selected.png","act":"click","box":[11.9,10.32,5.4,3.69],"en":"Tick the dataflow and the pipeline, then click <b>Move</b> in the toolbar. <i>Why: they belong to the staging layer, the same as the STG warehouse.</i>","ru":"Отметьте dataflow и pipeline, затем нажмите <b>Move</b> на панели. <i>Зачем: они относятся к staging-слою, как и warehouse STG.</i>"},{"img":"101. to stg.png","act":"click","box":[28.2,41.58,6.1,2.4],"en":"In the dialog click the folder <b>02 Staging Area</b>. <i>This opens the target folder.</i>","ru":"В окне нажмите на папку <b>02 Staging Area</b>. <i>Так открывается папка назначения.</i>"},{"img":"102. move here.png","act":"click","box":[64.2,74.84,5.4,3.49],"en":"The folder already holds the STG warehouse. Click <b>Move here</b>. <i>Now all staging items are in one folder.</i>","ru":"В папке уже лежит warehouse STG. Нажмите <b>Move here</b>. <i>Теперь все staging-объекты в одной папке.</i>"},{"img":"103. new folder dw.png","act":"type","box":[34.5,48.31,31.1,3.31],"en":"Create the third folder: click <b>New folder</b>, type <b>03 Data Warehouse</b> and click <b>Create</b>. <i>Why: the final warehouse is the third layer.</i>","ru":"Создайте третью папку: нажмите <b>New folder</b>, введите <b>03 Data Warehouse</b> и нажмите <b>Create</b>. <i>Зачем: итоговое хранилище это третий слой.</i>"},{"img":"104. move to.png","act":"click","box":[11.8,10.7,5.3,3.32],"en":"Tick the <b>DW</b> warehouse and click <b>Move</b> in the toolbar. <i>Why: the DW warehouse is the last item left outside the folders.</i>","ru":"Отметьте warehouse <b>DW</b> и нажмите <b>Move</b> на панели. <i>Зачем: warehouse DW последний объект вне папок.</i>"},{"img":"105. to dw.png","act":"click","box":[28.4,46.27,7.4,2.79],"en":"In the dialog click the folder <b>03 Data Warehouse</b>, then click <b>Move here</b>. <i>Result: three folders, one per layer. The workspace is organised.</i>","ru":"В окне нажмите на папку <b>03 Data Warehouse</b>, затем нажмите <b>Move here</b>. <i>Итог: три папки, по одной на слой. Workspace приведён в порядок.</i>"},{"img":"110. new item.png","act":"click","box":[4.9,10.6,6.7,3.7],"en":"Next we build the Product dimension dataflow. On the workspace page click <b>+ New item</b>. <i>Why: a Dataflow Gen2 will combine the three product-related CSVs into one staging table.</i>","ru":"Дальше собираем dataflow для измерения Product. На странице workspace нажмите <b>+ New item</b>. <i>Зачем: Dataflow Gen2 объединит три CSV по товарам в одну staging-таблицу.</i>"},{"img":"111. dataflowgen2.png","act":"click","box":[46.1,20.9,7.7,13.9],"en":"Click the <b>Dataflow Gen2</b> card. <i>Why: Dataflow Gen2 gives us Power Query to merge tables and load them into the staging warehouse.</i>","ru":"Нажмите на карточку <b>Dataflow Gen2</b>. <i>Зачем: Dataflow Gen2 даёт редактор Power Query для объединения таблиц и записи в staging warehouse.</i>"},{"img":"112. name dataflow.png","act":"type","box":[39.3,48.3,21.4,4.1],"en":"Type the name <b>DF LOAD DIM PRODUCT STG</b> and click <b>Create</b>. <i>Why: the name follows the group convention and clearly states which staging table it loads.</i>","ru":"Введите имя <b>DF LOAD DIM PRODUCT STG</b> и нажмите <b>Create</b>. <i>Зачем: имя следует правилам группы и сразу показывает, какую staging-таблицу грузит dataflow.</i>"},{"img":"113. get data.png","act":"click","box":[44.6,66.2,15.3,3],"en":"In Power Query click <b>Get data from another source</b>. <i>Why: our source CSVs live in the lakehouse, not in a local file.</i>","ru":"В Power Query нажмите <b>Get data from another source</b>. <i>Зачем: наши исходные CSV лежат в lakehouse, а не в локальном файле.</i>"},{"img":"114. lh sources.png","act":"click","box":[15.2,63,39.5,4],"en":"In <b>OneLake catalog</b> select your lakehouse <b>LH_IMSALES_SOURCES</b>. <i>Check: make sure the Location column shows your workspace.</i>","ru":"В <b>OneLake catalog</b> выберите ваш lakehouse <b>LH_IMSALES_SOURCES</b>. <i>Проверка: в столбце Location должен быть указан ваш workspace.</i>"},{"img":"115. select tables.png","act":"select","box":[12.2,41.8,19,21],"en":"Expand <b>Files &rarr; source data</b> and tick all three product files: <b>2026-2027 IMSALES Products.csv</b>, <b>ProductTypes.csv</b>, and <b>Suppliers.csv</b>. <i>Why: the product dimension combines product details, type names, and supplier info.</i>","ru":"Раскройте <b>Files &rarr; source data</b> и отметьте три файла: <b>2026-2027 IMSALES Products.csv</b>, <b>ProductTypes.csv</b> и <b>Suppliers.csv</b>. <i>Зачем: измерение товаров объединяет сами товары, их категории и поставщиков.</i>"},{"img":"115. select tables.png","act":"click","box":[89.6,91.3,4.6,3.9],"en":"Click <b>Create</b>. <i>This loads all three CSVs as separate queries into Power Query.</i>","ru":"Нажмите <b>Create</b>. <i>Так все три CSV загрузятся в Power Query как отдельные запросы.</i>"},{"img":"116. transform product types.png","act":"click","box":[11.2,13.7,12.3,4.2],"en":"Select the <b>ProductTypes</b> query on the left. On the <b>Transform</b> tab click <b>Use first row as headers</b>. <i>Why: the first row holds column names (ProductTypeID, ProductTypeName), not data.</i>","ru":"Выберите запрос <b>ProductTypes</b> слева. На вкладке <b>Transform</b> нажмите <b>Use first row as headers</b>. <i>Зачем: в первой строке лежат названия колонок (ProductTypeID, ProductTypeName), а не данные.</i>"},{"img":"117. transform products (header).png","act":"click","box":[11.4,18.2,11.1,3],"en":"Switch to <b>2026-2027 IMSALES Products csv</b> and click <b>Use first row as headers</b> as well. <i>Why: every CSV needs proper column headers before we can merge them by ID.</i>","ru":"Переключитесь на <b>2026-2027 IMSALES Products csv</b> и тоже нажмите <b>Use first row as headers</b>. <i>Зачем: каждому CSV нужны корректные заголовки, чтобы потом объединить их по ID.</i>"},{"img":"118. transform sales (header).png","act":"click","box":[11.4,18.2,11.1,3],"en":"Switch to <b>2026-2027 IMSALES Suppliers csv</b> and click <b>Use first row as headers</b>. <i>Why: now all three tables have clean headers and auto-detected types.</i>","ru":"Переключитесь на <b>2026-2027 IMSALES Suppliers csv</b> и нажмите <b>Use first row as headers</b>. <i>Зачем: теперь у всех трёх таблиц правильные заголовки и типы данных.</i>"},{"img":"119. combine (merge queries).png","act":"click","box":[44.5,23,12,4.8],"en":"Select <b>2026-2027 IMSALES Products csv</b> (our main table). Find and click <b>Merge queries</b> (Home &rarr; Combine or via Search). <i>Why: we will enrich Products with columns from ProductTypes and Suppliers.</i>","ru":"Выберите <b>2026-2027 IMSALES Products csv</b> (основную таблицу). Найдите и нажмите <b>Merge queries</b> (Home &rarr; Combine или через поиск). <i>Зачем: мы добавим к товарам названия типов и поставщиков.</i>"},{"img":"120. product type product.png","act":"select","box":[34,49.5,18,3.5],"en":"In the <b>Merge</b> dialog click the <b>ProductTypeID</b> column in the top table, then select <b>2026-2027 IMSALES ProductTypes csv</b> as the right table. <i>Why: ProductTypeID is the matching key between products and product types.</i>","ru":"В окне <b>Merge</b> выделите столбец <b>ProductTypeID</b> в верхней таблице, затем выберите <b>2026-2027 IMSALES ProductTypes csv</b> в списке правой таблицы. <i>Зачем: ProductTypeID это ключ связи между товарами и типами товаров.</i>"},{"img":"121. prod type id outer.png","act":"click","box":[61.5,86,3.5,3.8],"en":"Select <b>ProductTypeID</b> in the bottom table, keep Join kind as <b>Left outer</b> (all 77 rows match), and click <b>OK</b>. <i>Why: Left outer keeps every product even if a category were missing.</i>","ru":"Выделите <b>ProductTypeID</b> в нижней таблице, оставьте тип соединения <b>Left outer</b> (совпадают все 77 строк) и нажмите <b>OK</b>. <i>Зачем: Left outer гарантирует, что ни один товар не потеряется.</i>"},{"img":"122. double arrow column.png","act":"click","box":[80.5,23,1.8,3],"en":"A new column with <i>[Table]</i> values appears on the right. Click the <b>expand (double-arrow)</b> icon in its header. <i>Why: we need to pick which columns from ProductTypes to bring into Products.</i>","ru":"Справа появился новый столбец со значениями <i>[Table]</i>. Нажмите на иконку <b>разворота (двойная стрелка)</b> в его заголовке. <i>Зачем: нужно выбрать, какие именно колонки из ProductTypes перенести в таблицу товаров.</i>"},{"img":"123. select product name.png","act":"click","box":[63.2,37,12.8,22.5],"en":"Tick only <b>ProductTypeName</b>, uncheck <i>Use original column name as prefix</i>, and click <b>OK</b>. <i>Why: we only need the readable category name, not the duplicate ID or description.</i>","ru":"Отметьте только <b>ProductTypeName</b>, снимите галочку <i>Use original column name as prefix</i> и нажмите <b>OK</b>. <i>Зачем: нам нужно только название категории, без дубля ID и описания.</i>"},{"img":"124. merge queries (suppliers).png","act":"click","box":[84.8,13.8,2.7,3.4],"en":"Now merge the suppliers table: in the <b>Home</b> toolbar click <b>Merge queries</b> again. <i>Why: we also need supplier details (name and country) for each product.</i>","ru":"Теперь присоединим таблицу поставщиков: на панели <b>Home</b> снова нажмите <b>Merge queries</b>. <i>Зачем: для каждого товара нужны также данные о поставщике.</i>"},{"img":"125. suppliers id merge.png","act":"select","box":[34,52,18,3.5],"en":"Click the <b>SupplierID</b> column in the top table, then choose <b>2026-2027 IMSALES Suppliers csv</b> as the right table. <i>Why: SupplierID links each product to its supplier.</i>","ru":"Выделите столбец <b>SupplierID</b> в верхней таблице и выберите <b>2026-2027 IMSALES Suppliers csv</b> в списке правой таблицы. <i>Зачем: SupplierID связывает каждый товар с его поставщиком.</i>"},{"img":"126. supplier id outer left ok.png","act":"click","box":[61.7,85.8,3.5,3.8],"en":"Select <b>SupplierID</b> in the bottom table, keep <b>Left outer</b> (77 of 77 rows match), and click <b>OK</b>. <i>This joins the supplier records to the products table.</i>","ru":"Выделите <b>SupplierID</b> в нижней таблице, оставьте <b>Left outer</b> (совпадают все 77 строк) и нажмите <b>OK</b>. <i>Так данные поставщиков присоединяются к таблице товаров.</i>"},{"img":"127. double arrow column company name.png","act":"click","box":[63.5,36.2,12.5,22.8],"en":"Click the <b>expand</b> icon on the Suppliers column. Tick <b>CompanyName</b> (and also <b>Country</b> further down if you want to populate <i>supplier_country</i>), uncheck the prefix box, and click <b>OK</b>. <i>Note: in this screenshot only CompanyName was ticked &mdash; add Country when retaking screenshots.</i>","ru":"Нажмите иконку <b>разворота</b> у столбца Suppliers. Отметьте <b>CompanyName</b> (и <b>Country</b> ниже по списку, чтобы заполнить <i>supplier_country</i>), снимите галочку префикса и нажмите <b>OK</b>. <i>Примечание: на этом скриншоте отмечен только CompanyName &mdash; позже можно доснять кадр с Country.</i>"},{"img":"128. rename to supplier name.png","act":"type","box":[70,23,6.5,2.8],"en":"Double-click the <b>CompanyName</b> header and rename it to <b>SupplierName</b> (and <b>Country</b> to <b>SupplierCountry</b> if included). <i>Why: clear names make column mapping to the staging table effortless.</i>","ru":"Дважды кликните по заголовку <b>CompanyName</b> и переименуйте его в <b>SupplierName</b> (и <b>Country</b> в <b>SupplierCountry</b>, если добавили). <i>Зачем: понятные имена упрощают сопоставление колонок со staging-таблицей.</i>"},{"img":"GUIDE\\135. change type.png","act":"click","box":[45.6,37.5,10.8,2.5],"en":"Click the data type icon on the <b>Discontinued</b> header and choose <b>Whole number</b>. <i>Why: in stg_dim_product, product_discontinued is an integer (0/1), not True/False.</i>","ru":"Нажмите на иконку типа данных в заголовке <b>Discontinued</b> и выберите <b>Whole number</b>. <i>Зачем: в stg_dim_product поле product_discontinued имеет тип целого числа (0/1), а не True/False.</i>"},{"img":"GUIDE\\135.1 change type 123.png","act":"look","box":[54.8,29.5,7,65.5],"en":"Check the result: <b>Discontinued</b> now shows <b>123</b> (Whole number) with values 0 and 1. <i>Why: this prevents type mismatch errors when loading into the warehouse.</i>","ru":"Проверьте результат: у <b>Discontinued</b> теперь тип <b>123</b> (Whole number) и значения 0 / 1. <i>Зачем: это исключает ошибку типов при записи в warehouse.</i>"},{"img":"130. destination.png","act":"click","box":[97.2,90.8,2,2.8],"en":"Now set where the data goes. In the bottom-right panel next to <b>Data destination</b> click <b>+</b> (<i>Add data destination</i>). <i>Why: the dataflow must write the transformed products into our staging warehouse.</i>","ru":"Теперь укажем, куда записывать данные. В правом нижнем углу рядом с <b>Data destination</b> нажмите <b>+</b> (<i>Add data destination</i>). <i>Зачем: dataflow должен сохранить объединённые товары в staging warehouse.</i>"},{"img":"131. destination warehouse.png","act":"click","box":[87.2,78.5,10.3,3],"en":"Choose <b>Warehouse</b>. <i>Why: STG_IMSALES_2026_2027 is a Fabric Warehouse.</i>","ru":"Выберите <b>Warehouse</b>. <i>Зачем: STG_IMSALES_2026_2027 это Fabric Warehouse.</i>"},{"img":"132. select warehouse.png","act":"click","box":[90.3,89.5,3.9,3.7],"en":"Keep the existing warehouse connection and click <b>Next</b>. <i>Why: this authenticates the dataflow to your workspace warehouses.</i>","ru":"Оставьте существующее подключение к warehouse и нажмите <b>Next</b>. <i>Зачем: это даёт dataflow доступ к хранилищам вашего workspace.</i>"},{"img":"133. existing stg dim product.png","act":"select","box":[11.4,83.5,20.1,3.72],"en":"Select <b>Existing table</b>, expand <b>STG_IMSALES_2026_2027 &rarr; dbo</b>, pick <b>stg_dim_product</b>, and click <b>Next</b>. <i>Why: the staging table was already created by the SQL script.</i>","ru":"Выберите <b>Existing table</b>, раскройте <b>STG_IMSALES_2026_2027 &rarr; dbo</b>, отметьте <b>stg_dim_product</b> и нажмите <b>Next</b>. <i>Зачем: staging-таблица уже создана ранее SQL-скриптом.</i>"},{"img":"134. destination settings.png","act":"click","box":[26.79,26.04,5.7,8.6],"en":"Under <b>Update method</b> keep <b>Replace</b> selected. <i>Why: Replace clears old rows before each load so reruns never create duplicates.</i> <i>Append vs Replace: inside the pipeline both work identically because the SQL scripts clear all stg_* tables beforehand. Use <b>Append</b> to keep the table schema untouched (avoid running the dataflow standalone twice without clearing), or <b>Replace</b> when testing a dataflow manually so it overwrites old rows without duplicates.</i>","ru":"В разделе <b>Update method</b> выберите <b>Replace</b>. <i>Зачем: Replace очищает таблицу перед каждой загрузкой, чтобы повторный запуск не плодил дубли.</i> <i>Append или Replace: внутри пайплайна оба варианта работают одинаково, так как SQL-скрипты в начале заранее очищают таблицы stg_*. Используйте <b>Append</b>, чтобы не трогать структуру таблицы (но не запускайте dataflow вручную дважды без очистки), или <b>Replace</b> при ручном тестовом запуске dataflow, чтобы старые строки перезаписывались без дублей.</i>"},{"img":"135. update keys.png","act":"select","box":[11.2,45.5,36.8,37.5],"en":"Map each source column to its destination column (ProductID &rarr; bk_product, ProductName &rarr; product_name, QuantityPerUnit &rarr; product_ship_quantity, UnitPrice &rarr; product_unitprice, Discontinued &rarr; product_discontinued, ProductTypeName &rarr; producttype_name, SupplierName &rarr; supplier_name; and SupplierCountry &rarr; supplier_country if added), then click <b>Save settings</b>. <i>Why: ensures every column lands in the right field with a matching data type.</i>","ru":"Сопоставьте колонки источника и назначения (ProductID &rarr; bk_product, ProductName &rarr; product_name, QuantityPerUnit &rarr; product_ship_quantity, UnitPrice &rarr; product_unitprice, Discontinued &rarr; product_discontinued, ProductTypeName &rarr; producttype_name, SupplierName &rarr; supplier_name; и SupplierCountry &rarr; supplier_country, если добавили), затем нажмите <b>Save settings</b>. <i>Зачем: каждая колонка попадёт в нужное поле с подходящим типом данных.</i>"},{"img":"GUIDE\\141. сопоставить.png","act":"click","box":[87.5,89.3,6.7,3.5],"en":"Verify the final <b>Column mapping</b> (leave <i>product_size</i> and <i>supplier_country</i> as (none) since they are not in the source CSVs) and click <b>Save settings</b>. <i>Why: completes the destination configuration for stg_dim_product.</i>","ru":"Проверьте итоговый <b>Column mapping</b> (<i>product_size</i> и <i>supplier_country</i> остаются (none), так как их нет в исходных CSV) и нажмите <b>Save settings</b>. <i>Зачем: завершает настройку приёмника для stg_dim_product.</i>"},{"img":"136. save close.png","act":"click","box":[4.88,27.96,8.5,2.6],"en":"Open the Save drop-down at the top left and click <b>Save, run &amp; close</b>. <i>Why: saves the dataflow and immediately tests loading stg_dim_product.</i>","ru":"Раскройте меню сохранения в левом верхнем углу и нажмите <b>Save, run &amp; close</b>. <i>Зачем: сохраняет dataflow и сразу запускает тестовую загрузку stg_dim_product.</i>"},{"img":"137. move to folder.png","act":"click","box":[12.1,10.6,5.2,3.2],"en":"Back in the workspace, tick <b>DF LOAD DIM PRODUCT STG</b> and click <b>Move</b> in the toolbar. <i>Why: all staging dataflows belong in the 02 Staging Area folder.</i>","ru":"Вернувшись в workspace, отметьте галочкой <b>DF LOAD DIM PRODUCT STG</b> и нажмите <b>Move</b> на панели. <i>Зачем: все staging-потоки должны лежать в папке 02 Staging Area.</i>"},{"img":"138. staging folder.png","act":"click","box":[25.5,40.5,12.5,4],"en":"In the <b>Move 1 item</b> dialog click <b>02 Staging Area</b>. <i>This opens the staging folder.</i>","ru":"В окне <b>Move 1 item</b> нажмите на папку <b>02 Staging Area</b>. <i>Это откроет папку staging-слоя.</i>"},{"img":"139. here move.png","act":"click","box":[63.8,74.8,5.8,3.8],"en":"Click <b>Move here</b>. <i>Now the product dataflow is organized together with the shipper dataflow and pipeline.</i>","ru":"Нажмите <b>Move here</b>. <i>Теперь dataflow для товаров лежит в одной папке с потоком для перевозчиков и пайплайном.</i>"},{"img":"140. pipeline.png","act":"click","box":[0.2,55,3.6,7],"en":"Open the pipeline <b>PL_IMSALES_LOAD_STG</b> from the left sidebar (or from <b>02 Staging Area</b>). <i>Why: we need to add the new product dataflow to our ETL orchestration.</i>","ru":"Откройте пайплайн <b>PL_IMSALES_LOAD_STG</b> через левую панель (или из папки <b>02 Staging Area</b>). <i>Зачем: нужно добавить новый dataflow товаров в общий ETL-пайплайн.</i>"},{"img":"141. activities dataflow.png","act":"click","box":[11.8,8.6,5.8,3.6],"en":"On the <b>Activities</b> tab click <b>Dataflow</b> to add a new Dataflow activity to the canvas. <i>Why: this block will trigger DF LOAD DIM PRODUCT STG.</i>","ru":"На вкладке <b>Activities</b> нажмите <b>Dataflow</b>, чтобы добавить новую активность на холст. <i>Зачем: этот блок будет запускать DF LOAD DIM PRODUCT STG.</i>"},{"img":"142. name dataflow.png","act":"type","box":[17.6,76,15.8,3.2],"en":"Select the new Dataflow activity and on the <b>General</b> tab set <b>Name</b> to <b>DF Load DIM Product</b>. <i>Why: clear activity names keep the pipeline diagram readable.</i>","ru":"Выделите новую активность Dataflow и на вкладке <b>General</b> задайте <b>Name</b>: <b>DF Load DIM Product</b>. <i>Зачем: понятные имена делают схему пайплайна читаемой.</i>"},{"img":"143. dataflow settings product stg.png","act":"select","box":[17.8,86.2,15.6,3.3],"en":"Open the <b>Settings</b> tab, keep your <b>Workspace</b>, open the <b>Dataflow</b> list and choose <b>DF LOAD DIM PRODUCT STG</b>. <i>Why: links this pipeline step to the product dataflow you just built.</i>","ru":"Откройте вкладку <b>Settings</b>, оставьте свой <b>Workspace</b>, раскройте список <b>Dataflow</b> и выберите <b>DF LOAD DIM PRODUCT STG</b>. <i>Зачем: связывает шаг пайплайна с только что созданным dataflow товаров.</i>"},{"img":"144. relationship wait dataflow prod.png","act":"drag","box":[36.2,30.8,18,16.7],"en":"Drag from the green check mark of <b>Wait for cleaning</b> to <b>DF Load DIM Product</b>. <i>Why: ensures product loading starts only after all staging tables have been cleared.</i>","ru":"Потяните от зелёной галочки <b>Wait for cleaning</b> к блоку <b>DF Load DIM Product</b>. <i>Зачем: загрузка товаров должна начинаться только после очистки staging-таблиц.</i>"},{"img":"145. save.png","act":"click","box":[4.5,9.2,2.3,3.3],"en":"Click <b>Save</b> in the top-left corner to save the updated pipeline. <i>Done: the Product dimension load is now part of your staging pipeline.</i>","ru":"Нажмите <b>Save</b> в левом верхнем углу, чтобы сохранить обновлённый пайплайн. <i>Готово: загрузка измерения Product теперь встроена в ваш staging-пайплайн.</i>"},{"img":"Practicals 4-5\\1. new item.png","act":"click","box":[4.9,10.6,6.7,3.7],"en":"Next is the <b>Staff</b> dimension. In your workspace (renamed here to <i>Guide for Fabric</i> &mdash; use your own workspace) click <b>+ New item</b>. <i>Why: we will create a Dataflow Gen2 to load staff and calculate Age and Seniority.</i>","ru":"Дальше делаем измерение <b>Staff</b>. В вашем workspace (здесь он переименован в <i>Guide for Fabric</i> &mdash; используйте свой) нажмите <b>+ New item</b>. <i>Зачем: создадим Dataflow Gen2 для загрузки сотрудников и расчёта возраста и стажа.</i>"},{"img":"Practicals 4-5\\2. df gen2.png","act":"click","box":[46.1,20.9,7.7,13.9],"en":"Click the <b>Dataflow Gen2</b> card. <i>This opens the new dataflow dialog.</i>","ru":"Нажмите на карточку <b>Dataflow Gen2</b>. <i>Откроется окно создания dataflow.</i>","blur":[[8.75,0.56,7,2.96],[5,5.74,13,3.52],[0,64.29,3.6,4.63]]},{"img":"Practicals 4-5\\3. name df.png","act":"type","box":[39.3,48.3,21.4,4.1],"en":"Type <b>DF LOAD DIM STAFF STG</b> and click <b>Create</b>. <i>Why: keeps the staging naming convention consistent.</i>","ru":"Введите имя <b>DF LOAD DIM STAFF STG</b> и нажмите <b>Create</b>. <i>Зачем: сохраняем единый стиль именования для staging.</i>","blur":[[8.75,0.55,7,2.96],[5,5.73,13,3.51],[0,64.23,3.6,4.62]]},{"img":"Practicals 4-5\\4. get data.png","act":"click","box":[44.6,66.2,15.3,3],"en":"Click <b>Get data from another source</b>. <i>Why: Staff.csv is stored in your lakehouse.</i>","ru":"Нажмите <b>Get data from another source</b>. <i>Зачем: файл Staff.csv лежит в вашем lakehouse.</i>"},{"img":"Practicals 4-5\\5. lakehouse.png","act":"click","box":[15,74.9,39.5,4.16],"en":"In <b>OneLake catalog</b> (click <i>View more</i> if needed) select the <b>LH_IMSALES_SOURCES</b> row with Source type <b>Lakehouse</b> (not SQLEndpoint) for your current workspace (e.g., <i>2026-2027 BI Labs - Stanislav Test</i> or <i>Guide for Fabric</i>). <i>Check: select the Lakehouse matching your own workspace in Location.</i>","ru":"В <b>OneLake catalog</b> (если не видно, нажмите <i>View more</i>) выберите строку <b>LH_IMSALES_SOURCES</b> с типом <b>Lakehouse</b> (не SQLEndpoint) для вашего текущего workspace (например, <i>2026-2027 BI Labs - Stanislav Test</i> или <i>Guide for Fabric</i>). <i>Проверка: выберите Lakehouse, соответствующий вашему workspace в Location.</i>"},{"img":"Practicals 4-5\\6. staff.png","act":"select","box":[12.2,51,20,4.04],"en":"Open <b>Files &rarr; source data</b>, tick <b>2026-2027 IMSALES Staff.csv</b>, and click <b>Create</b>. <i>This loads the staff table into Power Query.</i>","ru":"Откройте <b>Files &rarr; source data</b>, отметьте <b>2026-2027 IMSALES Staff.csv</b> и нажмите <b>Create</b>. <i>Так таблица сотрудников загрузится в Power Query.</i>"},{"img":"Practicals 4-5\\7. use 1st row.png","act":"click","box":[11.2,13.7,12.3,4.2],"en":"On the <b>Transform</b> tab click <b>Use first row as headers</b>. <i>Why: promotes StaffID, LastName, FirstName, BirthDate, HireDate, etc. to column headers.</i>","ru":"На вкладке <b>Transform</b> нажмите <b>Use first row as headers</b>. <i>Зачем: перенесёт StaffID, LastName, FirstName, BirthDate, HireDate и др. в заголовки колонок.</i>"},{"img":"Practicals 4-5\\8. age.png","act":"click","box":[65,18.5,9,3],"en":"Select the <b>BirthDate</b> column, open <b>Add column &rarr; Date &rarr; Age</b>. <i>Why: calculates the duration from each employee's birth date to today.</i>","ru":"Выделите столбец <b>BirthDate</b>, откройте <b>Add column &rarr; Date &rarr; Age</b>. <i>Зачем: посчитает длительность от даты р
