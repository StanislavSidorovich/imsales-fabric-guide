ождения до сегодняшнего дня.</i>"},{"img":"Practicals 4-5\\9. total years.png","act":"click","box":[75,35,7,3],"en":"With the new <b>Age</b> column selected, open <b>Transform &rarr; Duration &rarr; Total years</b>. <i>Why: converts the duration into years.</i>","ru":"Не снимая выделения с новой колонки <b>Age</b>, откройте <b>Transform &rarr; Duration &rarr; Total years</b>. <i>Зачем: переведёт длительность в годы.</i>"},{"img":"Practicals 4-5\\10. round down.png","act":"click","box":[68.5,22.8,6.2,2.8],"en":"Open <b>Transform &rarr; Rounding &rarr; Round down</b>. <i>Why: keeps full completed years as a whole number.</i>","ru":"Откройте <b>Transform &rarr; Rounding &rarr; Round down</b>. <i>Зачем: оставит целое число полных лет.</i>"},{"img":"Practicals 4-5\\11. hire date age.png","act":"click","box":[60.5,13.91,2.6,7.32],"en":"Now select <b>HireDate</b> and click <b>Add column &rarr; Date &rarr; Age</b> again. <i>Why: calculates how long each employee has worked at the company.</i>","ru":"Теперь выделите <b>HireDate</b> и снова нажмите <b>Add column &rarr; Date &rarr; Age</b>. <i>Зачем: посчитает длительность работы сотрудника в компании.</i>"},{"img":"Practicals 4-5\\12. hire date total years.png","act":"click","box":[75,35,7,3],"en":"On the new duration column click <b>Transform &rarr; Duration &rarr; Total years</b>. <i>Converts tenure into years.</i>","ru":"Для новой колонки нажмите <b>Transform &rarr; Duration &rarr; Total years</b>. <i>Переводит стаж в годы.</i>"},{"img":"Practicals 4-5\\13. hire date round down.png","act":"click","box":[68.5,22.8,6.2,2.8],"en":"Click <b>Transform &rarr; Rounding &rarr; Round down</b>. <i>Keeps completed years of seniority.</i>","ru":"Нажмите <b>Transform &rarr; Rounding &rarr; Round down</b>. <i>Оставляет целое число полных лет стажа.</i>"},{"img":"Practicals 4-5\\14. rename seniority.png","act":"type","box":[80,35,8,3],"en":"Double-click the new column header and rename it to <b>Seniority</b>. <i>Why: distinguishes seniority from Age when mapping columns.</i>","ru":"Дважды кликните по заголовку новой колонки и переименуйте её в <b>Seniority</b>. <i>Зачем: чтобы отличать стаж от возраста при маппинге.</i>"},{"img":"Practicals 4-5\\14.1 merge names.png","act":"click","box":[34,13.5,7.5,3],"en":"Select <b>FirstName</b>, hold <b>Ctrl</b> and select <b>LastName</b>, then click <b>Add column &rarr; Merge columns</b>. <i>Why: stg_dim_staff expects a single staff_full_name column.</i>","ru":"Выделите <b>FirstName</b>, зажмите <b>Ctrl</b> и выделите <b>LastName</b>, затем нажмите <b>Add column &rarr; Merge columns</b>. <i>Зачем: в таблице stg_dim_staff есть поле staff_full_name.</i>"},{"img":"Practicals 4-5\\14.2 name column.png","act":"type","box":[41,49,18,14],"en":"Choose <b>Space</b> as Separator, type <b>FullName</b> as New column name, and click <b>OK</b>. <i>Creates FirstName + LastName in one column.</i>","ru":"Выберите разделитель <b>Space</b>, введите имя <b>FullName</b> и нажмите <b>OK</b>. <i>Объединит имя и фамилию через пробел.</i>"},{"img":"Practicals 4-5\\15. add desitnation.png","act":"click","box":[97.2,90.8,2,2.8],"en":"Click <b>+</b> next to <b>Data destination</b> in the bottom-right panel. <i>Why: sets where the cleaned staff data will be saved.</i>","ru":"Нажмите <b>+</b> рядом с <b>Data destination</b> в правом нижнем углу. <i>Зачем: указываем, куда сохранить данные о сотрудниках.</i>"},{"img":"Practicals 4-5\\16. warehouse.png","act":"click","box":[90.25,89.76,3.65,3.6],"en":"Choose <b>Warehouse</b> and click <b>Next</b> on the connection screen. <i>STG_IMSALES_2026_2027 is a Fabric Warehouse.</i>","ru":"Выберите <b>Warehouse</b> и нажмите <b>Next</b> на экране подключения. <i>STG_IMSALES_2026_2027 это Fabric Warehouse.</i>"},{"img":"Practicals 4-5\\17. staff existing table.png","act":"select","box":[10,79.21,14,2.84],"en":"Select <b>Existing table</b>, expand <b>STG_IMSALES_2026_2027 &rarr; dbo</b>, pick <b>stg_dim_staff</b>, and click <b>Next</b>. <i>Targets the staging staff table.</i>","ru":"Выберите <b>Existing table</b>, раскройте <b>STG_IMSALES_2026_2027 &rarr; dbo</b>, отметьте <b>stg_dim_staff</b> и нажмите <b>Next</b>. <i>Указываем целевую таблицу сотрудников.</i>"},{"img":"Practicals 4-5\\18.column mapping.png","act":"select","box":[11.2,49,37,34],"en":"Map <b>StaffID &rarr; bk_staff</b>, <b>LastName &rarr; staff_surname</b>, <b>FullName &rarr; staff_full_name</b>, <b>Age &rarr; staff_age</b>, <b>Seniority &rarr; staff_seniority</b>, <b>staff_photo &rarr; staff_photo_url</b> (leave territory/region/country as (none)) and click <b>Save settings</b>. <i>Matches every available column 1-to-1.</i> <i>Append vs Replace: inside the pipeline both work identically because the SQL scripts clear all stg_* tables beforehand. Use <b>Append</b> to keep the table schema untouched (avoid running the dataflow standalone twice without clearing), or <b>Replace</b> when testing a dataflow manually so it overwrites old rows without duplicates.</i>","ru":"Сопоставьте <b>StaffID &rarr; bk_staff</b>, <b>LastName &rarr; staff_surname</b>, <b>FullName &rarr; staff_full_name</b>, <b>Age &rarr; staff_age</b>, <b>Seniority &rarr; staff_seniority</b>, <b>staff_photo &rarr; staff_photo_url</b> (territory/region/country оставьте (none)) и нажмите <b>Save settings</b>. <i>Точное сопоставление доступных полей.</i> <i>Append или Replace: внутри пайплайна оба варианта работают одинаково, так как SQL-скрипты в начале заранее очищают таблицы stg_*. Используйте <b>Append</b>, чтобы не трогать структуру таблицы (но не запускайте dataflow вручную дважды без очистки), или <b>Replace</b> при ручном тестовом запуске dataflow, чтобы старые строки перезаписывались без дублей.</i>"},{"img":"Practicals 4-5\\19. save and clos.png","act":"click","box":[5,28.83,8.5,2.75],"en":"Open the Save drop-down and click <b>Save, run &amp; close</b>. <i>Saves and runs DF LOAD DIM STAFF STG.</i>","ru":"Раскройте меню сохранения и нажмите <b>Save, run &amp; close</b>. <i>Сохраняет и сразу запускает DF LOAD DIM STAFF STG.</i>"},{"img":"Practicals 4-5\\20. df staff.png","act":"type","box":[17.6,65,15.8,3.2],"en":"Open <b>PL_IMSALES_LOAD_STG</b>, add a <b>Dataflow</b> activity, and set <b>Name</b> to <b>DF Load DIM Staff</b>. <i>Adds staff loading to the pipeline.</i>","ru":"Откройте <b>PL_IMSALES_LOAD_STG</b>, добавьте активность <b>Dataflow</b> и задайте <b>Name</b>: <b>DF Load DIM Staff</b>. <i>Добавляет загрузку сотрудников в пайплайн.</i>"},{"img":"Practicals 4-5\\21. settings df.png","act":"select","box":[17.8,83,15.6,3.3],"en":"On <b>Settings</b> select your Workspace and choose <b>DF LOAD DIM STAFF STG</b>. <i>Links the activity to the staff dataflow.</i>","ru":"На вкладке <b>Settings</b> выберите свой Workspace и <b>DF LOAD DIM STAFF STG</b>. <i>Привязывает активность к dataflow сотрудников.</i>"},{"img":"Practicals 4-5\\22. connect staff df and name wait.png","act":"drag","box":[39,29.11,32.25,9.7],"en":"Connect the green check mark of <b>Wait for cleaning</b> to <b>DF Load DIM Staff</b>. <i>Ensures staff loads only after cleaning finishes.</i>","ru":"Протяните зелёную стрелку от <b>Wait for cleaning</b> к <b>DF Load DIM Staff</b>. <i>Загрузка начнётся только после очистки таблиц.</i>"},{"img":"Practicals 4-5\\23. save pl.png","act":"click","box":[4.5,9.2,2.3,3.3],"en":"Click <b>Save</b> in the pipeline toolbar. <i>Saves the updated pipeline.</i>","ru":"Нажмите <b>Save</b> на верхней панели пайплайна. <i>Сохраняет обновлённый пайплайн.</i>"},{"img":"Practicals 4-5\\24. move to.png","act":"click","box":[12.1,10.6,5.2,3.2],"en":"Back in the workspace, tick <b>DF LOAD DIM STAFF STG</b> and click <b>Move</b>. <i>Keeps the workspace organized.</i>","ru":"В workspace отметьте <b>DF LOAD DIM STAFF STG</b> и нажмите <b>Move</b>. <i>Чтобы поддерживать порядок в папках.</i>"},{"img":"Practicals 4-5\\25. staging.png","act":"click","box":[25.5,40.5,12.5,4],"en":"Select <b>02 Staging Area</b> and click <b>Move here</b>. <i>Moves the staff dataflow into the staging folder.</i>","ru":"Выберите <b>02 Staging Area</b> и нажмите <b>Move here</b>. <i>Переносит dataflow сотрудников в папку staging.</i>","blur":[[8.75,0.55,7,2.95],[5,5.72,13,3.5],[0,64.1,3.6,4.61],[25.9,25.83,10.1,2.95]]},{"img":"Practicals 4-5\\26. new df.png","act":"click","box":[46.1,20.9,7.7,13.9],"en":"Now create the <b>Date</b> dimension. Click <b>+ New item &rarr; Dataflow Gen2</b>. <i>Why: we will generate a full calendar table from scratch (2024&ndash;2026).</i>","ru":"Теперь создадим измерение <b>Date</b>. Нажмите <b>+ New item &rarr; Dataflow Gen2</b>. <i>Зачем: сгенерируем календарь с нуля за 2024&ndash;2026 годы.</i>","blur":[[8.75,0.56,7,2.97],[5,5.75,13,3.52],[0,64.41,3.6,4.63]]},{"img":"Practicals 4-5\\27. name df.png","act":"type","box":[39.3,48.3,21.4,4.1],"en":"Type <b>DF LOAD DIM DATE STG</b> and click <b>Create</b>. <i>Creates the date dataflow.</i>","ru":"Введите имя <b>DF LOAD DIM DATE STG</b> и нажмите <b>Create</b>. <i>Создаёт dataflow для дат.</i>","blur":[[8.75,0.55,7,2.95],[5,5.72,13,3.5],[0,64.1,3.6,4.61]]},{"img":"Practicals 4-5\\28. get data blank query.png","act":"click","box":[18,40.5,8.5,3],"en":"In the toolbar open <b>Get data &rarr; Blank query</b>. <i>Why: dates are generated by a Power Query formula, not read from a CSV.</i>","ru":"На панели инструментов откройте <b>Get data &rarr; Blank query</b>. <i>Зачем: даты генерируются формулой Power Query, а не из CSV.</i>"},{"img":"Practicals 4-5\\29. code from helper file.png","act":"select","box":[4,31.5,52,3],"en":"Copy the <b>List.Dates(...)</b> formula from <i>Useful HELPER file for Labs 4-5-6.sql</i> (or click Copy below). <i>Generates one row per day from 2024-01-01 to 2026-12-31.</i>","ru":"Скопируйте формулу <b>List.Dates(...)</b> из файла <i>Useful HELPER file for Labs 4-5-6.sql</i> (или нажмите Копировать ниже). <i>Создаёт по строке на каждый день с 2024-01-01 по 2026-12-31.</i>","code":"List.Dates(#date(2024,1,1), Number.From(#date(2027,1,1)) - Number.From(#date(2024,1,1)), #duration(1,0,0,0))"},{"img":"Practicals 4-5\\30. run query.png","act":"click","box":[90.5,91,4,3.5],"en":"Paste the formula into the <b>Blank query</b> editor and click <b>Next</b>. <i>Runs the date list generator.</i>","ru":"Вставьте формулу в редактор <b>Blank query</b> и нажмите <b>Next</b>. <i>Запускает генератор списка дат.</i>","code":"List.Dates(#date(2024,1,1), Number.From(#date(2027,1,1)) - Number.From(#date(2024,1,1)), #duration(1,0,0,0))"},{"img":"Practicals 4-5\\31. to table.png","act":"click","box":[4.8,13.8,2.8,6],"en":"Open the <b>List tools</b> tab and click <b>To table</b>. <i>Why: converts the list into a table so we can add columns.</i>","ru":"Откройте вкладку <b>List tools</b> и нажмите <b>To table</b>. <i>Зачем: преобразует список в таблицу, чтобы добавлять колонки.</i>"},{"img":"Practicals 4-5\\32. to table ok.png","act":"click","box":[54.5,59.5,3.5,3.5],"en":"Keep default settings and click <b>OK</b>. <i>Creates Column1 with all dates.</i>","ru":"Оставьте настройки по умолчанию и нажмите <b>OK</b>. <i>Создаёт таблицу с одной колонкой Column1.</i>"},{"img":"Practicals 4-5\\33. proper date.png","act":"type","box":[20,35.5,7.5,2.8],"en":"Double-click <b>Column1</b> and rename it to <b>proper_date</b>. <i>Matches the destination column name in stg_dim_date.</i>","ru":"Дважды кликните по <b>Column1</b> и переименуйте в <b>proper_date</b>. <i>Совпадает с именем колонки в stg_dim_date.</i>"},{"img":"Practicals 4-5\\34. to date type.png","act":"click","box":[19.8,35.5,2,2.8],"en":"Click the data type icon next to <b>proper_date</b> and choose <b>Date</b>. <i>Why: enables all Date extraction tools on the Add column tab.</i>","ru":"Нажмите на иконку типа данных слева от <b>proper_date</b> и выберите <b>Date</b>. <i>Зачем: активирует все инструменты даты на вкладке Add column.</i>"},{"img":"Practicals 4-5\\35. year.png","act":"click","box":[63.2,35.5,5.5,3],"en":"Select <b>proper_date</b>, then click <b>Add column &rarr; Date &rarr; Year &rarr; Year</b>. <i>Extracts the year number.</i>","ru":"Выделите <b>proper_date</b> и нажмите <b>Add column &rarr; Date &rarr; Year &rarr; Year</b>. <i>Извлекает номер года.</i>"},{"img":"Practicals 4-5\\36. rename and whole number.png","act":"type","box":[25.81,34.93,7.19,3.37],"en":"Rename the new column to <b>year</b> and ensure its type is <b>Whole number (123)</b>. <i>Matches stg_dim_date.year.</i>","ru":"Переименуйте новую колонку в <b>year</b> и проверьте тип <b>Whole number (123)</b>. <i>Соответствует stg_dim_date.year.</i>"},{"img":"Practicals 4-5\\37. monrh.png","act":"click","box":[63.2,37.99,6,2.96],"en":"Select <b>proper_date</b> again and click <b>Add column &rarr; Date &rarr; Month &rarr; Month</b>. <i>Extracts the month number (1&ndash;12).</i>","ru":"Снова выделите <b>proper_date</b> и нажмите <b>Add column &rarr; Date &rarr; Month &rarr; Month</b>. <i>Извлекает номер месяца (1&ndash;12).</i>"},{"img":"Practicals 4-5\\38. month_number whole.png","act":"type","box":[32.31,34.81,8.69,3.49],"en":"Rename it to <b>month_number</b> (type <b>Whole number</b>). <i>Matches stg_dim_date.month_number.</i>","ru":"Переименуйте в <b>month_number</b> (тип <b>Whole number</b>). <i>Соответствует stg_dim_date.month_number.</i>"},{"img":"Practicals 4-5\\39. name of month.png","act":"click","box":[62.89,49.71,6.61,4.17],"en":"Select <b>proper_date</b> and click <b>Add column &rarr; Date &rarr; Month &rarr; Name of Month</b>. <i>Extracts full month names (January, February...).</i>","ru":"Выделите <b>proper_date</b> и нажмите <b>Add column &rarr; Date &rarr; Month &rarr; Name of Month</b>. <i>Извлекает полное название месяца.</i>"},{"img":"Practicals 4-5\\40. name of mnth text.png","act":"type","box":[39.13,34.93,8,2.8],"en":"Rename it to <b>month_name</b> (type <b>Text</b>). <i>Matches stg_dim_date.month_name.</i>","ru":"Переименуйте в <b>month_name</b> (тип <b>Text</b>). <i>Соответствует stg_dim_date.month_name.</i>"},{"img":"Practicals 4-5\\41. day.png","act":"click","box":[62.45,45.93,6.75,4.78],"en":"Select <b>proper_date</b> and click <b>Add column &rarr; Date &rarr; Day &rarr; Day</b>. <i>Extracts the day of the month (1&ndash;31).</i>","ru":"Выделите <b>proper_date</b> и нажмите <b>Add column &rarr; Date &rarr; Day &rarr; Day</b>. <i>Извлекает день месяца (1&ndash;31).</i>"},{"img":"Practicals 4-5\\42. monthday whole nm.png","act":"type","box":[45.6,34.99,8.65,2.38],"en":"Rename it to <b>monthday_number</b> (type <b>Whole number</b>). <i>Matches stg_dim_date.monthday_number.</i>","ru":"Переименуйте в <b>monthday_number</b> (тип <b>Whole number</b>). <i>Соответствует stg_dim_date.monthday_number.</i>"},{"img":"Practicals 4-5\\43. name of day.png","act":"click","box":[63.2,63.07,5.8,2.97],"en":"Select <b>proper_date</b> and click <b>Add column &rarr; Date &rarr; Day &rarr; Name of Day</b>. <i>Extracts weekday names (Monday, Tuesday...).</i>","ru":"Выделите <b>proper_date</b> и нажмите <b>Add column &rarr; Date &rarr; Day &rarr; Name of Day</b>. <i>Извлекает название дня недели.</i>"},{"img":"Practicals 4-5\\44. rename text.png","act":"type","box":[54.25,35.41,7.05,2.41],"en":"Rename it to <b>weekday_name</b> (type <b>Text</b>). <i>Matches stg_dim_date.weekday_name.</i>","ru":"Переименуйте в <b>weekday_name</b> (тип <b>Text</b>). <i>Соответствует stg_dim_date.weekday_name.</i>"},{"img":"Practicals 4-5\\45. quarter of year.png","act":"click","box":[62.89,41.22,6.61,2.94],"en":"Select <b>proper_date</b> and click <b>Add column &rarr; Date &rarr; Quarter &rarr; Quarter of Year</b>. <i>Extracts quarter number (1&ndash;4).</i>","ru":"Выделите <b>proper_date</b> и нажмите <b>Add column &rarr; Date &rarr; Quarter &rarr; Quarter of Year</b>. <i>Извлекает номер квартала (1&ndash;4).</i>"},{"img":"Practicals 4-5\\46. rename and text.png","act":"type","box":[61.25,34.98,7.9,3.31],"en":"Rename it to <b>quarter_number</b> (type <b>Whole number</b>). <i>Matches stg_dim_date.quarter_number.</i>","ru":"Переименуйте в <b>quarter_number</b> (тип <b>Whole number</b>). <i>Соответствует stg_dim_date.quarter_number.</i>"},{"img":"Practicals 4-5\\47. custom column.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Now add the remaining columns via <b>Add column &rarr; Custom column</b>. Click <b>Custom column</b>. <i>First up: sk_date.</i>","ru":"Теперь добавим остальные колонки через <b>Add column &rarr; Custom column</b>. Нажмите <b>Custom column</b>. <i>Первая колонка: sk_date.</i>"},{"img":"Practicals 4-5\\48. sk_date.png","act":"type","box":[34,38,22,15],"en":"Name: <b>sk_date</b>, Data type: <b>Whole number</b>. Paste the formula below and click <b>OK</b>. <i>Creates YYYYMMDD surrogate date keys (e.g. 20240101).</i>","ru":"Имя: <b>sk_date</b>, тип: <b>Whole number</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Создаёт ключ даты формата YYYYMMDD (например, 20240101).</i>","code":"[year] * 10000 + [month_number] * 100 + [monthday_number]"},{"img":"Practicals 4-5\\49. custom column.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>weekday_number</b>.","ru":"Нажмите <b>Custom column</b> для <b>weekday_number</b>."},{"img":"Practicals 4-5\\50. weekday number.png","act":"type","box":[34,38,22,15],"en":"Name: <b>weekday_number</b>, Data type: <b>Whole number</b>. Paste the formula below and click <b>OK</b>. <i>Returns 1 (Monday) to 7 (Sunday).</i>","ru":"Имя: <b>weekday_number</b>, тип: <b>Whole number</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Возвращает от 1 (понедельник) до 7 (воскресенье).</i>","code":"Date.DayOfWeek([proper_date], Day.Monday) + 1"},{"img":"Practicals 4-5\\51. custom column.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>day_name_short</b>.","ru":"Нажмите <b>Custom column</b> для <b>day_name_short</b>."},{"img":"Practicals 4-5\\52. day name short.png","act":"type","box":[34,38,22,15],"en":"Name: <b>day_name_short</b>, Data type: <b>Text</b>. Paste the formula below and click <b>OK</b>. <i>Extracts 3-letter weekday names (Mon, Tue...).</i>","ru":"Имя: <b>day_name_short</b>, тип: <b>Text</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Берёт первые 3 буквы дня недели (Mon, Tue...).</i>","code":"Text.Start([weekday_name], 3)"},{"img":"Practicals 4-5\\53. custom clm.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>weekday_type</b>.","ru":"Нажмите <b>Custom column</b> для <b>weekday_type</b>."},{"img":"Practicals 4-5\\54. weeekday type.png","act":"type","box":[34,38,22,15],"en":"Name: <b>weekday_type</b>, Data type: <b>Text</b>. Paste the formula below and click <b>OK</b>. <i>Labels each day as Weekday or Weekend.</i>","ru":"Имя: <b>weekday_type</b>, тип: <b>Text</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Разделяет дни на Weekday и Weekend.</i>","code":"if [weekday_number] >= 6 then \"Weekend\" else \"Weekday\""},{"img":"Practicals 4-5\\55. custom clm.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>is_special</b>.","ru":"Нажмите <b>Custom column</b> для <b>is_special</b>."},{"img":"Practicals 4-5\\56. is_special.png","act":"type","box":[33.9,37.93,22.6,27.62],"en":"Name: <b>is_special</b>, Data type: <b>Text</b>. Paste the public holidays formula from the HELPER file (below) and click <b>OK</b>. <i>Marks Portuguese public holidays.</i>","ru":"Имя: <b>is_special</b>, тип: <b>Text</b>. Вставьте формулу праздников из HELPER-файла (ниже) и нажмите <b>OK</b>. <i>Отмечает государственные праздники Португалии.</i>","code":"if [monthday_number] = 1 and [month_number] = 1 then \"New Year's Day\" else\nif [monthday_number] = 25 and [month_number] = 4 then \"Freedom Day\" else\nif [monthday_number] = 1 and [month_number] = 5 then \"Labour Day\" else\nif [monthday_number] = 10 and [month_number] = 6 then \"Portugal Day\" else\nif [monthday_number] = 25 and [month_number] = 12 then \"Christmas Day\" else \"\""},{"img":"Practicals 4-5\\57. custom colm.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>full_date</b>.","ru":"Нажмите <b>Custom column</b> для <b>full_date</b>."},{"img":"Practicals 4-5\\58. full_date.png","act":"type","box":[34,38,22,15],"en":"Name: <b>full_date</b>, Data type: <b>Text</b>. Paste the full_date formula from the HELPER file (below) and click <b>OK</b>. <i>Builds readable text dates (e.g. Monday, 1 of January of 2024).</i>","ru":"Имя: <b>full_date</b>, тип: <b>Text</b>. Вставьте формулу full_date из HELPER-файла (ниже) и нажмите <b>OK</b>. <i>Формирует полную текстовую дату.</i>","code":"[weekday_name] & \", \" & Text.From([monthday_number]) & \" of \" & [month_name] & \" of \" & Text.From([year])"},{"img":"Practicals 4-5\\59. custom clm'.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>month_name_short</b>.","ru":"Нажмите <b>Custom column</b> для <b>month_name_short</b>."},{"img":"Practicals 4-5\\60. month name short.png","act":"type","box":[34,38,22,15],"en":"Name: <b>month_name_short</b>, Data type: <b>Text</b>. Paste the formula below and click <b>OK</b>. <i>Extracts 3-letter month abbreviations (Jan, Feb...).</i>","ru":"Имя: <b>month_name_short</b>, тип: <b>Text</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Берёт первые 3 буквы названия месяца (Jan, Feb...).</i>","code":"Text.Start([month_name], 3)"},{"img":"Practicals 4-5\\61. custom colm.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>quarter_name_short</b>.","ru":"Нажмите <b>Custom column</b> для <b>quarter_name_short</b>."},{"img":"Practicals 4-5\\62. qrt name short.png","act":"type","box":[34,38,22,15],"en":"Name: <b>quarter_name_short</b>, Data type: <b>Text</b>. Paste the formula below and click <b>OK</b>. <i>Builds Q1&ndash;Q4 labels.</i>","ru":"Имя: <b>quarter_name_short</b>, тип: <b>Text</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Создаёт подписи Q1&ndash;Q4.</i>","code":"\"Q\" & Text.From([quarter_number])"},{"img":"Practicals 4-5\\63. custom col.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>quarter_name</b>.","ru":"Нажмите <b>Custom column</b> для <b>quarter_name</b>."},{"img":"Practicals 4-5\\64. quarter name.png","act":"type","box":[34,38,22,15],"en":"Name: <b>quarter_name</b>, Data type: <b>Text</b>. Paste the formula below and click <b>OK</b>. <i>Builds Quarter 1&ndash;4 labels.</i>","ru":"Имя: <b>quarter_name</b>, тип: <b>Text</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Создаёт подписи Quarter 1&ndash;4.</i>","code":"\"Quarter \" & Text.From([quarter_number])"},{"img":"Practicals 4-5\\65. custom colm.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>semester_number</b>.","ru":"Нажмите <b>Custom column</b> для <b>semester_number</b>."},{"img":"Practicals 4-5\\66. semester number.png","act":"type","box":[34,38,22,15],"en":"Name: <b>semester_number</b>, Data type: <b>Whole number</b>. Paste the formula below and click <b>OK</b>. <i>Returns 1 (Jan&ndash;Jun) or 2 (Jul&ndash;Dec).</i>","ru":"Имя: <b>semester_number</b>, тип: <b>Whole number</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Возвращает 1 (янв&ndash;июн) или 2 (июл&ndash;дек).</i>","code":"if [month_number] <= 6 then 1 else 2"},{"img":"Practicals 4-5\\67. custom cl.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>semester_name_short</b>.","ru":"Нажмите <b>Custom column</b> для <b>semester_name_short</b>."},{"img":"Practicals 4-5\\68. semeste name short.png","act":"type","box":[34,38,22,15],"en":"Name: <b>semester_name_short</b>, Data type: <b>Text</b>. Paste the formula below and click <b>OK</b>. <i>Builds S1 / S2 labels.</i>","ru":"Имя: <b>semester_name_short</b>, тип: <b>Text</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Создаёт подписи S1 / S2.</i>","code":"\"S\" & Text.From([semester_number])"},{"img":"Practicals 4-5\\69. custom col.png","act":"click","box":[9.2,13.8,3,6.2],"en":"Click <b>Custom column</b> for <b>semester_name</b>.","ru":"Нажмите <b>Custom column</b> для <b>semester_name</b>."},{"img":"Practicals 4-5\\70 .semester name.png","act":"type","box":[34,38,22,15],"en":"Name: <b>semester_name</b>, Data type: <b>Text</b>. Paste the formula below and click <b>OK</b>. <i>Builds Semester 1 / Semester 2 labels.</i>","ru":"Имя: <b>semester_name</b>, тип: <b>Text</b>. Вставьте формулу ниже и нажмите <b>OK</b>. <i>Создаёт подписи Semester 1 / Semester 2.</i>","code":"\"Semester \" & Text.From([semester_number])"},{"img":"Practicals 4-5\\71. prop query name dim_date.png","act":"type","box":[83.88,34,14.62,3.2],"en":"In <b>Query settings &rarr; Name</b> rename the query from Query1 to <b>dim_date</b>. <i>Why: gives the query a clean, meaningful name.</i>","ru":"В панели справа <b>Query settings &rarr; Name</b> переименуйте запрос из Query1 в <b>dim_date</b>. <i>Зачем: понятное имя запроса.</i>"},{"img":"Practicals 4-5\\72. dest warehs.png","act":"click","box":[97.2,90.8,2,2.8],"en":"Click <b>+</b> next to <b>Data destination</b> and choose <b>Warehouse</b>. <i>Why: saves the generated dates into STG_IMSALES_2026_2027.</i>","ru":"Нажмите <b>+</b> рядом с <b>Data destination</b> и выберите <b>Warehouse</b>. <i>Зачем: сохранит календарь в STG_IMSALES_2026_2027.</i>"},{"img":"Practicals 4-5\\73. wrh.png","act":"click","box":[90.3,89.5,3.9,3.7],"en":"Keep the warehouse connection and click <b>Next</b>.","ru":"Оставьте подключение к warehouse и нажмите <b>Next</b>."},{"img":"Practicals 4-5\\74. exist dim.png","act":"select","box":[14.5,64.78,9.5,2.78],"en":"Select <b>Existing table</b>, expand <b>STG_IMSALES_2026_2027 &rarr; dbo</b>, pick <b>stg_dim_date</b>, and click <b>Next</b>.","ru":"Выберите <b>Existing table</b>, раскройте <b>STG_IMSALES_2026_2027 &rarr; dbo</b>, отметьте <b>stg_dim_date</b> и нажмите <b>Next</b>."},{"img":"Practicals 4-5\\75. col mapping.png","act":"click","box":[87.5,89.3,6.7,3.5],"en":"All 19 columns map automatically! Verify them and click <b>Save settings</b>. <i>Because we named every column identically to stg_dim_date.</i> <i>Append vs Replace: inside the pipeline both work identically because the SQL scripts clear all stg_* tables beforehand. Use <b>Append</b> to keep the table schema untouched (avoid running the dataflow standalone twice without clearing), or <b>Replace</b> when testing a dataflow manually so it overwrites old rows without duplicates.</i>","ru":"Все 19 колонок сопоставились автоматически! Проверьте их и нажмите <b>Save settings</b>. <i>Благодаря тому, что имена колонок совпадают со stg_dim_date.</i> <i>Append или Replace: внутри пайплайна оба варианта работают одинаково, так как SQL-скрипты в начале заранее очищают таблицы stg_*. Используйте <b>Append</b>, чтобы не трогать структуру таблицы (но не запускайте dataflow вручную дважды без очистки), или <b>Replace</b> при ручном тестовом запуске dataflow, чтобы старые строки перезаписывались без дублей.</i>"},{"img":"Practicals 4-5\\76. save and close.png","act":"click","box":[4.94,31.79,8.5,2.76],"en":"Open the Save drop-down and click <b>Save, run &amp; close</b>. <i>Saves and runs DF LOAD DIM DATE STG.</i>","ru":"Раскройте меню сохранения и нажмите <b>Save, run &amp; close</b>. <i>Сохраняет и запускает DF LOAD DIM DATE STG.</i>"},{"img":"Practicals 4-5\\77. new df.png","act":"click","box":[62,9.85,5.5,3.47],"en":"Open <b>PL_IMSALES_LOAD_STG</b> and click <b>Activities &rarr; Dataflow</b>. <i>Adds the Date dimension activity to the pipeline.</i>","ru":"Откройте <b>PL_IMSALES_LOAD_STG</b> и нажмите <b>Activities &rarr; Dataflow</b>. <i>Добавляет шаг загрузки дат в пайплайн.</i>"},{"img":"Practicals 4-5\\78. new dim_d.png","act":"select","box":[17.8,88.16,15.2,3.23],"en":"Name it <b>DF Load DIM Date</b> on General, then on <b>Settings</b> select <b>DF LOAD DIM DATE STG</b>. <i>Links the activity to the date dataflow.</i>","ru":"Назовите активность <b>DF Load DIM Date</b> на вкладке General, затем на <b>Settings</b> выберите <b>DF LOAD DIM DATE STG</b>. <i>Связывает шаг с dataflow дат.</i>"},{"img":"Practicals 4-5\\79. connect to wait.png","act":"drag","box":[39,34.6,33.25,23.34],"en":"Drag from the green check mark of <b>Wait for cleaning</b> to <b>DF Load DIM Date</b>. <i>All 5 dimensions now run in parallel after cleaning!</i>","ru":"Протяните зелёную стрелку от <b>Wait for cleaning</b> к <b>DF Load DIM Date</b>. <i>Теперь все 5 измерений запускаются параллельно после очистки!</i>"},{"img":"Practicals 4-5\\80. save.png","act":"click","box":[4.5,9.2,2.3,3.3],"en":"Click <b>Save</b> in the top-left corner to save the pipeline.","ru":"Нажмите <b>Save</b> в левом верхнем углу, чтобы сохранить пайплайн."},{"img":"Practicals 4-5\\81. stage.png","act":"click","box":[26.9,39.23,11.8,4.03],"en":"In the workspace tick <b>DF LOAD DIM DATE STG</b> and click <b>Move</b> (or open <b>... &rarr; Move to</b>). <i>Keeps staging items together.</i>","ru":"В workspace отметьте <b>DF LOAD DIM DATE STG</b> и нажмите <b>Move</b> (или откройте <b>... &rarr; Move to</b>). <i>Чтобы все staging-элементы лежали в одной папке.</i>","blur":[[8.75,0.55,7,2.93],[5,5.68,13,3.48],[0,63.7,3.6,4.58]]},{"img":"Practicals 4-5\\82. to stage.png","act":"click","box":[25.5,40.5,12.5,4],"en":"Click <b>02 Staging Area</b> and then <b>Move here</b>. <i>All 5 dimension loads are now complete and organized!</i>","ru":"Выберите <b>02 Staging Area</b> и нажмите <b>Move here</b>. <i>Все 5 измерений готовы и разложены по папкам!</i>","blur":[[8.75,0.55,7,2.96],[5,5.73,13,3.51],[0,64.25,3.6,4.62],[25.9,25.88,10.1,2.96]]},{"img":"Practicals 4-5\\79. connect to wait.png","act":"look","box":[58,20,38,42],"en":"<b>Coming Soon &mdash; Fact Tables &amp; Second Wait:</b> After all 5 dimensions (Client, Shipper, Product, Staff, Date) finish, we will add: (1) a second <b>Wait</b> activity (<i>Wait for Dimension loads</i>), (2) <b>DF Inventory</b> to filter &amp; aggregate inventory transactions into <i>stg_fact_inventory</i>, and (3) <b>DF Sales</b> to load <i>stg_fact_sales</i>.","ru":"<b>Coming Soon (Скоро     const list = modified.size ? Array.from(modified).sort((a,b)=>a-b) : [i];
    list.forEach(idx => {
      out[idx + 1] = {
        img: STEPS[idx].img,
        box_pct: STEPS[idx].box,
        box_2000: boxTo2000(STEPS[idx].box),
        blur_pct: STEPS[idx].blur || []
      };
    });
    return out;
  }

  function downloadFile(name, content, type){
    const url = URL.createObjectURL(new Blob([content], {type}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function enableEdit(on){
    editOn = on;
    document.body.classList.toggle("edit-mode", on);
    if (on) {
      ensureEditHandles();
      if (!bar) {
        bar = document.createElement("div");
        bar.className = "ebar";
        infoEl = document.createElement("span");
        infoEl.style.flex = "1";
        const bBlur = document.createElement("button"); bBlur.textContent = "+ Add Blur";
        bBlur.onclick = () => {
          if (!STEPS[i].blur) STEPS[i].blur = [];
          STEPS[i].blur.push([10, 6, 16, 4]);
          modified.add(i); renderBlurs(); updateInfo();
        };
        const bReset = document.createElement("button"); bReset.textContent = "Reset step";
        bReset.onclick = () => {
          STEPS[i].box = origBoxes[i].slice();
          if (origBlurs[i].length) STEPS[i].blur = origBlurs[i].map(b => b.slice());
          else delete STEPS[i].blur;
          modified.delete(i); render(); updateInfo();
        };
        const bCopy = document.createElement("button"); bCopy.textContent = "Copy JSON";
        bCopy.onclick = () => {
          const txt = JSON.stringify(buildFixesPayload(), null, 2);
          if (navigator.clipboard) navigator.clipboard.writeText(txt);
          bCopy.textContent = "Copied!"; setTimeout(() => bCopy.textContent = "Copy JSON", 1200);
        };
        const bJson = document.createElement("button"); bJson.textContent = "Download JSON";
        bJson.onclick = () => downloadFile("boxes-fixes.json", JSON.stringify(buildFixesPayload(), null, 2), "application/json");
        const bHtml = document.createElement("button"); bHtml.className = "primary"; bHtml.textContent = "Download HTML";
        bHtml.onclick = () => {
          const clone = document.documentElement.cloneNode(true);
          clone.querySelector("body").className = "";
          clone.querySelector("#img").removeAttribute("src");
          clone.querySelector("#dots").innerHTML = "";
          clone.querySelector("#sections").innerHTML = "";
          clone.querySelectorAll(".bl").forEach(el => el.remove());
          const eb = clone.querySelector(".ebar"); if (eb) eb.remove();
          clone.querySelectorAll(".eh").forEach(el => el.remove());
          const appEl = clone.querySelector("#app");
          const src = appEl.textContent;
          const marker = "const STEPS = ";
          const s0 = src.indexOf(marker);
          const a0 = src.indexOf("[", s0);
          const m = src.slice(a0).match(/;\r?\nconst IMAGES/);
          const a1 = m ? a0 + m.index : src.indexOf(";\n", a0);
          appEl.textContent = src.slice(0, a0) + JSON.stringify(STEPS) + src.slice(a1);
          const fname = location.pathname.endsWith("guide-v2.html") ? "guide-v2.html" : (location.pathname.endsWith("Fabric%20guide.html") ? "Fabric guide.html" : "index.html");
          downloadFile(fname, "<!doctype html>\n" + clone.outerHTML, "text/html");
        };
        const bClose = document.createElement("button"); bClose.textContent = "Exit Edit";
        bClose.onclick = () => enableEdit(false);
        bar.append(infoEl, bBlur, bReset, bCopy, bJson, bHtml, bClose);
        const stage = document.querySelector(".stage");
        stage.parentNode.insertBefore(bar, stage);
      }
      bar.style.display = "flex";
      updateInfo();
    } else {
      removeEditHandles();
      if (bar) bar.style.display = "none";
    }
  }

  let drag = null;
  $("shot").addEventListener("pointerdown", e => {
    if (!editOn) return;
    if (e.target.classList.contains("bdel")) return;
    const hlEl = e.target.closest("#hl");
    const blEl = e.target.closest(".bl");
    if (!hlEl && !blEl) return;
    e.preventDefault(); e.stopPropagation();
    const dir = e.target.classList.contains("eh") ? e.target.dataset.d : "move";
    const rect = $("shot").getBoundingClientRect();
    const bi = blEl ? Number(blEl.dataset.bi) : -1;
    const targetArr = bi >= 0 ? STEPS[i].blur[bi] : STEPS[i].box;
    drag = { bi, dir, sx: e.clientX, sy: e.clientY, rw: rect.width, rh: rect.height, orig: targetArr.slice() };
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
  });

  window.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = ((e.clientX - drag.sx) / drag.rw) * 100;
    const dy = ((e.clientY - drag.sy) / drag.rh) * 100;
    let [x, y, w, h] = drag.orig;
    const d = drag.dir;
    const rd = v => Math.round(v * 100) / 100;
    if (d === "move") {
      x = Math.max(0, Math.min(100 - w, x + dx));
      y = Math.max(0, Math.min(100 - h, y + dy));
    } else {
      if (d.includes("w")) { const nx = Math.max(0, Math.min(x + w - 0.5, x + dx)); w += x - nx; x = nx; }
      if (d.includes("e")) { w = Math.max(0.5, Math.min(100 - x, w + dx)); }
      if (d.includes("n")) { const ny = Math.max(0, Math.min(y + h - 0.5, y + dy)); h += y - ny; y = ny; }
      if (d.includes("s")) { h = Math.max(0.5, Math.min(100 - y, h + dy)); }
    }
    const next = [rd(x), rd(y), rd(w), rd(h)];
    if (drag.bi >= 0) {
      STEPS[i].blur[drag.bi] = next;
      const el = $("shot").querySelector('.bl[data-bi="' + drag.bi + '"]');
      if (el) {
        el.style.left = next[0] + "%"; el.style.top = next[1] + "%";
        el.style.width = next[2] + "%"; el.style.height = next[3] + "%";
      }
      modified.add(i);
      updateInfo();
    } else {
      STEPS[i].box = next;
      applyBoxLive();
    }
  });

  window.addEventListener("pointerup", () => { drag = null; });

  const origRender = render;
  render = function(){
    origRender();
    renderBlurs();
    if (editOn) { ensureEditHandles(); updateInfo(); }
  };

  document.addEventListener("keydown", e => {
    if (e.ctrlKey && e.shiftKey && (e.key === "E" || e.key === "e")) {
      e.preventDefault();
      enableEdit(!editOn);
    }
  });

  renderBlurs();
  if (editOn) enableEdit(true);
})();

render();
</script>
</body>
</html>
